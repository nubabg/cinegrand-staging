<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Задачи · Администратор</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Цветове по темата от основното приложение (cg_theme). Пет теми —
     две основи (тъмна/светла) с различен акцент. */
  :root {
    --bg: #090E14; --panel: #111A24; --panel-2: #16212D; --panel-3: #1c2a38;
    --text: #ffffff; --muted: #B7C2D0; --muted-2: #94A2B4;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --accent: #E0A93F; --accent-ink: #1a1203; --accent-soft: rgba(224,169,63,.14);
    --blue: #6aa8ff; --blue-soft: rgba(106,168,255,.14);
    --amber: #f2bd52; --amber-soft: rgba(242,189,82,.14);
    --green: #4fd18b; --green-soft: rgba(79,209,139,.14);
    --red: #ff7a7a; --red-soft: rgba(255,122,122,.14); --red-strong: #b42335;
    --gray: #aab4c2; --gray-soft: rgba(170,180,194,.12);
    --shadow: 0 24px 60px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root[data-theme="special-dark"] {
    --bg: #0c151b; --panel: #14232b; --panel-2: #1a2d36; --panel-3: #213844;
    --text: #f4fafb; --muted: #bdcdd3; --muted-2: #9fb3bb; --border: #2a3e47; --border-strong: #3a535e;
    --accent: #34d3a6; --accent-ink: #062018; --accent-soft: rgba(52,211,166,.14);
  }
  :root[data-theme="light"], :root[data-theme="orange"], :root[data-theme="special-light"] {
    --bg: #f4f6f8; --panel: #ffffff; --panel-2: #eef1f5; --panel-3: #e4e9ef;
    --text: #1d2430; --muted: #56606e; --muted-2: #5f6a78;
    --border: #dfe4ea; --border-strong: #c8d0da;
    --accent: #8f5a00; --accent-ink: #ffffff; --accent-soft: rgba(143,90,0,.10);
    --blue: #1d4ed8; --blue-soft: rgba(29,78,216,.09);
    --amber: #92400e; --amber-soft: rgba(217,119,6,.13);
    --green: #166534; --green-soft: rgba(22,101,52,.10);
    --red: #b91c1c; --red-soft: rgba(185,28,28,.09); --red-strong: #b91c1c;
    --gray: #4b5563; --gray-soft: rgba(75,85,99,.10);
    --shadow: 0 20px 48px rgba(15,23,42,.10), 0 3px 10px rgba(15,23,42,.05);
    color-scheme: light;
  }
  :root[data-theme="orange"] { --accent: #b33f0a; --accent-soft: rgba(179,63,10,.10); }
  :root[data-theme="special-light"] { --bg: #edf3f8; --panel-2: #f1f6fa; --border: #dfe8f0; --accent: #00785b; --accent-soft: rgba(0,120,91,.10); }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; }
  .brand img { width: 30px; height: 30px; }
  .brand small { display: block; font-weight: 600; letter-spacing: .12em; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .who { font-size: 13px; color: var(--muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: var(--panel-2); color: var(--text); font-weight: 650; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  .btn:hover { background: var(--panel-3); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .score:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-danger { color: var(--red); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .icon { width: 18px; height: 18px; flex: none; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .card-head { padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--panel-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .crumbs { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs span + span::before { content: "/"; margin: 0 8px; color: var(--muted-2); }
  .card-body { padding: 22px; }
  @media (min-width: 760px) { .card-body { padding: 30px; } }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { border: 1px solid var(--border); background: var(--panel); color: var(--muted); padding: 9px 14px; border-radius: 999px; font-weight: 650; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .count { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--panel-3); color: var(--text); }
  .tab[aria-selected="true"] .count { background: rgba(0,0,0,.18); color: inherit; }

  h1.title { margin: 0 0 22px; font-size: clamp(22px, 4vw, 30px); line-height: 1.2; letter-spacing: -.01em; }
  h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .meta { display: grid; grid-template-columns: 1fr; gap: 20px; font-size: 14px; }
  @media (min-width: 640px) { .meta { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 960px) { .meta { grid-template-columns: 1fr 1fr 1fr; } }
  .meta-item { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
  .meta-item .icon { color: var(--muted-2); margin-top: 2px; }
  .meta-label { color: var(--muted); font-size: 13px; }
  .meta-val { margin-top: 4px; font-weight: 600; }
  .span-2 { grid-column: 1 / -1; }
  @media (min-width: 960px) { .span-2 { grid-column: span 2; } }
  .desc { margin-top: 4px; color: var(--text); opacity: .9; white-space: pre-wrap; font-weight: 400; }
  .section { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }

  .badge { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; border: 1px solid transparent; padding: 3px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.pulse .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .s-assigned { color: var(--blue); background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 30%, transparent); }
  .s-done { color: var(--amber); background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
  .s-rated { color: var(--green); background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
  .s-cancel { color: var(--gray); background: var(--gray-soft); border-color: color-mix(in srgb, var(--gray) 25%, transparent); }
  .tag { display: inline-flex; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 650; background: var(--panel-3); color: var(--text); }
  .tag.p-high { background: var(--amber-soft); color: var(--amber); }
  .tag.p-urgent { background: var(--red-soft); color: var(--red); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

  .person { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--accent-soft); color: var(--accent); flex: none; }
  :root[data-theme="light"] .avatar, :root[data-theme="orange"] .avatar, :root[data-theme="special-light"] .avatar { color: var(--accent); }
  .person small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar input, .toolbar select { min-height: 40px; }
  input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
    width: 100%; min-width: 0; background: var(--panel-2); border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 12px; color: var(--text); }
  textarea { min-height: 96px; resize: vertical; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label { font-size: 13px; font-weight: 650; color: var(--muted); }
  .grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border-strong); background: var(--panel); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 650; cursor: pointer; color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

  /* Таблица със задачите; на телефон — карти. */
  .tlist { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tlist th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
  .tlist td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tlist tbody tr { cursor: pointer; transition: background .15s; animation: rise .35s cubic-bezier(.22,1,.36,1) both; }
  .tlist tbody tr:hover { background: var(--panel-2); }
  .tlist.still tbody tr { animation: none; }
  .tlist .no { color: var(--muted); width: 44px; }
  .tlist .right { text-align: right; white-space: nowrap; color: var(--muted); }
  .t-title { font-weight: 650; }
  .t-sub { font-size: 12.5px; color: var(--muted); }
  @media (max-width: 700px) {
    .tlist thead { display: none; }
    .tlist, .tlist tbody, .tlist tr, .tlist td { display: block; width: 100%; }
    .tlist tr { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; padding: 8px 4px; background: var(--panel); }
    .tlist td { border: 0; padding: 4px 12px; }
    .tlist .no { display: none; }
    .tlist .right { text-align: left; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade { animation: rise .4s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion: reduce) { .fade, .tlist tbody tr { animation: none; } .badge.pulse .dot { animation: none; } }

  .scores { display: flex; gap: 6px; flex-wrap: wrap; }
  .score { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--panel-2); font-weight: 800; cursor: pointer; color: var(--text); }
  .score[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .big-score { font-size: 34px; font-weight: 800; line-height: 1; }
  .big-score small { font-size: 15px; color: var(--muted); font-weight: 600; }
  .note { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; }
  .msg { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
  .msg.err { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 6px 0 18px; }
  .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .staff-row { display: grid; gap: 10px; grid-template-columns: 1fr; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: end; }
  @media (min-width: 820px) { .staff-row { grid-template-columns: 1.2fr 1fr 1.2fr 1fr auto; } }
  /* Обзор */
  .ov { display: grid; gap: 16px; }
  .ov-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .ov-stats { margin: 0; }
  .stat.bad { border-color: var(--red); background: var(--red-soft); }
  .stat.bad b { color: var(--red); }
  .delta { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .delta.up { color: var(--green); } .delta.down { color: var(--red); }
  .ov-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .ov-grid { grid-template-columns: 1fr 1fr; } }
  .ov .card-head h3 { font-size: 15px; }
  .recs { list-style: none; margin: 0; padding: 8px; display: grid; gap: 8px; }
  .rec { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); border-left: 4px solid var(--gray); background: var(--panel-2); }
  .rec-body { flex: 1 1 260px; min-width: 0; line-height: 1.45; }
  .rec-sev { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .rec-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-3); color: var(--muted); flex: none; }
  .rec.high { border-left-color: var(--red); background: var(--red-soft); } .rec.high .rec-sev, .rec.high .rec-ic { color: var(--red); }
  .rec.mid { border-left-color: var(--amber); } .rec.mid .rec-sev, .rec.mid .rec-ic { color: var(--amber); }
  .rec.info { border-left-color: var(--blue); } .rec.info .rec-sev, .rec.info .rec-ic { color: var(--blue); }
  .rec.good { border-left-color: var(--green); } .rec.good .rec-sev, .rec.good .rec-ic { color: var(--green); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 6px; }
  .bar { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
  .bar-in { width: 100%; min-height: 2px; background: var(--green); border-radius: 4px 4px 1px 1px; display: flex; flex-direction: column; overflow: hidden; opacity: .85; }
  .bar-bad { width: 100%; background: var(--red); margin-top: 0; }
  .bar:hover .bar-in { opacity: 1; }
  .bars-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .lg-ok { background: var(--green); } .lg-bad { background: var(--red); }
  .meter { height: 8px; border-radius: 999px; background: var(--panel-3); overflow: hidden; min-width: 60px; margin-bottom: 4px; }
  .meter i { display: block; height: 100%; background: var(--red); border-radius: inherit; }
  .hbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 4px; }
  .hbars .meter i { background: var(--amber); }
  .ov-h4 { margin: 16px 0 8px; font-size: 13px; }
  .bad-text { color: var(--red) !important; }
  .mlbl { display: none; color: var(--muted); font-size: 12.5px; }
  @media (max-width: 700px) { .mlbl { display: inline; } .tlist.static td .t-sub { display: inline; margin-left: 6px; } }
  .ok-mark { color: var(--green); font-weight: 650; }
  .tlist.mini td, .tlist.mini th { padding: 8px 10px; }
  .tlist tr.today td { background: var(--amber-soft); }
  .tlist.static tbody tr { cursor: default; animation: none; }
  .tlist.static tbody tr:hover { background: transparent; }
  img.avatar { display: block; object-fit: cover; background: var(--panel-3); }
  .avatar.adm { background: var(--blue-soft); color: var(--blue); }
  .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
  .avatar.lg { width: 40px; height: 40px; font-size: 14px; }
  .avatar.xl { width: 112px; height: 112px; font-size: 36px; }
  .photo-pick { position: relative; display: inline-block; cursor: pointer; border-radius: 50%; flex: none; }
  .photo-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .photo-badge { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--panel); }
  .photo-badge .icon { width: 11px; height: 11px; }
  .photo-pick.big .photo-badge { width: 32px; height: 32px; right: 2px; bottom: 2px; }
  .photo-pick.big .photo-badge .icon { width: 16px; height: 16px; }
  .profile { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .who-btn { all: unset; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 999px; padding: 2px 8px 2px 2px; }
  .who-btn:focus-visible { outline: 2px solid var(--accent); }
  label.btn { position: relative; }
  @media (max-width: 440px) { .who-btn .who { display: none; } }
  /* Снимка горе вдясно + меню */
  .me-wrap { position: relative; }
  .me-btn { all: unset; cursor: pointer; border-radius: 50%; display: block; box-shadow: 0 0 0 2px var(--border-strong); transition: box-shadow .15s; }
  .me-btn:hover, .me-btn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .me-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .avatar.md { width: 44px; height: 44px; font-size: 16px; }
  .avatar.lg2 { width: 64px; height: 64px; font-size: 22px; }
  .pmenu { position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; width: min(340px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; }
  .pmenu.pop { animation: rise .2s ease both; }
  @media (max-width: 600px) { .pmenu { position: fixed; left: 12px; right: 12px; top: 72px; width: auto; max-height: calc(100vh - 90px); overflow: auto; } }
  .pm-head { display: flex; gap: 14px; align-items: center; }
  .pm-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { .pmenu { animation: none; } }
  .btn-danger-solid { background: var(--red-strong); border-color: var(--red-strong); color: #fff; }
  .btn-danger-solid:hover { background: var(--red-strong); filter: brightness(1.08); }
  .spin { flex: none; }
  .av-wrap { position: relative; display: block; border-radius: 50%; }
  .av-busy { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); }
  .btn-danger-solid, .confirm-row .btn { white-space: nowrap; }
  .spin.light { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  .lg-badge { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; background: var(--panel-3); color: var(--text); }
  .lg-badge.good { background: var(--green-soft); color: var(--green); }
  .lg-badge.warn { background: var(--amber-soft); color: var(--amber); }
  .lg-badge.bad { background: var(--red-soft); color: var(--red); }
  .lg-badge.info { background: var(--blue-soft); color: var(--blue); }
  .lg-badge.muted { background: var(--gray-soft); color: var(--gray); }
  .nowrap { white-space: nowrap; }
  @media (min-width: 820px) { .staff-row.locked { grid-template-columns: 1.2fr 1fr 1.2fr 2fr; } }
  .staff-row.locked .ro { min-height: 40px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--panel-3); color: var(--text); font-weight: 600; }
  .lock-note { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--accent); background: var(--accent-soft); font-size: 13px; color: var(--text); }
  .lock-note .icon { color: var(--accent); width: 22px; height: 22px; }
  .owner-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; }
  .owner-tag .icon { width: 13px; height: 13px; }
  /* Досие */
  .ds-top { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
  .ds-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .ds-grid { grid-template-columns: 1fr 1fr; } }

    if (S.listBusy) return;
    S.listBusy = true; render();
    try {
      const photos = S.photos ? null : loadPhotos();   // снимките — успоредно, не след списъка
      const j = await call("tasksAdminList");
      if (!j.success) throw new Error(j.error);
      S.tasks = j.tasks || []; S.staff = j.staff || []; S.removed = j.removed || [];
      if (S.session && "owner" in j) { S.session.owner = !!j.owner; S.session.ownerStaff = j.ownerStaff || ""; try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(S.session)); } catch (_) {} }
      await photos;
      if (j.photoVer && S.photos && S.photos.ver !== j.photoVer) loadPhotos().then(render);
    } catch (e) { if (!e.handled) S.msg = { kind: "err", text: e.message || String(e) }; }
    finally { S.listBusy = false; }
    render();
  }
  function putTask(task) {
    if (!task || !task.id) return false;
    const i = S.tasks.findIndex((x) => x.id === task.id);
    if (i >= 0) S.tasks[i] = task; else S.tasks.unshift(task);
    return true;
  }
  async function loadPhotos() {
    try { const p = await call("tasksPhotos"); if (p && p.success) S.photos = { ver: p.ver, staff: p.staff || {}, admins: p.admins || {} }; } catch (_) {}
  }
  /* Снимка от телефона/компютъра → квадрат до 160×160 JPEG (≈10 KB). */
  async function shrinkPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(t("Файлът не е снимка."))); i.src = url; });
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, side = Math.min(w, h);
      if (!side) throw new Error(t("Файлът не е снимка."));
      for (const [size, q] of [[160, .82], [128, .72], [96, .62]]) {
        const c = document.createElement("canvas"); c.width = c.height = size;
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, size, size);
        g.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
        const d = c.toDataURL("image/jpeg", q);
        if (d.length <= 44000) return d;
      }
      throw new Error(t("Снимката е твърде голяма."));
    } finally { URL.revokeObjectURL(url); }
  }
  async function loadNames() {

      const m = text.match(/##\s*Списък[\s\S]*$/i);
      return (m ? m[0] : text).split(/\r?\n/).map((l) => l.trim()).filter((l) => l && !l.startsWith("#") && /^[Ѐ-ӿ][Ѐ-ӿ\s]*$/.test(l));
    } catch (_) { return []; }
  }

  async function loadOverview(fresh) {

    S.ovBusy = true; S.ovErr = ""; if (S.tab === "overview") render();
    try {
      const j = await call("tasksOverview", fresh ? { fresh: true } : {});
      if (!j.success) throw new Error(j.error);
      S.ov = j;
    } catch (err) { if (!err.handled) S.ovErr = err.message || String(err); }
    S.ovBusy = false; if (S.tab === "overview") render();
  }
  /* Препоръки: sev = high (червено) / mid (жълто) / info / good (зелено).
     act = бутон „Възложи като задача" с попълнени заглавие, срок и категория. */
  function recommendations(o) {
    const out = [], I = o.inspections || {}, R = o.rooms || {}, K = o.tasks || {}, F = o.lostFound || {};
    const room = (r) => [!r.male && L("мъжка", "men's"), !r.female && L("женска", "women's")].filter(Boolean).join(L(" и ", " and "));
    // Съблекални: днес / следващо / пропуснати.
    if (R.found) {
      const nx = (R.upcoming || [])[0];
      if (nx && nx.days === 0 && (!nx.male || !nx.female)) out.push({ sev: "high", icon: "clock", text: L(`Днес (${nx.date}) трябва да се почистят съблекалните — още не е отчетена: ${room(nx)}.`, `The changing rooms must be cleaned today (${nx.date}) — not reported yet: ${room(nx)}.`),
        act: { title: L("Почистване на съблекалните", "Changing room cleaning"), due: nx.date, category: "Почистване", priority: "Висок" } });
      const next = (R.upcoming || []).find((r) => r.days > 0);
      if (next) out.push({ sev: "info", icon: "cal", text: L(`Следващо почистване на съблекалните: ${next.date} (след ${dd(next.days)}).`, `Next changing room cleaning: ${next.date} (in ${dd(next.days)}).`),
        act: { title: L("Почистване на съблекалните", "Changing room cleaning"), due: next.date, category: "Почистване", priority: "Нормален" } });
      if (!R.upcoming || !R.upcoming.length) out.push({ sev: "mid", icon: "cal", text: L("В листа „Почистване съблекални“ няма бъдещи дати — добавете графика.", "The „Почистване съблекални“ sheet has no future dates — add the schedule.") });
      if (R.missed && R.missed.length) out.push({ sev: "high", icon: "x", text: L(`Пропуснато почистване на съблекалните (${o.days} дни): `, `Missed changing room cleaning (${o.days} days): `) + R.missed.slice(0, 5).map((m) => `${shortD(m.date)} (${room(m)})`).join(", ") + (R.missed.length > 5 ? "…" : "") });
    } else out.push({ sev: "info", icon: "cal", text: L("Листът „Почистване съблекални“ липсва — графикът не може да се следи.", "The „Почистване съблекални“ sheet is missing — the schedule can't be tracked.") });
    // Общ процент проблеми спрямо предишния период.
    if (I.n >= 5 && I.prevN >= 5) {
      const now = pct(I.p, I.n), before = pct(I.prevP, I.prevN);
      if (now - before >= 5) out.push({ sev: "high", icon: "trend", text: L(`Проблемите растат: ${now}% от проверките (преди ${before}%).`, `Problems are rising: ${now}% of inspections (previously ${before}%).`) });
      else if (before - now >= 5) out.push({ sev: "good", icon: "trend", text: L(`Подобрение: ${now}% от проверките с проблем (преди ${before}%).`, `Improvement: ${now}% of inspections with problems (previously ${before}%).`) });
    }
    // Зони с най-много проблеми.
    (I.locations || []).filter((l) => l.n >= 3 && l.p / l.n >= .3).slice(0, 3).forEach((l) => {
      const top = (l.top || []).map((x) => `„${x[0]}“`).join(", ");
      out.push({ sev: l.p / l.n >= .5 ? "high" : "mid", icon: "pin", text: L(`${l.name}: ${pct(l.p, l.n)}% от проверките с проблем (${l.p} от ${l.n}).${top ? " Най-често: " + top + "." : ""} Съсредоточете почистването тук.`,
        `${l.name}: ${pct(l.p, l.n)}% of inspections with problems (${l.p} of ${l.n}).${top ? " Most often: " + top + "." : ""} Focus cleaning here.`),
        act: { title: L(`Основно почистване: ${l.name}`, `Deep clean: ${l.name}`), description: top ? L("Най-чести проблеми: ", "Most frequent problems: ") + top : "", category: "Почистване", priority: l.p / l.n >= .5 ? "Висок" : "Нормален" } });
    });
    // Непроверявани зони.
    const stale = (I.locations || []).filter((l) => l.since != null && l.since >= 3).sort((a, b) => b.since - a.since);
    if (stale.length) out.push({ sev: stale[0].since >= 7 ? "high" : "mid", icon: "eye", text: L("Отдавна непроверявани: ", "Not inspected for a while: ") + stale.slice(0, 4).map((l) => `${l.name} (${dd(l.since)})`).join(", ") + (stale.length > 4 ? "…" : "") + "." });
    // Растящ проблем + най-честият.
    const rising = (I.issues || []).find((x) => x.n >= 3 && (x.prev ? x.n >= x.prev * 1.5 : x.n >= 4));
    if (rising) out.push({ sev: "mid", icon: "trend", text: L(`„${rising.name}“ се среща все по-често: ${rising.n} пъти (преди ${rising.prev}).`, `“${rising.name}” is becoming more frequent: ${rising.n} times (previously ${rising.prev}).`) });
    const top = (I.issues || [])[0];
    if (top && top !== rising && top.n >= 3) out.push({ sev: "info", icon: "info", text: L(`Най-честият проблем е „${top.name}“ — ${top.n} пъти за ${o.days} дни. Обсъдете го на инструктажа.`, `The most frequent problem is “${top.name}” — ${top.n} times in ${o.days} days. Bring it up at the briefing.`) });
    if (I.zeroDays >= 2) out.push({ sev: "mid", icon: "cal", text: L(`${dd(I.zeroDays)} без нито една проверка през последните 2 седмици.`, `${dd(I.zeroDays)} without a single inspection in the last 2 weeks.`) });
    const ins = (I.inspectors || [])[0];
    if (ins && I.n >= 10 && ins.n / I.n >= .5) out.push({ sev: "info", icon: "users", text: L(`${ins.name} прави ${pct(ins.n, I.n)}% от проверките — разпределете ги по-равномерно.`, `${ins.name} does ${pct(ins.n, I.n)}% of the inspections — spread them more evenly.`) });
    // Задачи.
    if (K.overdue) out.push({ sev: "high", icon: "clock", text: plural(K.overdue, "просрочена задача", "просрочени задачи", "overdue task", "overdue tasks") + (K.late && K.late[0] ? L(` — най-много при ${K.late[0][0]} (${K.late[0][1]}).`, ` — most for ${K.late[0][0]} (${K.late[0][1]}).`) : "."), go: "late" });
    if (K.waiting) out.push({ sev: "mid", icon: "star", text: plural(K.waiting, "задача чака", "задачи чакат", "task is waiting", "tasks are waiting") + L(" вашата оценка.", " for your rating."), go: "Изпълнена" });
    if (K.done >= 3 && K.onTime / K.done < .7) out.push({ sev: "mid", icon: "clock", text: L(`Само ${pct(K.onTime, K.done)}% от задачите са изпълнени навреме — по-реалистични срокове или напомняне.`, `Only ${pct(K.onTime, K.done)}% of tasks were done on time — set more realistic due dates or remind people.`) });
    if (K.avg != null && K.rated >= 3 && K.avg < 6) out.push({ sev: "mid", icon: "star", text: L(`Средната оценка на задачите е ${K.avg}/10 — обсъдете очакванията с екипа.`, `The average task rating is ${K.avg}/10 — discuss expectations with the team.`) });
    if (F.old) out.push({ sev: "mid", icon: "box", text: plural(F.old, "вещ чака", "вещи чакат", "item has", "items have") + L(" в Lost & Found повече от 30 дни.", " been waiting in Lost & Found for more than 30 days.") });
    const order = { high: 0, mid: 1, info: 2, good: 3 };
    out.sort((a, b) => order[a.sev] - order[b.sev]);
    if (!out.some((x) => x.sev === "high" || x.sev === "mid")) out.push({ sev: "good", icon: "check", text: L("Няма нищо спешно — всичко изглежда наред.", "Nothing urgent — everything looks fine.") });
    return out;
  }

  function render() {
    if (!S.session) {
      /* Събуждаме Apps Script, докато човек пише паролата — входът е по-бърз. */
      if (!S.warmed) { S.warmed = true; fetch(SHEETS_WEB_APP_URL + "?action=ping&_token=" + encodeURIComponent(SHEETS_SECRET_TOKEN), { redirect: "follow" }).catch(() => {}); }
      app.innerHTML = loginHtml(); bind(); return;
    }

    const view = [S.tab, S.open || "", S.histName || "", S.dossier || "", S.dsEdit ? "e" : ""].join("|");

  function flash(kind, text) { S.msg = { kind, text }; render(); if (kind === "ok") setTimeout(() => { if (S.msg && S.msg.text === text) { S.msg = null; render(); } }, 3500); }

  /* ── Събития ── */
  function bind() {
    const lf = document.getElementById("login-form");
    if (lf) {
      lf.onsubmit = async (e) => {
        e.preventDefault(); if (S.busy) return;
        /* Стойностите се четат преди прерисуването (и при автоматично попълване). */
        const user = document.getElementById("lg-user").value.trim(), pass = document.getElementById("lg-pass").value;
        S.busy = true; S.msg = null; render();
        try {
          const j = await call("tasksLogin", { user, pass });
          if (!j.success) throw new Error(j.error);
          S.session = { user: j.user, token: j.token, owner: !!j.owner, ownerStaff: j.ownerStaff || "", exp: Date.now() + (j.hours || 12) * 3600e3 - 60e3 };
          try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(S.session)); } catch (_) {}
          S.busy = false; S.msg = null; loadOverview(); load(); return;
        } catch (err) { S.msg = { kind: "err", text: err.message || String(err) }; }
        S.busy = false; render();
      };
      if (!S.busy) document.getElementById("lg-user").focus();
    }
    const nf = document.getElementById("new-form");
    if (nf) {
      const f = S.form;
      const sync = () => { f.title = nf.querySelector("#nf-title").value; f.description = nf.querySelector("#nf-desc").value; f.assignee = nf.querySelector("#nf-who").value;
        f.due = nf.querySelector("#nf-due").value; f.category = nf.querySelector("#nf-cat").value; f.priority = nf.querySelector("#nf-prio").value; };
      nf.oninput = sync; nf.onchange = sync;
      nf.onsubmit = async (e) => {
        e.preventDefault(); sync(); if (S.busy) return;
        if (!f.title.trim() || !f.assignee) { flash("err", lang === "en" ? "Fill in the title and the assignee." : "Попълнете заглавие и на кого е задачата."); return; }
        S.busy = true; render();
        try {
          f.id = f.id || newId();
          const j = await call("tasksCreate", { id: f.id, task: { title: f.title, description: f.description, category: f.category, priority: f.priority, assignee: f.assignee, due: isoToBg(f.due) } });
          if (!j.success) throw new Error(j.error);
          S.form = null; S.busy = false; S.tab = "tasks"; S.filter = ""; if (!putTask(j.task)) await load(); flash("ok", t("Задачата е възложена."));
          return;
        } catch (err) { if (!err.handled) S.msg = { kind: "err", text: err.message }; }
        S.busy = false; render();
      };
    }
    const sa = document.getElementById("staff-add");
    if (sa) {
      const nf = S.nstaff;
      const sync = () => { nf.name = sa.querySelector("#ns-name").value; nf.rank = sa.querySelector("#ns-rank").value; nf.position = sa.querySelector("#ns-pos").value; nf.pin = sa.querySelector("#ns-pin").value; };
      sa.oninput = sync;
      sa.onsubmit = async (e) => {
        e.preventDefault(); sync(); if (S.busy) return;
        const name = nf.name.trim().replace(/\s+/g, " ");
        if (!/^[\u0400-\u04FF][\u0400-\u04FF ]{1,59}$/.test(name)) { flash("err", t("Името е на кирилица.")); return; }
        if (nf.pin && !/^\d{4,8}$/.test(nf.pin)) { flash("err", lang === "en" ? "The PIN is 4–8 digits." : "ПИН-ът е от 4 до 8 цифри."); return; }
        S.busy = true; render();
        try {
          const j = await call("tasksStaffAdd", { name, rank: nf.rank, position: nf.position, pin: nf.pin });
          if (!j.success) throw new Error(j.error);
          S.nstaff = null; S.busy = false;
          S.removed = (S.removed || []).filter((y) => y.name !== j.name);
          if (!S.staff.some((y) => y.name === j.name)) S.staff = S.staff.concat([{ name: j.name, rank: nf.rank.trim(), position: nf.position.trim(), hasPin: !!nf.pin }]);
          S.logs = null; flash("ok", t("Служителят е добавен."));
          return;
        } catch (err) { if (!err.handled) S.msg = { kind: "err", text: err.message }; }
        S.busy = false; render();
      };
    }
    document.querySelectorAll("form.staff-row[data-staff]").forEach((fm) => {
      fm.onsubmit = async (e) => {
        e.preventDefault();
        const s = S.staff[+fm.dataset.staff]; const pin = fm.pin.value.trim();
        if (pin && !/^\d{4,8}$/.test(pin)) { flash("err", lang === "en" ? "The PIN is 4–8 digits." : "ПИН-ът е от 4 до 8 цифри."); return; }
        try {
          const btn = fm.querySelector('button[type="submit"]'); btn.disabled = true; btn.innerHTML = `<span class="spin light"></span>${t("Записва се…")}`;
          const j = await call("tasksStaffSave", Object.assign({ name: s.name, rank: fm.rank.value, position: fm.position.value }, pin ? { pin } : {}));
          if (!j.success) throw new Error(j.error);
          Object.assign(s, { rank: fm.rank.value.trim(), position: fm.position.value.trim() }, pin ? { hasPin: true } : {});
          flash("ok", lang === "en" ? `✓ ${s.name} saved.` : `✓ ${s.name} — записано.`);
        } catch (err) { if (!err.handled) flash("err", err.message); else render(); }
      };
    });
    const q = document.getElementById("q");
    if (q) q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
    const who = document.getElementById("who");
    if (who) who.onchange = () => { S.who = who.value; render(); };
    const rc = document.getElementById("rate-comment");
    if (rc) rc.oninput = () => { S.comment = rc.value; };
    const rt = document.getElementById("rm-typed");
    if (rt) rt.oninput = () => {
      S.rmTyped = rt.value;
      const b = rt.closest(".confirm-row").querySelector('[data-act="rm-staff-yes"]');
      b.disabled = rt.value.trim().toLowerCase() !== b.dataset.name.toLowerCase();
    };
    if (rt) rt.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); const b = rt.closest(".confirm-row").querySelector('[data-act="rm-staff-yes"]'); if (!b.disabled) b.click(); } };
    document.querySelectorAll("[data-ds]").forEach((n) => { n.oninput = n.onchange = () => { (S.dsForm = S.dsForm || {})[n.dataset.ds] = n.value; }; });
    const pn = document.getElementById("pf-name");
    if (pn) pn.oninput = () => { S.prof.name = pn.value; };
    const mn = document.getElementById("pm-name");
    if (mn) { mn.oninput = () => { S.prof.name = mn.value; }; mn.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); document.querySelector('.pmenu [data-act="save-profile"]').click(); } }; }
    const lq = document.getElementById("log-q");
    if (lq) lq.oninput = () => { S.logQ = lq.value; const pos = lq.selectionStart; render(); const n = document.getElementById("log-q"); n.focus(); n.setSelectionRange(pos, pos); };
    const lw = document.getElementById("log-who");
    if (lw) lw.onchange = () => { S.logWho = lw.value; render(); };
    document.querySelectorAll("input[data-photo-for]").forEach((inp) => { inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) setPhoto(inp.dataset.photoFor, f); }; });
    ["nt-text", "st-due", "st-note", "st-hours"].forEach((id) => { const n = document.getElementById(id); if (n) n.oninput = n.onchange = syncDetail; });
  }
  /* Нова снимка: "__me" = собственият профил, иначе — служител. */
  /* Снимките се сменят веднага на екрана (оптимистично); записът върви
     във фона. Ако сървърът откаже — връщаме старата и казваме защо. */
  function photoSet(who, photo) {
    const P = S.photos || (S.photos = { ver: "", staff: {}, admins: {} });
    if (who === "__me") { const k = S.session.user.toLowerCase(), a = P.admins[k] || { name: "" }; const old = a.photo || ""; P.admins[k] = Object.assign({}, a, { photo }); return old; }
    const old = P.staff[who] || ""; if (photo) P.staff[who] = photo; else delete P.staff[who]; return old;
  }
  function meMsg(kind, text) { if (S.menu) { S.menuMsg = { kind, text }; render(); } else flash(kind, text); }
  async function savePhoto(who, photo) {
    S.saving = Object.assign({}, S.saving, { [who]: true });
    const old = photoSet(who, photo); render();
    try {
      const j = who === "__me" ? await call("tasksProfileSave", { photo }) : await call("tasksStaffPhoto", { name: who, photo });
      if (!j.success) throw new Error(j.error);
      if (j.ver && S.photos) S.photos.ver = j.ver;
      delete S.saving[who];
      meMsg("ok", photo ? t("Снимката е записана.") : t("Записано."));
    } catch (err) { photoSet(who, old); delete S.saving[who]; if (!err.handled) meMsg("err", err.message); else render(); }
  }
  async function setPhoto(who, file) {
    if (S.saving && S.saving[who]) return;
    let photo;
    try { photo = await shrinkPhoto(file); } catch (err) { meMsg("err", err.message); return; }
    savePhoto(who, photo);
  }
  /* Полетата в детайла пазят стойностите си при прерисуване. */
  function syncDetail() {
    const v = (id) => { const n = document.getElementById(id); return n ? n.value : null; };
    if (v("nt-text") != null) S.noteText = v("nt-text");
    if (S.st) { if (v("st-due") != null) S.st.due = v("st-due"); if (v("st-note") != null) S.st.note = v("st-note"); if (v("st-hours") != null) S.st.hours = v("st-hours"); }
  }
  app.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-act],[data-tab],[data-filter],[data-open],[data-score],[data-hist],[data-st]");
    if (!el) return;
    if (el.dataset.tab === "overview" && !S.ov) loadOverview();
    if (el.dataset.tab === "logs") { S.menu = false; loadLogs(); }
    if (el.dataset.tab) { S.tab = el.dataset.tab; S.open = null; S.msg = null; S.histName = ""; S.prof = null; S.dossier = ""; render(); return; }
    if (el.dataset.filter != null && el.classList.contains("chip")) { S.filter = el.dataset.filter; render(); return; }
    if (el.dataset.open) { S.open = el.dataset.open; S.tab = "tasks"; S.score = 0; S.comment = null; S.editRate = false; S.confirm = ""; S.st = null; S.noteText = ""; S.msg = null; render(); window.scrollTo(0, 0); return; }
    if (el.dataset.hist) { S.histName = el.dataset.hist; render(); return; }
    if (el.dataset.st) { syncDetail(); S.st.to = el.dataset.st; render(); return; }
    if (el.dataset.score) { S.score = +el.dataset.score; const rc = document.getElementById("rate-comment"); if (rc) S.comment = rc.value; render(); return; }
    const act = el.dataset.act;
    if (act === "logout") { logout(); return; }
    if (act === "reload") { S.msg = null; load(); if (S.tab === "overview") loadOverview(true); return; }
    if (act === "ov-reload") { loadOverview(true); return; }
    if (act === "ov-go") { S.tab = "tasks"; S.filter = el.dataset.f; S.open = null; render(); window.scrollTo(0, 0); return; }
    if (act === "ov-assign") {
      const r = recommendations(S.ov)[+el.dataset.i]; if (!r || !r.act) return;
      const a = r.act, m = /^(\d{2})\.(\d{2})\.(\d{4})/.exec(a.due || "");
      S.form = { title: a.title, description: a.description || "", category: a.category || "", priority: a.priority || "Нормален", assignee: "", due: m ? `${m[3]}-${m[2]}-${m[1]}` : "" };
      S.tab = "new"; S.msg = null; render(); window.scrollTo(0, 0); return;
    }
    if (act === "close") { S.open = null; S.msg = null; render(); return; }
    if (act === "hist-close") { S.histName = ""; render(); return; }
    if (act === "edit-rate") { S.editRate = true; render(); return; }
    if (act === "rate") {
      const x = S.tasks.find((y) => y.id === S.open); const score = S.score || Number(x && x.score) || 0;
      if (!score) { flash("err", t("Изберете оценка от 1 до 10.")); return; }
      const rc = document.getElementById("rate-comment"); const comment = rc ? rc.value : "";
      S.busy = true; render();
      try {
        const j = await call("tasksRate", { id: S.open, score, comment });
        if (!j.success) throw new Error(j.error);
        S.editRate = false; S.score = 0; S.comment = null; S.busy = false; if (!putTask(j.task)) await load(); flash("ok", t("Оценката е записана."));
        return;
      } catch (err) { if (!err.handled) S.msg = { kind: "err", text: err.message }; }
      S.busy = false; render(); return;
    }
    if (act === "add-note") {
      syncDetail();
      const text = (S.noteText || "").trim();
      if (!text) { flash("err", t("Напишете коментар.")); return; }
      S.busy = true; render();
      try {
        const j = await call("tasksNote", { id: S.open, text });
        if (!j.success) throw new Error(j.error);
        S.noteText = ""; S.busy = false; if (!putTask(j.task)) await load(); flash("ok", t("Коментарът е добавен."));
        return;
      } catch (err) { if (!err.handled) S.msg = { kind: "err", text: err.message }; }
      S.busy = false; render(); return;
    }
    if (act === "set-status") {
      syncDetail();
      const x = S.tasks.find((y) => y.id === S.open), st = S.st;
      if (!x || !st) return;
      const due = isoToBg(st.due), body = { id: S.open, status: st.to, note: st.note };
      if (due !== (x.due || "")) body.due = due;
      if (st.to === "Изпълнена" && st.hours.trim()) body.hours = st.hours.trim();
      if (st.to === x.status && body.due == null) { flash("err", t("Няма промяна.")); return; }
      S.busy = true; render();
      try {
        const j = await call("tasksSetStatus", body);
        if (!j.success) throw new Error(j.error);
        S.st = null; S.busy = false; if (!putTask(j.task)) await load(); flash("ok", st.to === x.status ? t("Срокът е сменен.") : t("Статусът е сменен."));
        return;
      } catch (err) { if (!err.handled) S.msg = { kind: "err", text: err.message }; }
      S.busy = false; render(); return;
    }
    if (act === "seed") {
      const names = await loadNames();
      try { const j = await call("tasksStaffSeed", { names }); if (!j.success) throw new Error(j.error); await load(); flash("ok", (lang === "en" ? "Added: " : "Добавени: ") + j.added); }
      catch (err) { if (!err.handled) flash("err", err.message); }
      return;
    }
    if (act === "dossier") { openDossier(el.dataset.name); return; }
    if (act === "ds-close") { S.dossier = ""; S.dsEdit = false; S.dsForm = null; S.msg = null; render(); return; }
    if (act === "ds-edit") { S.dsEdit = true; S.dsForm = null; S.dsErr = ""; render(); const f = document.getElementById("ds-phone"); if (f) f.focus(); return; }
    if (act === "ds-cancel") { S.dsEdit = false; S.dsForm = null; S.dsErr = ""; render(); return; }
    if (act === "ds-save") {
      if (S.dsSaving) return;
      const f = Object.assign({}, S.dsForm || {});
      DS_FIELDS.forEach(([k, , type]) => { if (type === "date") f[k] = isoToBg(f[k] && /^\d{4}-/.test(f[k]) ? f[k] : bgToIso(f[k])); });
      if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) { S.dsErr = lang === "en" ? "Invalid email." : "Невалиден имейл."; render(); return; }
      S.dsSaving = true; S.dsErr = ""; render();
      try {
        const j = await call("tasksDossierSave", { name: S.dossier, dossier: f });
        if (!j.success) throw new Error(j.error);
        S.dsCache[S.dossier] = j.dossier; S.dsEdit = false; S.dsForm = null; S.dsSaving = false; S.logs = null;
        flash("ok", lang === "en" ? "✓ Dossier saved." : "✓ Досието е записано.");
      } catch (err) { S.dsSaving = false; if (!err.handled) { S.dsErr = err.message; render(); } }
      return;
    }
    if (act === "rm-staff") { if (S.rmBusy) return; S.rmConfirm = el.dataset.name; S.rmTyped = ""; render(); const n = document.getElementById("rm-typed"); if (n) n.focus(); return; }
    if (act === "rm-staff-no") { if (S.rmBusy) return; S.rmConfirm = ""; S.rmTyped = ""; render(); return; }
    if (act === "rm-staff-yes") {
      const name = el.dataset.name;
      if (S.rmBusy || (S.rmTyped || "").trim().toLowerCase() !== name.toLowerCase()) return;
      S.rmBusy = name; render();
      try {
        const j = await call("tasksStaffRemove", { name, confirm: S.rmTyped });
        if (!j.success) throw new Error(j.error);
        // Махаме го навсякъде на място — без презареждане.
        S.staff = S.staff.filter((y) => y.name !== name);
        S.removed = (S.removed || []).filter((y) => y.name !== name);
        S.tasks = S.tasks.filter((x) => x.assignee !== name);
        if (S.dsCache) delete S.dsCache[name];
        if (S.photos) { delete S.photos.staff[name]; if (j.ver) S.photos.ver = j.ver; }
        if (S.dossier === name) S.dossier = "";
        S.rmConfirm = ""; S.rmBusy = ""; S.rmTyped = ""; S.logs = null; S.ov = null;
        const d = j.deleted || {};
        flash("ok", lang === "en" ? `✓ ${name} was deleted permanently (${d.tasks || 0} tasks${d.dossier ? ", dossier" : ""}${d.photo ? ", photo" : ""}).`
          : `✓ ${name} е изтрит(а) завинаги (${d.tasks || 0} задачи${d.dossier ? ", досие" : ""}${d.photo ? ", снимка" : ""}).`);
        window.scrollTo(0, 0);
      } catch (err) { S.rmBusy = ""; if (!err.handled) { S.rmConfirm = ""; flash("err", err.message); } }

    }
    if (act === "save-profile") {
      if (S.meBusy) return;
      const name = ((S.prof && S.prof.name) || "").trim();
      const P = S.photos || (S.photos = { ver: "", staff: {}, admins: {} }), k = S.session.user.toLowerCase();
      const old = Object.assign({}, P.admins[k]);
      P.admins[k] = Object.assign({}, P.admins[k], { name });   // името се сменя веднага горе
      S.meBusy = true; S.menuMsg = null; render();
      try {
        const j = await call("tasksProfileSave", { name });
        if (!j.success) throw new Error(j.error);
        if (j.ver) P.ver = j.ver;
        S.meBusy = false; S.prof = null; meMsg("ok", t("Записано."));
      } catch (err) { P.admins[k] = old; S.meBusy = false; if (!err.handled) meMsg("err", err.message); else render(); }
      return;
    }
    if (act === "menu") { S.menu = !S.menu; S.menuAnim = S.menu; S.menuMsg = null; S.prof = null; render(); if (S.menu) { const n = document.getElementById("pm-name"); if (n) n.focus(); } return; }
    if (act === "logs-reload") { loadLogs(); return; }
    if (act === "nophoto") { if (!(S.saving && S.saving[el.dataset.name])) savePhoto(el.dataset.name, ""); return; }
    if (act === "nopin") {
      const s = S.staff.find((y) => y.name === el.dataset.name);
      el.disabled = true;
      try { const j = await call("tasksStaffSave", { name: s.name, rank: s.rank, position: s.position, pin: "" }); if (!j.success) throw new Error(j.error); s.hasPin = false; S.logs = null; flash("ok", t("Записано.")); }
      catch (err) { if (!err.handled) flash("err", err.message); }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.menu) { S.menu = false; render(); const b = document.querySelector(".me-btn"); if (b) b.focus(); } });
  document.addEventListener("click", (e) => { if (S.menu && !e.target.closest(".me-wrap")) { S.menu = false; render(); } });
  app.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-open],tr[data-hist]")) { e.preventDefault(); e.target.click(); }
  });

  render();
  if (S.session) { load(); loadOverview(); }
})();
</script>
</body>
</html>
