name: Sync to Inspection (main site)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          repository: nubabg/cinegrand-staging
          ref: main

      - name: Push to cinegrand-inspection
        env:
          PAT: ${{ secrets.INSPECTION_PAT }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone https://x-access-token:${PAT}@github.com/nubabg/cinegrand-inspection.git /tmp/inspection

          # задължителни файлове
          cp index.html favicon.svg /tmp/inspection/

          # по избор - || true пази job-а от спиране
          for f in Code.gs locks.gs AUDIT-REPORT.md Halls.md Names.md Rules.md cloudflare-worker-nextclean.js AppsScript-COMPLETO.gs; do
            [ -f "$f" ] && cp "$f" /tmp/inspection/ || true
          done

          # папки
          [ -d banners ] && cp -r banners /tmp/inspection/ || true

          cd /tmp/inspection
          git add -A
          git diff --staged --quiet || git commit -m "Sync from cinegrand-staging"
          git push origin main
