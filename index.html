        [/^✓ (\d+) скоро$/, "✓ $1 recent"], [/^◐ (\d+)$/, "◐ $1"],
        [/^⚠ (\d+) просрочени$/, "⚠ $1 overdue"], [/^● (\d+) с проблем$/, "● $1 with issues"],
        [/^(✓|◐|⚠) преди (\d+) (мин|ч|д)$/, (m, d, n, u) => `${d} ${n}${u === "мин" ? " min" : u === "ч" ? "h" : "d"} ago`],
        [/преди (\d+) (мин|ч|д)/, (m, n, u) => `${n}${u === "мин" ? " min" : u === "ч" ? "h" : "d"} ago`],
        [/^· след (\d+) мин( — скоро!)?$/, (m, n, s) => `· in ${n} min${s ? " — soon!" : ""}`],
        [/^\((\d+) мин\)$/, "($1 min)"], [/^· (\d+) мин ·$/, "· $1 min ·"], [/^· (\d+) мин$/, "· $1 min"],
        [/^(\d+) свободни места$/, "$1 seats available"],
        [/^(\d+)\/(\d+) заети$/, "$1/$2 taken"],
        [/^(\d+) свободни$/, "$1 free"],
        [/^след (\d+) мин$/, "in $1 min"],
        [/^Не се препоръчва за лица под (\d+)-годишна възраст$/, "Not recommended for persons under $1"],
        [/^\/(\d+) попълнени$/, "/$1 filled"], [/^⚠ (\d+) проблема$/, "⚠ $1 issues"],
        [/^Попълни всички полета \((\d+)\/(\d+)\)$/, "Fill in all fields ($1/$2)"],
        [/^Избери от падащия списък \((\d+) разрешени имена\)$/, "Choose from the dropdown ($1 allowed names)"],
        [/^Избери от падащия списък \((\d+) имена\)$/, "Choose from the dropdown ($1 names)"],
        [/^Дата и час: (.+)$/, "Date & time: $1"],
        [/^(\d+) символа$/, "$1 characters"],
        [/^Качи (\d+) снимки$/, "Upload $1 photos"],
        [/^Качване на снимка (\d+\/\d+)\.\.\.$/, "Uploading photo $1..."],
        [/^Преглед на снимки от PC \((\d+)\):$/, "PC photo preview ($1):"],
        [/^📱 Снимки получени от телефон \((\d+)\):$/, "📱 Photos received from phone ($1):"],
        [/^(.+) вече се проверява\. Опитайте след ~(\d+) мин\.$/, "$1 is already being inspected. Try again in ~$2 min."],
        [/^(.+) вече се проверява от друг потребител\. Опитайте след ~(\d+) мин\.$/, "$1 is already being inspected by another user. Try again in ~$2 min."],
        [/^свършва (\d{1,2}:\d{2})/, "ends $1"],
        [/^📊 Данни \((\d+)\)$/, "📊 Data ($1)"],
        [/^Проверяващ \*$/, "Inspector *"], [/^Локация \*$/, "Location *"],
      ];

      function cgTranslateText(s) {
        const t = s.trim();
        if (!t) return null;
        if (EN_EXACT[t] !== undefined) return s.replace(t, EN_EXACT[t]);
        let out = s, hit = false;
        for (const [re, rep] of EN_PATTERNS) {
          if (re.test(out.trim())) { out = out.replace(re, rep); hit = true; }
        }
        return hit ? out : null;
      }

      function applyTranslation(root) {
        if (currentLang !== "en" || !root) return;
        try {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach((n) => { const r = cgTranslateText(n.nodeValue); if (r !== null) n.nodeValue = r; });
          root.querySelectorAll("[placeholder],[title],[aria-label]").forEach((el) => {
            ["placeholder", "title", "aria-label"].forEach((a) => {
              const v = el.getAttribute(a); if (!v) return;
              const r = cgTranslateText(v); if (r !== null) el.setAttribute(a, r);
            });
          });
        } catch (err) { console.warn("[lang] translate error:", err); }
      }

      /* ── Cine Grand прожекции (Arena „next-clean" табло) ──
         URL на Cloudflare Worker прокси (за да заобиколим CORS). Празно = функцията
         е изключена. След deploy на Worker-а сложи неговия URL тук. */
      const NEXTCLEAN_PROXY_URL = "https://cinegrand-nextclean.denis123291104.workers.dev";  // Cloudflare Worker прокси
      let _nextCleanShows = [];        // [{hall, hallNum, movie, start, end, endsInMin, status}]
      let _nextCleanFetchedAt = 0;
      let _nextCleanBusy = false;
      let _endedHallsSeen = {};        // hallNum -> {hall, hallNum, movie, end, ts} — за да задържим „свърши" поне 5 мин
      const ENDED_STICKY_MS = 5 * 60 * 1000;

      /* Цвят-идентичност на всяка зала — за бързо разпознаване в списъци и
         табла. Стойностите идват от --hall-* токените, за да са наситени в
         тъмната палитра и достатъчно тъмни в светлите, без да се сменя кодът.
         c = наситеният тон за графика, g = RGB тройка за прозрачни подложки,
         t = текстовият вариант (и плътен фон под --on-fill). */
      const HALL_COLORS = (() => {
        const m = {};
        for (let i = 1; i <= 6; i++) {
          m[i] = { c: `var(--hall-${i})`, g: `var(--hall-${i}-rgb)`, t: `var(--hall-${i}-t)` };
        }
        return m;
      })();
      function hallColor(n) { return HALL_COLORS[n] || { c: "var(--hall-0)", g: "var(--hall-0-rgb)", t: "var(--hall-0-t)" }; }

      /* Връща залите, свършили в последните 5 мин (задържани дори таблото да ги е сменило). */
      /* Прогрес на течаща прожекция: докъде е стигнала (0–100%).
         Основава се на „остават N мин" от таблото (най-точното) + общата
         дължина, изчислена от началния и крайния час (с пренос през полунощ).
         Връща null, ако няма достатъчно данни. */
      function _showProgress(s) {
        const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec((t || "").trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; };
        const a = toMin(s.start), b = toMin(s.end);
        if (a == null || b == null) return null;
        let total = b - a;
        if (total <= 0) total += 24 * 60;          // прожекция през полунощ
        if (total <= 0 || total > 8 * 60) return null;
        let elapsed;
        if (s.endsInMin != null) {
          elapsed = total - s.endsInMin;           // от таблото — най-точно
        } else {
          const d = new Date();
          let cur = d.getHours() * 60 + d.getMinutes() - a;
          if (cur < 0) cur += 24 * 60;
          elapsed = cur;
        }
        const pct = Math.max(0, Math.min(100, Math.round((elapsed / total) * 100)));
        // Фаза + цвят: начало (спокойно) → среда → финал (подготви се за проверка)
        let phase, color, from, glow;
        if (pct < 15)      { phase = "начало";        color = "var(--blue)";   from = "var(--blue)";   glow = "transparent"; }
        else if (pct < 55) { phase = "в ход";         color = "var(--blue)";   from = "var(--blue)";   glow = "transparent"; }
        else if (pct < 85) { phase = "втора половина"; color = "var(--purple)"; from = "var(--purple)"; glow = "transparent"; }
        else               { phase = "към края";      color = "var(--amber)";  from = "var(--amber)";  glow = "transparent"; }
        return { pct, phase, color, from, glow };
      }

      function _recentlyEndedHalls() {
        const now = Date.now();
        return Object.keys(_endedHallsSeen).map((k) => _endedHallsSeen[k])
          .filter((e) => now - e.ts <= ENDED_STICKY_MS)
          .map((e) => Object.assign({}, e, { agoMin: Math.floor((now - e.ts) / 60000) }))
          .sort((a, b) => a.ts - b.ts);
      }

      /* ── Втори борд: „next" — следващи прожекции с формат/места/време ──
         Изисква Worker v2 (?board=next). Ако Worker-ът е стар (v1), функцията
         тихо се изключва (проверка по X-CG-Worker хедъра). */
      let _nextBoardShows = [];   // [{hallNum, hall, movie, format, seats, start, runtimeMin, warning}]
      let _nextBoardSupported = null; // null=неизвестно, false=Worker v1 (без поддръжка)
      let _nextBoardVersion = "";     // "v2" / "v3" — за подсказка при стар Worker
      let _nextBoardBusy = false;

      function parseNextBoardHtml(html) {
        const out = [];
        try {
          const doc = new DOMParser().parseFromString(html, "text/html");
          doc.querySelectorAll("tr.show, .show").forEach((tr) => {
            const text = (tr.textContent || "").replace(/\s+/g, " ");
            /* ЗАЩИТА: приемаме само елемент, който описва ЕДНА прожекция.
               Ако хванем контейнер с няколко прожекции, regex-ите биха върнали
               данните на първата за всички — по-добре да пропуснем реда. */
            const hallHits = text.match(/Hall\s*\d+/gi) || [];
            const seatHits = text.match(/\d+\s*available seats?/gi) || [];
            if (hallHits.length !== 1 || seatHits.length > 1) return;

            const h1 = tr.querySelector("h1");
            let movie = (h1 ? h1.textContent : "").replace(/\s+/g, " ").trim();
            // Формат: .format елемент или "- 2D" в заглавието
            const fmtEl = tr.querySelector(".format");
            let format = fmtEl ? fmtEl.textContent.replace(/[^0-9A-Za-z]/g, "").toUpperCase() : "";
            if (!format) { const fm = movie.match(/-\s*(2D|3D|4DX|IMAX)\b/i); if (fm) format = fm[1].toUpperCase(); }
            movie = movie.replace(/\s*-\s*(2D|3D|4DX|IMAX)\s*$/i, "").trim();
            const hallNum = parseInt(hallHits[0].replace(/\D/g, ""), 10);
            let seats = null;
            if (seatHits.length === 1) seats = parseInt(seatHits[0].replace(/\D/g, ""), 10);
            let runtimeMin = null;
            const rtM = text.match(/(\d+)\s*min\b/i);
            if (rtM) runtimeMin = parseInt(rtM[1], 10);
            /* Начален час — само ако в реда има ТОЧНО един час; иначе не можем
               да сме сигурни кой е началният и оставяме празно (без съпоставяне). */
            let start = "";
            const timeHits = text.match(/\b\d{1,2}:\d{2}\b/g) || [];
            if (timeHits.length === 1) start = timeHits[0];
            let warning = "";
            const wEl = tr.querySelector(".warning");
            if (wEl) warning = wEl.textContent.replace(/\s+/g, " ").trim();
            if (hallNum && movie) out.push({ hallNum, hall: "Зала " + hallNum, movie, format, seats, start, runtimeMin, warning });
          });
        } catch (err) { console.warn("[nextboard] parse error:", err); }
        if (out.length) console.log("[nextboard] parsed:", out.map((o) => `Зала ${o.hallNum} ${o.start} ${o.movie} → ${o.seats} свободни`).join(" | "));
        return out;
      }

      /* Памет за местата: бордът „next" изброява само ПРЕДСТОЯЩИ прожекции.
         Щом филмът тръгне, той изпада оттам и течащите редове биха останали
         без брой зрители. Затова запомняме данните, докато прожекцията още е
         предстояща, и ги ползваме след старта ѝ. */
      const SEATS_MEMORY_KEY = "cg_seats_memory";
      const SEATS_MEMORY_TTL_MS = 6 * 60 * 60 * 1000; // 6 часа
      let _seatsMemory = (function () {
        try { return JSON.parse(localStorage.getItem(SEATS_MEMORY_KEY) || "{}"); }
        catch (_) { return {}; }
      })();

      function _seatsKey(hallNum, start) { return hallNum + "|" + start; }

      function _rememberSeats(rows) {
        const now = Date.now();
        let changed = false;
        (rows || []).forEach((n) => {
          if (!n.hallNum || !n.start || n.seats == null) return;
          _seatsMemory[_seatsKey(n.hallNum, n.start)] = {
            seats: n.seats, movie: n.movie, format: n.format, runtimeMin: n.runtimeMin, ts: now,
          };
          changed = true;
        });
        // Изчистване на стари записи
        Object.keys(_seatsMemory).forEach((k) => {
          if (!_seatsMemory[k] || now - (_seatsMemory[k].ts || 0) > SEATS_MEMORY_TTL_MS) { delete _seatsMemory[k]; changed = true; }
        });
        if (changed) { try { localStorage.setItem(SEATS_MEMORY_KEY, JSON.stringify(_seatsMemory)); } catch (_) {} }
      }

      /* СТРОГО съпоставяне на прожекция от таблото с реда от втория борд:
         еднаква зала И еднакъв начален час. Без съпоставяне по име на филм —
         иначе повторна прожекция на същия филм в същата зала връща чужди данни.
         Ако прожекцията вече не е в борда (защото е тръгнала) — ползваме паметта. */
      function _matchBoardShow(s) {
        if (!s || !s.start) return null;
        const hits = _nextBoardShows.filter((n) => n.hallNum === s.hallNum && n.start && n.start === s.start);
        if (hits.length === 1) return hits[0];
        if (hits.length === 0) {
          const mem = _seatsMemory[_seatsKey(s.hallNum, s.start)];
          if (mem && mem.seats != null) {
            return { hallNum: s.hallNum, start: s.start, movie: mem.movie, format: mem.format, seats: mem.seats, runtimeMin: mem.runtimeMin, fromMemory: true };
          }
        }
        return null;   // при нееднозначност → нищо
      }

      async function fetchNextBoard() {
        if (!NEXTCLEAN_PROXY_URL || _nextBoardSupported === false || _nextBoardBusy) return;
        _nextBoardBusy = true;
        try {
          const res = await fetchWithTimeout(NEXTCLEAN_PROXY_URL + "?board=next&_cb=" + Date.now(), { cache: "no-store" }, 12000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const wv = res.headers.get("X-CG-Worker");
          if (!wv) {
            // Worker v1 — връща next-clean независимо от параметъра. Изключи тихо.
            _nextBoardSupported = false;
            console.warn("[nextboard] Worker v1 — постави новия код от cloudflare-worker-nextclean.js за 'Следващи прожекции'.");
            return;
          }
          _nextBoardVersion = wv;
          _nextBoardSupported = true;
          _nextBoardShows = parseNextBoardHtml(await res.text());
          _rememberSeats(_nextBoardShows);
          if (state.screen === "halls") render();
        } catch (err) {
          console.warn("[nextboard] fetch error:", err.message);
        } finally {
          _nextBoardBusy = false;
        }
      }

      /* Парсва HTML-а на next-clean таблото → списък прожекции. */
      function parseNextCleanHtml(html) {
        const out = [];
        try {
          const doc = new DOMParser().parseFromString(html, "text/html");
          doc.querySelectorAll("tr.show").forEach((tr) => {
            const hallText = (tr.querySelector("td.hall")?.textContent || "").replace(/\s+/g, " ").trim(); // "Hall 3"
            const hallNumM = hallText.match(/(\d+)/);
            const hallNum = hallNumM ? parseInt(hallNumM[1], 10) : null;
            const h1s = tr.querySelectorAll("td.align-middle h1");
            const movie = (h1s[0]?.textContent || "").replace(/\s+/g, " ").trim();
            const timeRange = (h1s[1]?.textContent || "").replace(/\s+/g, " ").trim(); // "13:15 - 15:30"
            const parts = timeRange.split("-").map((s) => s.trim());
            const start = parts[0] || "";
            const end = parts[1] || "";
            let endsInMin = null;
            const seats = tr.querySelector("span.seats");
            if (seats) { const m = seats.textContent.match(/(\d+)\s*minute/); if (m) endsInMin = parseInt(m[1], 10); }
            let status = "gray";
            const circle = tr.querySelector('[class*="circle-red"],[class*="circle-green"],[class*="circle-yellow"],[class*="circle-gray"]');
            if (circle) {
              if (circle.className.indexOf("circle-red") !== -1) status = "red";
              else if (circle.className.indexOf("circle-green") !== -1) status = "green";
              else if (circle.className.indexOf("circle-yellow") !== -1) status = "yellow";
            }
            if (hallNum) out.push({ hall: "Зала " + hallNum, hallNum, movie, start, end, endsInMin, status });
          });
        } catch (err) { console.warn("[nextclean] parse error:", err); }
        return out;
      }

      async function fetchNextClean() {
        if (!NEXTCLEAN_PROXY_URL) return;
        if (_nextCleanBusy) return;
        _nextCleanBusy = true;
        try {
          const res = await fetchWithTimeout(NEXTCLEAN_PROXY_URL + (NEXTCLEAN_PROXY_URL.indexOf("?") === -1 ? "?" : "&") + "_cb=" + Date.now(), { cache: "no-store" }, 12000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const html = await res.text();
          _nextCleanShows = parseNextCleanHtml(html);
          _nextCleanFetchedAt = Date.now();
          // Запомни свършилите зали (зелено) с време — за да ги задържим ≥5 мин
          const now = Date.now();
          _nextCleanShows.filter((s) => s.status === "green").forEach((s) => {
            const prev = _endedHallsSeen[s.hallNum];
            // Нов запис или различна прожекция → рестартирай таймера
            if (!prev || prev.end !== s.end) {
              _endedHallsSeen[s.hallNum] = { hall: s.hall, hallNum: s.hallNum, movie: s.movie, end: s.end, ts: now };
            } else {
              // Същата прожекция — обнови данните, запази оригиналното време
              prev.movie = s.movie; prev.hall = s.hall;
            }
          });
          // Изчисти изтеклите (>5 мин)
          Object.keys(_endedHallsSeen).forEach((k) => { if (now - _endedHallsSeen[k].ts > ENDED_STICKY_MS) delete _endedHallsSeen[k]; });
          if (state.screen === "home" || state.screen === "halls") render();
        } catch (err) {
          console.warn("[nextclean] fetch error:", err.message);
        } finally {
          _nextCleanBusy = false;
        }
      }

      /* Връща текущо течащата прожекция за дадена зала (или null). */
      function _currentShowForHall(hallNum) {
        const running = _nextCleanShows.filter((s) => s.hallNum === hallNum && s.status === "red");
        if (running.length === 0) return null;
        // най-скоро свършващата
        running.sort((a, b) => (a.endsInMin == null ? 9999 : a.endsInMin) - (b.endsInMin == null ? 9999 : b.endsInMin));
        return running[0];
      }

      function renderNextCleanSection() {
        if (!NEXTCLEAN_PROXY_URL) return "";
        const hasData = _nextCleanShows.length > 0;

        const hallBadge = (hc, num, forDark) => `<div style="width:54px;height:54px;border-radius:var(--r-md);background:${forDark ? hc.t : `rgba(${hc.g},.16)`};border:1px solid rgba(${hc.g},.45);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">
            <span style="font-size:var(--fs-micro);font-weight:700;letter-spacing:.1em;color:${forDark ? 'var(--on-fill)' : hc.t};font-family:'Oswald',sans-serif;line-height:1;">ЗАЛА</span>
            <span style="font-size:22px;font-weight:700;color:${forDark ? 'var(--on-fill)' : hc.t};font-family:'Oswald',sans-serif;line-height:1;margin-top:1px;">${num}</span>
          </div>`;

        /* Блок със зрителите. При липсващи данни показва „—", за да е ясно, че
           няма информация, вместо блокът да изчезне и редът да изглежда различно. */
        const occBlockFor = (o) => {
          if (!o) {
            return `<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;padding:9px 12px;border-radius:var(--r-lg);background:var(--panel-2);border:1.5px dashed var(--border);" title="Няма данни за свободните места на тази прожекция">
                <div style="display:flex;align-items:baseline;gap:3px;line-height:1;">
                  <span style="margin-right:2px;opacity:.5;display:inline-flex;">${cgIcon("no-data", 14)}</span>
                  <span style="font-size:26px;font-weight:700;color:var(--muted-2);font-family:'Oswald',sans-serif;">—</span>
                </div>
                <div style="font-size:var(--fs-micro);font-weight:700;color:var(--muted-2);letter-spacing:.09em;text-transform:uppercase;margin-top:4px;white-space:nowrap;">няма данни</div>
              </div>`;
          }
          return `<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;padding:9px 12px;border-radius:var(--r-lg);background:linear-gradient(135deg,${o.color}2e,${o.color}12);border:1.5px solid ${o.color}77;box-shadow:0 0 16px ${o.color}33;" title="${o.taken} заети от ${o.cap} места · ${o.free} свободни">
              <div style="display:flex;align-items:baseline;gap:3px;line-height:1;">
                <span style="margin-right:2px;display:inline-flex;">${cgIcon("occupancy", 14)}</span>
                <span style="font-size:26px;font-weight:700;color:${o.color};font-family:'Oswald',sans-serif;">${o.taken}</span>
                <span style="font-size:var(--fs-body);font-weight:700;color:var(--muted-2);font-family:'Oswald',sans-serif;">/${o.cap}</span>
              </div>
              <div style="font-size:var(--fs-micro);font-weight:700;color:${o.color};letter-spacing:.09em;text-transform:uppercase;margin-top:4px;white-space:nowrap;">${o.label}</div>
              <div style="font-size:var(--fs-micro);color:var(--muted-2);margin-top:2px;white-space:nowrap;">${o.free} свободни</div>
            </div>`;
        };

        const endedCard = (hallNum, movie, end, agoMin) => {
          const hc = hallColor(hallNum);
          return `<div class="cg-ended-card" style="--hall-glow:rgba(${hc.g},.5);display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);background:rgba(${hc.g},.14);border:1px solid rgba(${hc.g},.45);">
            ${hallBadge(hc, hallNum, true)}
            <div style="flex:1;min-width:0;">
              <div style="font-size:var(--fs-body);font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(movie)}</div>
              <div style="font-size:var(--fs-meta);color:var(--text);opacity:.9;margin-top:3px;display:flex;align-items:center;gap:5px;">${cgIcon("screening", 14)} Свърши в <b>${escapeHtml(end)}</b>${agoMin > 0 ? ` · преди ${agoMin} мин` : " · току-що"}</div>
            </div>
            <div class="cg-clean-badge" style="flex-shrink:0;font-size:var(--fs-meta);font-weight:700;color:var(--on-fill);background:var(--green);padding:9px 15px;border-radius:var(--r-pill);letter-spacing:.03em;box-shadow:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;">${cgIcon("inspection", 15)} ПРОВЕРИ ЗАЛАТА</div>
          </div>`;
        };

        /* 1:1 огледало на таблото — всеки ред от HTML-а, в същия ред. */
        const now = Date.now();
        const boardGreens = {};

        /* Кои предстоящи прожекции тръгват най-скоро — за да ги откроим.
           Минути до старта (с пренос през полунощ). */
        const _minsUntil = (hhmm) => {
          const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm || "").trim());
          if (!m) return null;
          const d = new Date();
          let diff = ((+m[1]) * 60 + (+m[2])) - (d.getHours() * 60 + d.getMinutes());
          if (diff < -720) diff += 24 * 60;   // след полунощ
          return diff;
        };
        const upcomingMins = _nextCleanShows
          .filter((x) => x.status === "gray")
          .map((x) => _minsUntil(x.start))
          .filter((v) => v != null && v >= 0)
          .sort((a, b) => a - b);
        const nextMin = upcomingMins.length ? upcomingMins[0] : null;   // най-скорошният старт
        const boardRows = _nextCleanShows.map((s) => {
          const hc = hallColor(s.hallNum);
          if (s.status === "green") {
            boardGreens[s.hallNum] = true;
            const seen = _endedHallsSeen[s.hallNum];
            const agoMin = seen ? Math.floor((now - seen.ts) / 60000) : 0;
            return endedCard(s.hallNum, s.movie, s.end, agoMin);
          }
          if (s.status === "red") {
            const soon = s.endsInMin != null && s.endsInMin <= 15;
            const subColor = soon ? "var(--amber-2)" : "var(--muted)";
            const p = _showProgress(s);
            const rExtra = _matchBoardShow(s);
            const rOcc = rExtra ? _occupancy(s.hallNum, rExtra.seats) : null;
            return `<div style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--panel-2);border:1px solid var(--border);border-left:3px solid ${hc.c};">
              ${hallBadge(hc, s.hallNum, false)}
              <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:baseline;gap:8px;min-width:0;">
                  <span style="font-size:var(--fs-body);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(s.movie)}</span>
                  ${p ? `<span style="flex-shrink:0;font-size:var(--fs-micro);font-weight:700;color:${p.color};font-family:'Oswald',sans-serif;letter-spacing:.04em;">${p.pct}%</span>` : ""}
                </div>
                <div style="font-size:var(--fs-meta);color:${subColor};font-weight:600;margin-top:3px;">Свършва <b>${escapeHtml(s.end)}</b>${s.endsInMin != null ? ` · след ${s.endsInMin} мин` : ""}${soon ? " — скоро!" : ""}</div>
                ${p ? `
                <div style="margin-top:7px;">
                  <div class="cg-prog-track" style="--p-from:${p.from};--p-to:${p.color};--p-glow:${p.glow};">
                    <div class="cg-prog-fill" style="width:${p.pct}%;"></div>
                    <div class="cg-prog-head" style="left:${p.pct}%;"></div>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:var(--fs-micro);color:var(--muted-2);letter-spacing:.03em;">
                    <span>${escapeHtml(s.start || "")}</span>
                    <span style="color:${p.color};font-weight:700;">${escapeHtml(p.phase)}</span>
                    <span>${escapeHtml(s.end || "")}</span>
                  </div>
                </div>` : ""}
              </div>
              ${occBlockFor(rOcc)}
            </div>`;
          }
          /* gray = предстояща — обогатена с формат/места от втория борд */
          const extra = _matchBoardShow(s);
          const bits = [];
          if (s.start) bits.push(`Започва <b>${escapeHtml(s.start)}</b>`);
          if (extra && extra.runtimeMin != null) bits.push(`${extra.runtimeMin} мин`);
          const occ = extra ? _occupancy(s.hallNum, extra.seats) : null;
          if (!occ && extra && extra.seats != null) {
            bits.push(`<span style="color:var(--amber-2);font-weight:700;">${extra.seats} свободни места</span>`);
          }
          /* Заетост — ЕДЪР блок вдясно (без лента, за да не се бърка с
             прогрес бара на течащите прожекции). */
          const occBlock = occBlockFor(occ);
          /* Тази ли тръгва следваща? (може да са няколко в един и същ час) */
          const mins = _minsUntil(s.start);
          const isNext = nextMin != null && mins != null && mins === nextMin;
          const cntTxt = mins == null ? "" : (mins <= 0 ? "всеки момент" : "след " + mins + " мин");
          return `<div class="${isNext ? "cg-next-card" : ""}" style="${isNext ? `--n-glow:rgba(${hc.g},.5);` : ""}position:relative;display:flex;align-items:center;gap:14px;padding:${isNext ? "15px 16px" : "12px 14px"};border-radius:var(--r-md);background:${isNext ? `rgba(${hc.g},.14)` : "var(--panel-2)"};border:${isNext ? `1px solid ${hc.c}` : `1px dashed var(--border)`};${isNext ? "" : "opacity:.72;"}">
            ${isNext ? `<span class="cg-next-pill" style="position:absolute;top:-9px;left:14px;font-size:var(--fs-micro);font-weight:700;letter-spacing:.1em;color:var(--on-fill);background:${hc.t};padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;">▶ СЛЕДВАЩА</span>` : ""}
            ${hallBadge(hc, s.hallNum, isNext)}
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;">
                <span style="font-size:${isNext ? "16px" : "14px"};font-weight:${isNext ? "800" : "600"};color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(s.movie)}</span>
                ${extra && extra.format ? `<span style="flex-shrink:0;font-size:var(--fs-micro);font-weight:700;color:var(--on-fill);background:var(--gold-2);padding:2px 8px;border-radius:var(--r-pill);letter-spacing:.06em;">${escapeHtml(extra.format)}</span>` : ""}
                ${isNext ? "" : `<span style="flex-shrink:0;color:var(--muted-2);display:inline-flex;">${cgIcon("play-next", 14)}</span>`}
              </div>
              <div style="font-size:${isNext ? "12.5px" : "11.5px"};color:${isNext ? hc.t : "var(--muted)"};font-weight:${isNext ? "700" : "600"};margin-top:3px;">${bits.join(" · ")}${cntTxt ? ` · <b>${cntTxt}</b>` : ""}</div>
            </div>
            ${occBlock}
          </div>`;
        }).join("");

        /* Свършили зали, паднали от таблото, но още в 5-мин прозореца —
           добавят се в края, за да не изчезне сигналът „провери залата". */
        const stickyRows = _recentlyEndedHalls()
          .filter((e) => !boardGreens[e.hallNum])
          .map((e) => endedCard(e.hallNum, e.movie, e.end, e.agoMin))
          .join("");

        return `<div class="panel" style="margin-bottom:var(--s4);">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
            <h3 style="font-size:var(--fs-card);font-weight:700;color:var(--text);margin:0;letter-spacing:.04em;display:flex;align-items:center;gap:8px;">${cgIcon("hall", 17)} Кога се освобождават залите</h3>
            <span style="font-size:var(--fs-micro);color:var(--green-2);display:inline-flex;align-items:center;gap:5px;">${hasData ? '<span class="live-dot"></span> на живо от киното' : "зареждам…"}</span>
          </div>
          ${(boardRows || stickyRows) ? `<div style="display:grid;gap:10px;">${boardRows}${stickyRows}</div>`
            : `<div style="font-size:var(--fs-body);color:var(--muted-2);padding:6px 2px;">В момента няма прожекции на таблото.</div>`}
          ${_nextBoardSupported === false ? `<div style="font-size:var(--fs-micro);color:var(--amber-2);margin-top:10px;">ℹ️ За места и 2D/3D формат обнови Cloudflare Worker-а с новия код от cloudflare-worker-nextclean.js в repo-то.</div>` : ""}
          ${(_nextBoardSupported === true && _nextBoardVersion && _nextBoardVersion !== "v3") ? `<div style="font-size:var(--fs-micro);color:var(--amber-2);margin-top:10px;">ℹ️ Част от прожекциите са без брой зрители, защото Worker-ът (${escapeHtml(_nextBoardVersion)}) чете само първите 10. Обнови го с новия код (v3) от cloudflare-worker-nextclean.js.</div>` : ""}
          <div style="font-size:var(--fs-micro);color:var(--muted-2);margin-top:12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;">${cgIcon("inspection", 13)} свършила = провери залата дали е почистена (стои 5 мин) · ${cgIcon("screening", 13)} тече = скоро се освобождава · ${cgIcon("play-next", 13)} предстои</div>
        </div>`;
      }

      /* Отделен екран „Зали" — статус на прожекциите + кога се освобождават. */
      function renderHallsScreen() {
        return `<div class="page">
          <div class="toolbar">
            <div>
              <h1 class="hero-title" style="display:flex;align-items:center;gap:12px;">${cgIcon("screening", 26)} Статус на залите</h1>
              <div class="muted">Прожекции на живо от киното — кога всяка зала се освобождава за проверка.</div>
            </div>
            <button class="btn btn-outline" data-action="go-home">← Начало</button>
          </div>
          ${renderNextCleanSection()}
        </div>`;
      }

      /* ── Allowed inspector names — fetched from /Names.md in the repo ──
         Поддръжката минава през този файл, не през кода. Празни редове и
         коментари (#) се игнорират. Първата секция от име до празен ред в
         края на файла се използва. */
      let ALLOWED_NAMES = []; // populated by loadAllowedNames()
      let _namesLoaded = false;

      async function loadAllowedNames() {
        try {
          const res = await fetchWithTimeout("Names.md?_cb=" + Date.now(), { cache: "no-store" }, 8000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          // Take only lines under the "## Списък" section (or fallback: any
          // line that looks like a name — Cyrillic, optional spaces).
          let section = text;
          const m = text.match(/##\s*Списък[\s\S]*$/i);
          if (m) section = m[0];
          const names = section.split(/\r?\n/)
            .map(l => l.trim())
            .filter(l => l && !l.startsWith("#") && /^[Ѐ-ӿ][Ѐ-ӿ\s]*$/.test(l));
          if (names.length > 0) {
            ALLOWED_NAMES = names;
            _namesLoaded = true;
            console.log("[names] loaded " + names.length + " allowed inspector names");
            // Re-render any screen that uses the names list
            if (state.screen === "inspection") render();
          }
        } catch (err) {
          console.warn("[names] failed to load Names.md:", err.message);
          // Без списък оставяме старото поведение (свободно поле) за да не блокираме работата
        }
      }

      // Kick off load early so it's ready by the time inspector renders the form
      loadAllowedNames();

      /* ── Капацитет на залите — от /Halls.md в repo-то ──
         Позволява да смятаме заетите места: заети = капацитет − свободни.
         Поддръжката минава през файла, не през кода. Липсваща зала → показваме
         само свободните места (без изчисления). */
      let HALL_CAPACITY = {};   // hallNum -> брой места

      async function loadHallCapacities() {
        try {
          const res = await fetchWithTimeout("Halls.md?_cb=" + Date.now(), { cache: "no-store" }, 8000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          let section = text;
          const m = text.match(/##\s*Капацитет\s*$[\s\S]*/im);
          if (m) section = m[0];
          const caps = {};
          section.split(/\r?\n/).forEach((line) => {
            const t = line.trim();
            if (!t || t.startsWith("#") || t.startsWith(">")) return;
            const mm = /^(?:Зала\s*)?(\d+)\s*[=:]\s*(\d+)\s*$/i.exec(t);
            if (mm) {
              const n = parseInt(mm[1], 10), c = parseInt(mm[2], 10);
              if (n > 0 && c > 0) caps[n] = c;
            }
          });
          if (Object.keys(caps).length > 0) {
            HALL_CAPACITY = caps;
            console.log("[halls] loaded capacities for " + Object.keys(caps).length + " halls");
            if (state.screen === "halls") render();
          }
        } catch (err) {
          console.warn("[halls] failed to load Halls.md:", err.message);
        }
      }
      loadHallCapacities();

      /* ── Правила — съдържанието идва от /Rules.md в repo-то ──
         Редактира се през GitHub, без промяна по кода. */
      let RULES_MD = null;        // null = още не е зареден, "" = грешка
      let _rulesBusy = false;

      async function loadRules() {
        if (_rulesBusy) return;
        _rulesBusy = true;
        try {
          const res = await fetchWithTimeout("Rules.md?_cb=" + Date.now(), { cache: "no-store" }, 8000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          RULES_MD = await res.text();
        } catch (err) {
          console.warn("[rules] failed to load Rules.md:", err.message);
          RULES_MD = "";
        } finally {
          _rulesBusy = false;
          if (state.screen === "rules") render();
        }
      }

      /* Минимален Markdown → HTML. Целият текст минава през escapeHtml
         ПРЕДИ форматирането, така че съдържанието на файла не може да
         вкара HTML в страницата. */
      function renderMarkdown(md) {
        const esc = escapeHtml(md || "");
        const lines = esc.split(/\r?\n/);
        const out = [];
        let list = null;   // "ul" | "ol" | null

        const inline = (t) => t
          .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--text);">$1</strong>')
          .replace(/`([^`]+)`/g, '<code style="background:var(--panel-2);padding:1px 6px;border-radius:var(--r-sm);font-size:.92em;">$1</code>');

        const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
        const openList = (t) => {
          if (list === t) return;
          closeList();
          list = t;
          out.push(`<${t} style="margin:8px 0 14px;padding-left:22px;display:grid;gap:6px;color:var(--muted);font-size:var(--fs-body);line-height:1.6;">`);
        };

        for (const raw of lines) {
          const l = raw.trim();
          if (!l) { closeList(); continue; }

          let m;
          if ((m = /^---+$/.exec(l))) {
            closeList();
            out.push('<hr style="border:0;border-top:1px solid var(--border);margin:20px 0;">');
          } else if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) {
            closeList();
            const lvl = m[1].length;
            const size = [26, 19, 15.5, 14][lvl - 1];
            const mt = lvl === 1 ? 0 : 22;
            out.push(`<div style="font-family:'Oswald',sans-serif;font-size:${size}px;font-weight:${lvl <= 2 ? 700 : 600};color:${lvl === 1 ? "var(--text)" : "var(--gold-2)"};letter-spacing:.03em;margin:${mt}px 0 10px;${lvl === 1 ? "text-transform:uppercase;" : ""}">${inline(m[2])}</div>`);
          } else if ((m = /^&gt;\s?(.*)$/.exec(l))) {
            closeList();
            out.push(`<div style="border-left:3px solid var(--gold);background:var(--gold-soft);padding:11px 14px;border-radius:0 10px 10px 0;margin:12px 0;color:var(--gold-2);font-size:var(--fs-body);line-height:1.6;">${inline(m[1])}</div>`);
          } else if ((m = /^[-*]\s+(.*)$/.exec(l))) {
            openList("ul");
            out.push(`<li>${inline(m[1])}</li>`);
          } else if ((m = /^(\d+)\.\s+(.*)$/.exec(l))) {
            openList("ol");
            out.push(`<li>${inline(m[2])}</li>`);
          } else {
            closeList();
            out.push(`<p style="margin:0 0 12px;color:var(--muted);font-size:var(--fs-body);line-height:1.65;">${inline(l)}</p>`);
          }
        }
        closeList();
        return out.join("");
      }

      function renderRulesScreen() {
        const loading = RULES_MD === null;
        const failed = RULES_MD === "";
        const body = (!loading && !failed) ? renderMarkdown(RULES_MD) : "";
        const emptyDoc = !loading && !failed && !body.trim();
        return `<div class="page">
          <div class="toolbar">
            <div>
              <h1 class="hero-title" style="display:flex;align-items:center;gap:12px;"><span style="font-size:30px;">📋</span> Правила за работа</h1>
            </div>
            <button class="btn btn-outline" data-action="go-home">← Начало</button>
          </div>
          <div class="panel" style="padding:26px 30px;">
            ${loading ? `<div style="display:flex;align-items:center;gap:12px;color:var(--muted);padding:18px 0;">${spokes("sm")} Зареждам правилата…</div>`
              : failed ? `<div style="color:var(--amber-2);font-size:var(--fs-body);padding:6px 0;">Правилата не можаха да бъдат заредени. Провери дали файлът <b>Rules.md</b> съществува в repo-то.</div>`
              : emptyDoc ? `<div style="color:var(--muted);font-size:var(--fs-body);padding:6px 0;">Файлът <b>Rules.md</b> е празен. Отвори го в GitHub и напиши правилата.</div>`
              : body}
          </div>
        </div>`;
      }

      /* ── Странични банери ──
         Слотът се показва САМО ако файлът в /banners/ е реална снимка.
         Празният/placeholder файлът (1×1px) и липсващ файл се пропускат, за
         да не стои празна рамка на екрана. Смяната е само качване на файл в
         GitHub — виж banners/README.md. */
      function initSideBanners() {
        document.querySelectorAll(".cg-side-banner").forEach((slot) => {
          const img = slot.querySelector("img");
          if (!img) return;
          const src = img.getAttribute("data-src");
          if (!src) return;
          const probe = new Image();
          probe.onload = () => {
            // 1×1 placeholder → третираме като „няма банер"
            if (probe.naturalWidth <= 2 || probe.naturalHeight <= 2) return;
            img.src = src + "?v=" + Date.now();
            slot.classList.add("has-image");
          };
          probe.onerror = () => { /* липсва файл → слотът остава скрит */ };
          probe.src = src + "?v=" + Date.now();
        });
      }
      initSideBanners();

      /* Заетост на прожекция от свободните места + капацитета на залата. */
      function _occupancy(hallNum, freeSeats) {
        const cap = HALL_CAPACITY[hallNum];
        if (!cap || freeSeats == null || freeSeats < 0 || freeSeats > cap) return null;
        const taken = cap - freeSeats;
        const pct = Math.round((taken / cap) * 100);
        let color, label;
        if (pct >= 80)      { color = "var(--red-2)";    label = "пълна"; }
        else if (pct >= 50) { color = "var(--amber-2)";  label = "почти пълна"; }
        else if (pct >= 20) { color = "var(--blue-2)";   label = "средно"; }
        else                { color = "var(--muted-2)";  label = "празна"; }
        return { cap, taken, free: freeSeats, pct, color, label };
      }
      const NTFY_POLL_INTERVAL_MS = 3500;
      let _phonePollTimer = null;
      let _phonePollBusy = false;

      function startPhonePhotoPolling() {
        stopPhonePhotoPolling();
        if (!state.pcSessionId) {
          state.pcSessionId = "pcs_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
        }
        console.log("[ntfy] start polling for topic cg-photos-" + state.pcSessionId);
        updatePhonePollStatus("Слушане за снимки от телефон…", "ok");
        pollNtfyOnce(); // immediate
        _phonePollTimer = setInterval(pollNtfyOnce, NTFY_POLL_INTERVAL_MS);
      }

      function stopPhonePhotoPolling() {
        if (_phonePollTimer) {
          clearInterval(_phonePollTimer);
          _phonePollTimer = null;
        }
        _phonePollBusy = false;
      }

      async function pollNtfyOnce() {
        if (_phonePollBusy) return;
        if (!state.pcSessionId) return;
        if (state.screen !== "inspection") { stopPhonePhotoPolling(); return; }
        _phonePollBusy = true;
        try {
          const topic = "cg-photos-" + state.pcSessionId;
          const url = NTFY_BASE + "/" + encodeURIComponent(topic) + "/json?poll=1&since=all";
          const res = await fetch(url, { method: "GET", cache: "no-store" });
          if (!res.ok) {
            updatePhonePollStatus("ntfy.sh HTTP " + res.status, "error");
            return;
          }
          const text = await res.text();
          const lines = text.split("\n").filter(Boolean);
          const newUrls = [];
          let sawTest = false;
          for (const line of lines) {
            try {
              const data = JSON.parse(line);
              if (!data || data.event !== "message" || !data.message) continue;
              const photoUrl = String(data.message).trim();
              if (!photoUrl) continue;
              // Detect test/warmup signals separately so we can confirm the
              // relay is alive without showing them as fake photos.
              if (photoUrl.indexOf("example.invalid") !== -1 || photoUrl.indexOf("/cg-test/") !== -1 || photoUrl.indexOf("warmup-") === 0) {
                sawTest = true;
                continue;
              }
              if (!/^https?:\/\//.test(photoUrl)) continue;
              if (photoUrl.indexOf("/test-") !== -1) continue;
              if (!/drive\.google\.com|googleusercontent\.com/.test(photoUrl)) continue;
              newUrls.push(photoUrl);
            } catch (_) {}
          }
          if (sawTest) {
            console.log("[ntfy] test signal received — relay alive");
          }
          // Dedupe + add only new
          const current = state.remotePhotoUrls || [];
          const seen = new Set(current);
          const additions = [];
          for (const u of newUrls) {
            if (!seen.has(u)) { additions.push(u); seen.add(u); }
          }
          if (additions.length > 0) {
            state.remotePhotoUrls = [...current, ...additions];
            render();
            showToast(`📱 Получена ${additions.length === 1 ? "нова снимка" : additions.length + " нови снимки"} от телефон.`);
          }
          // Status: connected, showing count
          updatePhonePollStatus(
            (state.remotePhotoUrls && state.remotePhotoUrls.length > 0)
              ? `Получени ${state.remotePhotoUrls.length} снимки от телефон`
              : "Слушане за снимки от телефон…",
            "ok"
          );
        } catch (err) {
          console.warn("[ntfy] poll error:", err);
          updatePhonePollStatus("Мрежова грешка към ntfy.sh: " + (err && err.message ? err.message : err), "error");
        } finally {
          _phonePollBusy = false;
        }
      }

      async function notifyPCOfPhoto(photoUrl) {

      /* ── Photo Upload Utilities ── */
      const MAX_PHOTOS = 5;
      /* ── Compress an image data URL to fit within ~1MB JPEG ──
         Inspection photos don't need full 12MP resolution — 1920px max edge
         and JPEG 0.8 quality is plenty for spotting issues, and shrinks a
         10MB iPhone photo to ~400-700KB so the upload to Apps Script is
         reliable on mobile networks. */
      function compressImageDataUrl(dataUrl, maxDim, quality) {
        maxDim = maxDim || 1920;
        quality = quality || 0.82;
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            try {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                const scale = maxDim / Math.max(width, height);
                width = Math.round(width * scale);
                height = Math.round(height * scale);
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL("image/jpeg", quality));
            } catch (e) {
              console.warn("[compress] failed, using original:", e);
              resolve(dataUrl);
            }
          };
          img.onerror = () => {
            console.warn("[compress] image load failed, using original");
            resolve(dataUrl);
          };
          img.src = dataUrl;
        });
      }

      function handlePhotoSelect(e) {
        const files = Array.from(e.target.files || []);
        state.photoFiles = [];
        state.photoPreviews = [];
        state.photoError = "";
        state.notes = "";

        if (files.length === 0) {
          render();
          return;
        }

        if (files.length > MAX_PHOTOS) {
          state.photoError = `Може да изберете максимум ${MAX_PHOTOS} снимки. Избрахте ${files.length}.`;
          render();
          return;
        }

        const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
        const MAX_FILE_SIZE = 25 * 1024 * 1024; // 25MB raw input — we compress before upload
        for (const f of files) {
          if (!validTypes.includes(f.type)) {
            state.photoError = `Невалиден файл „${f.name}". Приемат се само JPEG, PNG, WebP.`;
            render();
            return;
          }
          if (f.size > MAX_FILE_SIZE) {
            state.photoError = `Файлът „${f.name}" е над 25MB.`;
            render();
            return;
          }
        }

        state.photoFiles = files;
        state.photoPreviews = new Array(files.length).fill(null);
        let loaded = 0;
        files.forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const originalDataUrl = event.target.result;
            // Compress before storing — this is what gets uploaded later
            let dataUrl = originalDataUrl;
            try {
              dataUrl = await compressImageDataUrl(originalDataUrl, 1920, 0.82);
              const origKB = Math.round((originalDataUrl.length * 3 / 4) / 1024);
              const newKB = Math.round((dataUrl.length * 3 / 4) / 1024);
              console.log(`[photo ${idx + 1}] compressed ${origKB}KB → ${newKB}KB`);
            } catch (e) {
              console.warn("[photo] compression failed:", e);
            }
            state.photoPreviews[idx] = dataUrl;
            loaded++;
            if (loaded === files.length) render();
          };
          reader.onerror = () => {
            state.photoError = `Грешка при четене на файл „${file.name}".`;
            state.photoFiles = [];
            state.photoPreviews = [];
            render();
          };
          reader.readAsDataURL(file);
        });
      }

      let _lastUploadError = "";

      async function uploadOnePhoto_(fileOrDataUrl, indexLabel) {
        _lastUploadError = "";
        const isPhoneScreen = state.screen === "phone-photo-upload";
        const reportErr = (msg) => {
          _lastUploadError = msg;
          console.warn("[upload]", msg);
          if (isPhoneScreen) setPhonePhotoStatus(`❌ ${msg}`, "error");
          else alert("⚠ " + msg);
        };

        if (!SHEETS_WEB_APP_URL || SHEETS_WEB_APP_URL.indexOf("script.google.com") === -1) {
          reportErr("SHEETS_WEB_APP_URL не е конфигуриран:\n" + SHEETS_WEB_APP_URL);
          return null;
        }

        // Resolve to base64 — accept either a data URL string (already loaded
        // by handlePhotoSelect into state.photoPreviews) or a File object.
        let base64Data, fileNameHint;
        try {
          if (typeof fileOrDataUrl === "string" && fileOrDataUrl.startsWith("data:")) {
            base64Data = fileOrDataUrl.split(",")[1] || "";
            fileNameHint = "photo";
          } else if (fileOrDataUrl instanceof Blob || (fileOrDataUrl && typeof fileOrDataUrl === "object" && fileOrDataUrl.size)) {
            base64Data = await new Promise((res, rej) => {
              const reader = new FileReader();
              reader.onload = (ev) => res(String(ev.target.result || "").split(",")[1] || "");
              reader.onerror = () => rej(new Error("FileReader failed"));
              reader.readAsDataURL(fileOrDataUrl);
            });
            fileNameHint = (fileOrDataUrl.name || "photo").replace(/[^a-zA-Z0-9._-]/g, "_");
          } else {
            reportErr(`Невалиден формат на снимка ${indexLabel}`);
            return null;
          }
        } catch (e) {
          reportErr(`Грешка при четене на файла ${indexLabel}: ${e && e.message ? e.message : e}`);
          return null;
        }

        if (!base64Data || base64Data.length === 0) {
          reportErr(`Файлът ${indexLabel} е празен или невалиден`);
          return null;
        }

        const timestamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, -4);
        const safeLoc = String(state.location || "unknown").replace(/\s+/g, "_");
        const fileNameSafe = `photo_${timestamp}_${safeLoc}_${indexLabel}.jpg`;
        const payload = JSON.stringify({
          action: "uploadPhoto",
          photoData: base64Data,
          fileName: fileNameSafe,
          comment: state.notes,
          location: state.location,
          inspector: state.inspector,
          timestamp: new Date().toISOString(),
          pcSessionId: state.pcSessionId || "",
          _token: SHEETS_SECRET_TOKEN,
        });

        if (isPhoneScreen) setPhonePhotoStatus(`Подготвям връзката към Apps Script…`, "info");

        // Warm up the Apps Script connection RIGHT before the upload so iOS
        // has a live cellular/wifi connection and won't bail with "network
        // error" on the redirected POST. We deliberately await this — the
        // upload that follows is the network-critical call.
        try {
          await fetch(SHEETS_WEB_APP_URL, { method: "GET", credentials: "omit", cache: "no-store" });
        } catch (_) { /* ignore — even a failed warmup primes TLS/DNS */ }

        if (isPhoneScreen) setPhonePhotoStatus(`Изпращам снимка ${indexLabel} към Google Drive (${Math.round(base64Data.length / 1024)} KB)…`, "info");

        // Use fetch with credentials:"omit" — iOS Safari's Intelligent
        // Tracking Prevention can block the script.google.com →
        // script.googleusercontent.com redirect when cookies are involved,
        // producing the "XHR network error" we saw. Omitting credentials
        // sidesteps that path.
        let response;
        try {
          response = await fetch(SHEETS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: payload,
            redirect: "follow",
            credentials: "omit",
            cache: "no-store",
          });
        } catch (netErr) {
          // fetch died — fall back to XHR as a last resort
          if (isPhoneScreen) setPhonePhotoStatus(`fetch падна (${netErr.message || netErr}), опитвам XHR…`, "info");
          const xhrResult = await new Promise((resolve) => {
            try {
              const xhr = new XMLHttpRequest();
              xhr.open("POST", SHEETS_WEB_APP_URL, true);
              xhr.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
              xhr.timeout = 90000;
              xhr.onload = () => resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, text: xhr.responseText || "" });
              xhr.onerror = () => resolve({ ok: false, status: 0, text: "", err: "XHR network error" });
              xhr.ontimeout = () => resolve({ ok: false, status: 0, text: "", err: "Timeout (>90s)" });
              xhr.send(payload);
            } catch (e) {
              resolve({ ok: false, status: 0, text: "", err: (e && e.message) ? e.message : String(e) });
            }
          });
          if (xhrResult.err) {
            reportErr(`Мрежова грешка ${indexLabel} (fetch + XHR fall back failed): ${xhrResult.err}`);
            return null;
          }
          if (!xhrResult.ok) {
            reportErr(`Apps Script HTTP ${xhrResult.status} (снимка ${indexLabel}). Отговор: ${xhrResult.text.substring(0, 200)}`);
            return null;
          }
          response = { ok: true, status: xhrResult.status, text: () => Promise.resolve(xhrResult.text) };
        }

        const rawText = typeof response.text === "function" ? await response.text() : "";
        if (!response.ok) {
          reportErr(`Apps Script HTTP ${response.status} (снимка ${indexLabel}). Отговор: ${rawText.substring(0, 200)}`);
          try { localStorage.setItem("cg_last_photo_error", "HTTP " + response.status + " — " + rawText.substring(0, 1000)); } catch(_) {}
          return null;
        }

        let result;
        try {
          result = JSON.parse(rawText);
        } catch (parseErr) {
          reportErr(`Apps Script върна невалиден отговор (не е JSON). Деплойнат ли е като 'Anyone'? Начало: ${rawText.substring(0, 200)}`);
          try { localStorage.setItem("cg_last_photo_error", "Non-JSON response: " + rawText.substring(0, 1000)); } catch(_) {}
          return null;
        }

        if (result && result.success && result.photoUrl) {
          try { localStorage.setItem("cg_last_photo_error", ""); } catch(_) {}
          // Live-sync to PC if there's an active pcSessionId (phone QR flow)
          if (state.pcSessionId) {
            if (isPhoneScreen) setPhonePhotoStatus(`Снимка ${indexLabel} качена. Изпращам сигнал към PC…`, "info");
            const ntfyUrl = NTFY_BASE + "/" + encodeURIComponent("cg-photos-" + state.pcSessionId);
            // Try sendBeacon first — it's designed for fire-and-forget POSTs
            // that survive page lifecycle changes and don't need a live
            // user gesture. Falls back to fetch+keepalive if unavailable.
            let beaconQueued = false;
            try {
              if (navigator.sendBeacon) {
                beaconQueued = navigator.sendBeacon(ntfyUrl, result.photoUrl);
              }
            } catch (e) {
              console.warn("[ntfy] sendBeacon threw:", e);
            }
            if (!beaconQueued) {
              try {
                const r = await fetch(ntfyUrl, {
                  method: "POST",
                  body: result.photoUrl,
                  keepalive: true,
                });
                if (!r.ok) _lastUploadError = `ntfy.sh HTTP ${r.status} (снимка ${indexLabel})`;
              } catch (e) {
                _lastUploadError = `ntfy.sh: ${e && e.message ? e.message : e}`;
              }
            } else {
              console.log("[ntfy] queued via sendBeacon:", result.photoUrl.substring(0, 50));
            }
          }
          return result.photoUrl;
        }

        reportErr(`Backend отказа качването ${indexLabel}: ` + (result && result.error ? result.error : "неизвестна грешка"));
        try { localStorage.setItem("cg_last_photo_error", "Backend error: " + rawText.substring(0, 1000)); } catch(_) {}
        return null;
      }

      async function uploadAllPhotos() {
        if (!state.photoFiles || state.photoFiles.length === 0) return [];
        const urls = [];
        for (let i = 0; i < state.photoFiles.length; i++) {
          const label = `${i + 1}/${state.photoFiles.length}`;
          showToast(`Качване на снимка ${label}...`);
          const url = await uploadOnePhoto_(state.photoFiles[i], label);
          if (url) urls.push(url);
        }
        return urls;
      }

      let _submitBusy = false;
      async function submitInspection() {
        if (_submitBusy) return;
        if (!state.currentSessionId) {
          showToast("Няма активно заключване. Моля изберете локация отново.", "error");
          return;
        }
        if (isLockExpired()) {
          showToast("Времето за проверка изтече (" + LOCK_TIMEOUT_MIN + " мин). Моля сканирайте QR кода отново.", "error");
          return;
        }


        const config = getConfig(state.inspectionType);
        state.showValidation = true;
        const allFilled = config.items.every((i) => isFilled(state.itemState[i.id]));
        if (!state.inspector.trim()) { showToast("Моля въведи своето име.", "error"); render(); return; }
        if (ALLOWED_NAMES.length && !ALLOWED_NAMES.includes(state.inspector.trim())) { showToast(`Името „${state.inspector.trim()}" не е в списъка. Избери от падащото меню.`, "error"); render(); return; }
        if (!allFilled) { showToast("Всички точки трябва да бъдат попълнени.", "error"); render(); return; }
        _submitBusy = true;
        try {
          // Upload photos if present
          let localUrls = [];
          if (state.photoFiles.length > 0) {
            localUrls = await uploadAllPhotos();
            if (localUrls.length === 0) {
              showToast("Забележка: Снимките не са качени, но проверката ще бъде записана.", "error");
            } else if (localUrls.length < state.photoFiles.length) {
              showToast(`Внимание: качени са ${localUrls.length} от ${state.photoFiles.length} снимки.`, "error");
            }
          }
          // Combine: phone-uploaded URLs first, then local uploads
          const photoUrls = [...(state.remotePhotoUrls || []), ...localUrls];
          stopPhonePhotoPolling();

          const record = {
            id: Date.now(),
            type: state.inspectionType,
            location: state.location,
            inspector: state.inspector.trim(),
            timestamp: new Date().toISOString(),
            items: config.items.map((i) => ({ id: i.id, label: i.label, icon: i.icon, status: state.itemState[i.id] })),
            notes: state.notes,
            photoUrl: photoUrls[0] || null,
            photoUrls: photoUrls.length > 0 ? photoUrls : null,
          };
          state.records = [record, ...state.records];
          cleanupOldRecords(); /* Изчистване на стари записи >7 дни */
          persist();
          /* Release location lock */
          if (state.currentSessionId) {
            releaseLock(state.currentSessionId);
            state.currentSessionId = null;
            _lockAcquiredAt = 0;
            sessionStorage.removeItem(LOCK_SESSION_KEY);
          }
          showToast(`Проверката на „${state.location}" е записана.`);
          if (isSheetsConfigured()) {
            const syncResult = await syncRecord(record);
            if (syncResult.success && syncResult.verified) {
              showToast("\u2713 \u0421\u0438\u043d\u0445\u0440\u043e\u043d\u0438\u0437\u0438\u0440\u0430\u043d\u043e \u0441 Google Sheets.");
            } else if (syncResult.success) {
              showToast("\u2713 \u0417\u0430\u044f\u0432\u043a\u0430\u0442\u0430 \u0435 \u0438\u0437\u043f\u0440\u0430\u0442\u0435\u043d\u0430 \u043a\u044a\u043c Google Sheets. \u0410\u043a\u043e \u0440\u0435\u0434\u044a\u0442 \u043d\u0435 \u0441\u0435 \u043f\u043e\u044f\u0432\u0438, \u043f\u0440\u043e\u0432\u0435\u0440\u0438 Apps Script \u043b\u043e\u0433\u043e\u0432\u0435\u0442\u0435.");
            } else {
              showToast("\u26a0 \u0417\u0430\u043f\u0438\u0441\u044c\u0442 \u0435 \u0437\u0430\u043f\u0430\u0437\u0435\u043d \u043b\u043e\u043a\u0430\u043b\u043d\u043e. Sheets sync \u043d\u0435\u0443\u0441\u043f\u0435\u0448\u0435\u043d: " + (syncResult.error || "\u043d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u0430 \u0433\u0440\u0435\u0448\u043a\u0430"), "error");
            }
          }
          if (sessionStorage.getItem(QR_MODE_KEY) === "1") {
            setQRCooldown(state.inspectionType, state.location);
            state.openedFromQR = false;
            setTimeout(() => {
              sessionStorage.removeItem(QR_SESSION_KEY);
              sessionStorage.removeItem(QR_MODE_KEY);
              sessionStorage.removeItem(QR_TYPE_KEY);
              sessionStorage.removeItem(QR_LOC_KEY);
              window.location.replace(QR_REDIRECT_URL);
            }, 1200);
            return;
          }
          // Clear photo state
          state.photoFiles = [];
          state.photoPreviews = [];
          state.photoError = "";
          state.remotePhotoUrls = [];
          state.pcSessionId = null;
          stopPhonePhotoPolling();
          state.screen = "home";
          render();
        } finally {
          _submitBusy = false;
        }
      }

      /* ── Export ── */

            date: fmt(r.timestamp), type: getConfig(r.type).shortTitle,

            issues: issues.length ? issues.map((i) => i.label).join(", ") : "—",
            notes: r.notes || "", sheets: state.syncHistory[r.id] || "—",
          };
        });
      }

          '<div class="box"><strong>\u041f\u0440\u043e\u0431\u043b\u0435\u043c\u0438</strong><div>' + issueCount + '</div></div>',

          rows.map((r) => '<tr><td>' + escapeHtml(r.date) + '</td><td>' + escapeHtml(r.type) + '</td><td>' + escapeHtml(r.location) + '</td><td>' + escapeHtml(r.inspector) + '</td><td>' + escapeHtml(r.status) + '</td><td>' + escapeHtml(r.issues) + '</td><td>' + escapeHtml(r.notes) + '</td></tr>').join(''),

      }

      /* ── Last-checked badges ──
         Reads the cached ИНФО rows and figures out when each location was
         last inspected. Colour-codes: green <2h, amber 2-4h, red >4h. */
      function _normalizeLocFromTypeField(typeStr) {
        // ИНФО колона 3 е "Кинозала - Зала 1" или "Тоалетна - Дамска тоалетна".
        if (!typeStr) return null;
        const idx = typeStr.indexOf(" - ");
        if (idx === -1) return null;
        return typeStr.substring(idx + 3).trim();
      }
      function getLastCheckedByLocation() {
        const out = {};
        if (!_cachedChartRows || _cachedChartRows.length === 0) return out;
        // ИНФО headers: ДАТА/ЧАС in row['ДАТА/ЧАС'] (or ДАТА И ЧАС etc.)
        // Find the date header key dynamically — it's the second column.
        const sample = _cachedChartRows[0];
        const keys = Object.keys(sample);
        const dateKey = keys.find(k => /дата|час/i.test(k)) || keys[1];
        const typeKey = keys.find(k => /тип/i.test(k)) || keys[2];
        const statusKey = keys.find(k => /статус/i.test(k)) || keys[4];
        for (const row of _cachedChartRows) {
          const loc = _normalizeLocFromTypeField(row[typeKey]);
          if (!loc) continue;
          const d = parseChartDate(row[dateKey]);
          if (!d) continue;
          const existing = out[loc];
          if (!existing || d > existing.date) {
            out[loc] = { date: d, status: row[statusKey] || "" };
          }
        }
        return out;
      }

      /* Пълна история на една локация от ИНФО — за детайлния изглед.
         Връща подредени записи (най-новите отгоре) + обобщена статистика. */
      function getHallHistory(loc) {
        const empty = { rows: [], today: 0, week: 0, total: 0, problems: 0, avgGapMin: null, inspectors: [] };
        if (!_cachedChartRows || _cachedChartRows.length === 0) return empty;
        const keys = Object.keys(_cachedChartRows[0]);
        const dateKey = keys.find(k => /дата|час/i.test(k)) || keys[1];
        const typeKey = keys.find(k => /тип/i.test(k)) || keys[2];
        const whoKey = keys.find(k => /проверяващ/i.test(k)) || keys[3];
        const statusKey = keys.find(k => /статус/i.test(k)) || keys[4];
        const issuesKey = keys.find(k => /проблем/i.test(k)) || keys[5];
        const notesKey = keys.find(k => /бележк/i.test(k)) || keys[6];
        const photoKey = keys.find(k => /снимк/i.test(k)) || keys[7];

        const rows = [];
        for (const r of _cachedChartRows) {
          if (_normalizeLocFromTypeField(r[typeKey]) !== loc) continue;
          const d = parseChartDate(r[dateKey]);
          if (!d) continue;
          rows.push({
            date: d,
            who: (r[whoKey] || "").trim(),
            status: (r[statusKey] || "").trim(),
            issues: (r[issuesKey] || "").trim(),
            notes: (r[notesKey] || "").trim(),
            photo: (r[photoKey] || "").trim(),
          });
        }
        rows.sort((a, b) => b.date - a.date);

        const now = new Date();
        const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const weekAgo = now.getTime() - 7 * 24 * 3600 * 1000;
        const today = rows.filter(r => r.date.getTime() >= startToday).length;
        const week = rows.filter(r => r.date.getTime() >= weekAgo).length;
        const problems = rows.filter(r => /проблем/i.test(r.status)).length;

        // Средно време между проверките (по днешните, ако са поне 2)
        let avgGapMin = null;
        const todayRows = rows.filter(r => r.date.getTime() >= startToday);
        if (todayRows.length >= 2) {
          let sum = 0;
          for (let i = 0; i < todayRows.length - 1; i++) sum += todayRows[i].date - todayRows[i + 1].date;
          avgGapMin = Math.round(sum / (todayRows.length - 1) / 60000);
        }
        // Кой е проверявал (последните 7 дни, по честота)
        const cnt = {};
        rows.filter(r => r.date.getTime() >= weekAgo && r.who).forEach(r => { cnt[r.who] = (cnt[r.who] || 0) + 1; });
        const inspectors = Object.keys(cnt).map(n => ({ name: n, n: cnt[n] })).sort((a, b) => b.n - a.n);

        return { rows, today, week, total: rows.length, problems, avgGapMin, inspectors };
      }

      function _formatAgo(ms) {
        const mins = Math.floor(ms / 60000);
        if (mins < 1) return "току-що";
        if (mins < 60) return mins + " мин";
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + " ч";
        const days = Math.floor(hrs / 24);
        return days + " д";
      }

      /* Изчислява статус-метаданни за една локация спрямо последната проверка. */
      function _locStatusMeta(last, now) {
        if (!last) {
          return { state: "none", color: "var(--muted-2)", accent: "var(--border-strong)", soft: "var(--panel-2)", label: "Няма данни", sub: "никога", dot: "·" };
        }
        const ageMs = now - last.date.getTime();
        const ageHrs = ageMs / 3600000;
        const wasProblem = last.status === "Проблем";
        let s;
        if (ageHrs < 2) s = { state: "fresh", color: "var(--green-2)", accent: "var(--green)", soft: "var(--green-soft)", dot: "✓" };
        else if (ageHrs < 4) s = { state: "warn", color: "var(--amber-2)", accent: "var(--amber)", soft: "var(--amber-soft)", dot: "◐" };
        else s = { state: "stale", color: "var(--red-2)", accent: "var(--red)", soft: "var(--red-soft)", dot: "⚠" };
        s.label = "преди " + _formatAgo(ageMs);
        s.sub = last.date.toLocaleString("bg-BG", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        s.wasProblem = wasProblem;
        s.ageMs = ageMs;
        return s;
      }

      function renderLastCheckedBadges() {
        const lastBy = getLastCheckedByLocation();
        const hasData = Object.keys(lastBy).length > 0;
        // Self-heal: if we have no data yet, kick off a fetch (once).
        if (!hasData) ensureSheetsDataLoaded();

        const now = Date.now();
        const groups = [
          { title: "Кинозали", icon: "hall", items: HALLS },
          { title: "Тоалетни", icon: "restroom-women", items: BATHROOMS },
        ];

        // Summary counts across all locations
        let fresh = 0, warn = 0, stale = 0, none = 0, problems = 0;
        [...HALLS, ...BATHROOMS].forEach(loc => {
          const m = _locStatusMeta(lastBy[loc], now);
          if (m.state === "fresh") fresh++;
          else if (m.state === "warn") warn++;
          else if (m.state === "stale") stale++;
          else none++;
          if (m.wasProblem) problems++;
        });

        const summaryPill = (color, bg, txt) =>
          `<span style="display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-meta);font-weight:600;color:${color};background:${bg};border:1px solid var(--border);padding:3px 9px;border-radius:var(--r-pill);">${txt}</span>`;

        const summary = hasData ? `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          ${fresh ? summaryPill("var(--green-2)", "var(--green-soft)", `✓ ${fresh} скоро`) : ""}
          ${warn ? summaryPill("var(--amber-2)", "var(--amber-soft)", `◐ ${warn}`) : ""}
          ${stale ? summaryPill("var(--red-2)", "var(--red-soft)", `⚠ ${stale} просрочени`) : ""}
          ${problems ? summaryPill("var(--red-2)", "var(--red-soft)", `● ${problems} с проблем`) : ""}
        </div>` : `<span style="font-size:var(--fs-meta);color:var(--muted-2);display:inline-flex;align-items:center;gap:6px;">${spokes("sm")} зареждам…</span>`;

        const renderCard = (loc, groupIcon) => {
          const m = _locStatusMeta(lastBy[loc], now);
          const isNone = m.state === "none";
          // „Просрочена" зала — над 4ч без проверка (или никога). Мига червен !
          // 2-4ч → жълт ! с по-бавна пулсация (предупреждение).
          const isOverdueRed = m.state === "stale" || isNone;
          const isOverdueAmber = m.state === "warn";
          const showAlert = isOverdueRed || isOverdueAmber;
          const alertClass = isOverdueRed ? "cg-overdue-alert" : "cg-overdue-alert warn";
          const alertTitle = isOverdueRed
            ? (isNone ? "Никога не е проверявана — извърши проверка!" : "Просрочена проверка — над 4 часа!")
            : "Скоро ще е просрочена — над 2 часа без проверка";
          const cardGlow = isOverdueRed ? " cg-overdue-card" : "";
          return `<div class="${cardGlow.trim()}" data-action="open-hall-detail" data-loc="${escapeHtml(loc)}" title="Виж подробна история за ${escapeHtml(loc)}" style="position:relative;display:flex;align-items:stretch;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-md);overflow:visible;transition:background .2s,transform .15s,border-color .2s;min-width:0;cursor:pointer;">
            ${showAlert ? `<span class="${alertClass}" title="${alertTitle}" aria-label="${alertTitle}">!</span>` : ''}
            <div style="width:3px;flex-shrink:0;background:${m.accent};border-radius:var(--r-md) 0 0 var(--r-md);"></div>
            <div style="padding:11px 13px;display:flex;flex-direction:column;min-width:0;flex:1;overflow:hidden;border-radius:0 var(--r-md) var(--r-md) 0;">
             <div style="display:flex;align-items:center;gap:11px;min-width:0;">
              ${(() => {
                const hnn = (loc.match(/(\d+)/) || [])[1];
                const hc = (hnn && groupIcon === "hall") ? hallColor(parseInt(hnn, 10)) : null;
                const bg = hc ? `rgba(${hc.g},.18)` : m.soft;
                const bd = hc ? `border:1px solid rgba(${hc.g},.4);` : "";
                return `<div class="cg-icon-tile" style="width:34px;height:34px;background:${bg};${bd}color:${hc ? hc.c : "var(--muted)"};">${cgIcon(groupIcon)}</div>`;
              })()}
              <div style="min-width:0;flex:1;">
                <div style="font-size:var(--fs-body);font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(loc)}</div>
                <div style="font-size:var(--fs-meta);color:${m.color};font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:2px;min-width:0;">
                  <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;"><span style="flex-shrink:0;">${m.dot}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">${m.label}</span></span>
                  ${m.wasProblem ? '<span style="color:var(--red-2);font-size:var(--fs-micro);flex-shrink:0;white-space:nowrap;" title="Последна проверка: Проблем">● проблем</span>' : ''}
                </div>
              </div>
             </div>
             <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;min-width:0;">
              <div style="min-width:0;flex:1;">
                ${(() => {
                  const hn = (loc.match(/(\d+)/) || [])[1];
                  if (!hn || !NEXTCLEAN_PROXY_URL) return "";
                  const num = parseInt(hn, 10);
                  // Свършила прожекция (задържана поне 5 мин) → почисти сега
                  const endedShow = _endedHallsSeen[num] && (Date.now() - _endedHallsSeen[num].ts <= ENDED_STICKY_MS);
                  if (endedShow) {
                    return `<div style="font-size:var(--fs-micro);color:var(--green-2);font-weight:700;display:flex;align-items:center;gap:4px;min-width:0;">${cgIcon("inspection", 13, "flex-shrink:0;")}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">свърши — провери залата</span></div>`;
                  }
                  const show = _currentShowForHall(num);
                  if (!show) return "";
                  const soon = show.endsInMin != null && show.endsInMin <= 15;
                  return `<div style="font-size:var(--fs-micro);color:${soon ? 'var(--red-2)' : 'var(--muted-2)'};display:flex;align-items:center;gap:4px;min-width:0;">${cgIcon("screening", 13, "flex-shrink:0;")}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">свършва ${escapeHtml(show.end)}${show.endsInMin != null ? ` (${show.endsInMin} мин)` : ""}</span></div>`;
                })()}
              </div>
              ${!isNone ? `<div style="font-size:var(--fs-micro);color:var(--muted-2);flex-shrink:0;white-space:nowrap;">${escapeHtml(m.sub)}</div>` : ''}
             </div>
            </div>
          </div>`;
        };

        return `<div class="panel" style="margin-bottom:var(--s4);">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
            <h3 style="font-size:var(--fs-section);font-family:var(--font-display);font-weight:600;color:var(--text);margin:0;display:flex;align-items:center;gap:8px;">
              <span style="font-size:var(--fs-card);">⏱</span> Статус на проверките
            </h3>
            ${summary}
          </div>
          ${groups.map(g => `
            <div style="margin-bottom:14px;">
              <div style="font-size:var(--fs-micro);font-weight:700;letter-spacing:.1em;color:var(--muted-2);margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;">${cgIcon(g.icon, 14)} ${g.title}</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:9px;">
                ${g.items.map(loc => renderCard(loc, g.icon)).join("")}
              </div>
            </div>
          `).join("")}
          <div style="font-size:var(--fs-micro);color:var(--muted-2);margin-top:2px;display:flex;gap:14px;flex-wrap:wrap;">
            <span><span style="color:var(--green-2);">✓</span> до 2ч</span>
            <span><span style="color:var(--amber-2);">◐</span> 2–4ч</span>
            <span><span style="color:var(--red-2);">⚠</span> над 4ч</span>
          </div>
        </div>`;
      }

      /* ── Feature announcement (new phone photo upload) ── */
      const FEATURE_ANN_KEY = "cg_feature_ann_phone_upload_v1";
      function isFeatureAnnDismissed() {
        try { return localStorage.getItem(FEATURE_ANN_KEY) === "1"; } catch (_) { return false; }
      }
      function renderFeatureAnnouncement() {
        if (isFeatureAnnDismissed()) return "";
        return `
          <div class="panel" style="border-left:3px solid var(--green);margin-bottom:var(--s4);position:relative;">
            <button type="button" data-action="dismiss-feature-ann" style="position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:var(--fs-card);line-height:1;display:flex;align-items:center;justify-content:center;" aria-label="Затвори съобщението">✕</button>
            <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">
              <div style="font-size:24px;line-height:1;flex-shrink:0;">📱📸</div>

                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                  <span style="font-size:var(--fs-micro);font-weight:700;letter-spacing:.12em;color:var(--green-2);background:var(--green-soft);padding:2px 8px;border-radius:var(--r-sm);">НОВА ФУНКЦИЯ</span>
                </div>
                <div style="font-size:var(--fs-section);font-family:var(--font-display);font-weight:600;color:var(--text);margin-bottom:6px;">Качване на снимки от телефон чрез QR код</div>

                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;font-size:var(--fs-meta);color:var(--muted);">

                    <b style="color:var(--green-2);">1.</b> Натисни <b>„📱 Качи снимки от телефон (QR код)"</b> в зоната за снимки
                  </div>
                  <div style="background:var(--panel-2);border-radius:var(--r-sm);padding:8px 10px;border:1px solid var(--border);">
