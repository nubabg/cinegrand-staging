        background: var(--amber); color: var(--on-fill);
        box-shadow: 0 0 0 2px var(--panel);
      }
      .cg-overdue-card { border-color: rgba(var(--red-rgb),.42) !important; }
      body.low-perf .cg-overdue-alert { animation: none; }
      body.low-perf .cg-overdue-card { animation: none; }

      /* ── Свършила прожекция — картата се маркира с контур, не с пулс ── */
      .cg-ended-card { border-color: var(--hall-glow, var(--green)) !important; }
      .cg-clean-badge { /* статичен бадж; състоянието се чете по текста и цвета */ }
      body.low-perf .cg-ended-card { animation: none; }
      body.low-perf .cg-clean-badge { animation: none; }

      /* ── Прогрес на течаща прожекция ── */
      .cg-prog-track {
        position: relative; height: 6px; border-radius: var(--r-pill); overflow: hidden;
        background: var(--panel-3);
      }
      .cg-prog-fill {
        position: absolute; inset: 0 auto 0 0; border-radius: var(--r-pill);
        background: var(--p-to, var(--gold));
        transition: width .9s cubic-bezier(.4,0,.2,1);
      }
      .cg-prog-fill::after { content: none; }
      /* Връхче в края на прогреса — маркер за текущата позиция */
      .cg-prog-head {
        position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%;
        transform: translate(-50%, -50%);
        background: var(--p-to, var(--gold));
        box-shadow: 0 0 0 2px var(--panel);
        transition: left .9s cubic-bezier(.4,0,.2,1);
      }
      body.low-perf .cg-prog-head { animation: none; }

      /* ── СЛЕДВАЩА прожекция — открояване по контур ── */
      .cg-next-card { border-color: var(--gold-line) !important; }
      .cg-next-pill { /* статичен; открояването е в цвета на бàджа */ }
      body.low-perf .cg-next-card { animation: none; }
      body.low-perf .cg-next-pill { animation: none; }

      /* Кликаема карта за зала — подсказва, че има детайли */
      [data-action="open-hall-detail"]:hover {
        background: rgba(255,255,255,.05) !important;
        border-color: rgba(255,255,255,.18) !important;
        transform: translateY(-2px);
      }
      [data-action="open-hall-detail"]:active { transform: scale(.99); }

      /* ── Странични банери (PC) — 280×800, файлове в /banners/ ── */
      .cg-side-banner {
        display: none;
        position: fixed; top: 50%; transform: translateY(-50%);
        width: 280px; height: 800px; z-index: 4;
        border-radius: 18px; overflow: hidden;
        box-shadow: 0 18px 50px rgba(0,0,0,.45);
      }
      .cg-side-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cg-side-banner.left  { left: 20px; }
      .cg-side-banner.right { right: 20px; }
      /* Показват се само когато встрани от работната зона (1280px) има място */
      @media (min-width: 1880px) {
        .cg-side-banner.has-image { display: block; }
      }
      body.low-perf .cg-prog-fill, body.low-perf .cg-prog-head { transition: none; }

      /* ── CineGrand икони ── */
      .cg-icon {
        width: 1.25em; height: 1.25em;
        flex-shrink: 0; display: inline-block;
        vertical-align: -.2em;
        color: currentColor;
      }
      /* Плочка за икона — където досега емоджито стоеше върху цветен фон */
      .cg-icon-tile {
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0; border-radius: var(--r-sm);
      }
      .cg-icon-tile .cg-icon { width: 60%; height: 60%; vertical-align: 0; }

      /* ── Настройки: редове с етикет и сегментиран превключвател ── */
      .settings-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--s3); margin-bottom: var(--s5);
      }
      .settings-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--s4); padding: var(--s4) 0;
        border-top: 1px solid var(--border-subtle);
      }
      .settings-row:first-of-type { border-top: none; padding-top: 0; }
      .settings-text { min-width: 0; }
      .settings-label { font-size: var(--fs-body); font-weight: 700; color: var(--text); }
      .settings-hint  { font-size: var(--fs-meta); color: var(--muted); margin-top: 2px; }

      .seg {
        display: inline-flex; flex-shrink: 0;
        background: var(--panel-3);
        border: 1px solid var(--border); border-radius: var(--r-md);
        padding: 3px; gap: 3px;
      }
      .seg-btn {
        min-height: 34px; padding: 0 var(--s4);
        border: 1px solid transparent; border-radius: var(--r-sm);
        background: transparent; color: var(--muted);
        font-family: var(--font-ui); font-size: var(--fs-meta); font-weight: 600;
        cursor: pointer; white-space: nowrap;
        transition: background .15s ease, color .15s ease, border-color .15s ease;
      }
      .seg-btn:hover { color: var(--text); background: var(--panel-2); }
      .seg-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .seg-btn.active {
        background: var(--gold); color: var(--gold-ink);
        border-color: var(--gold); font-weight: 700;
      }
      @media (max-width: 480px) {
        .settings-row { flex-direction: column; align-items: stretch; gap: var(--s3); }
        .seg { align-self: stretch; }
        .seg-btn { flex: 1; }
      }

      /* ── Под 1024px няма място за колона: същите елементи се подреждат
         хоризонтално над съдържанието. Без скриване и без нови контроли. ── */
      @media (max-width: 1024px) {
        .app-layout { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
        .sidebar {
          position: static; height: auto; overflow: visible;
          padding: var(--s3);
        }
        .topbar { flex-direction: column; gap: var(--s3); }
        .topbar-nav { flex-direction: row; flex-wrap: wrap; gap: var(--s1); }
        .nav-btn {
          width: auto; padding: 0 var(--s3);
          overflow: visible; text-overflow: clip;
        }
        .nav-btn::after {
          left: var(--s3); right: var(--s3); top: auto; bottom: 5px;
          width: auto; height: 2px; border-radius: 2px;
        }
        .topbar-meta {
          flex-direction: row; flex-wrap: wrap; align-items: center;
          margin-top: 0; padding-top: var(--s3);
        }
        .topbar-meta > .meta-chip { flex: 0 0 auto; }
        .product-strip { justify-content: flex-start; margin-bottom: var(--s3); }
      }

    </style>

      /* ── Access Attempt Blocking ── */
      const ACCESS_BLOCK_KEY = "cg_access_block";
      const ACCESS_ATTEMPTS_KEY = "cg_access_attempts";
      const ACCESS_MAX_ATTEMPTS = 5;
      const ACCESS_BLOCK_DURATION_MS = 60 * 60 * 1000; /* 1 час реално блокиране */
      const ACCESS_BLOCK_DISPLAY_MIN = 5; /* показва "5 минути" на потребителя */

      function getAccessBlock() {
        try {
          const data = JSON.parse(localStorage.getItem(ACCESS_BLOCK_KEY) || "null");
          if (!data) return null;
          if (Date.now() - data.blockedAt >= ACCESS_BLOCK_DURATION_MS) {
            localStorage.removeItem(ACCESS_BLOCK_KEY);
            localStorage.removeItem(ACCESS_ATTEMPTS_KEY);
            return null;
          }
          return data;
        } catch (_) { return null; }
      }

      function recordFailedAttempt() {
        try {
          const attempts = JSON.parse(localStorage.getItem(ACCESS_ATTEMPTS_KEY) || "[]");
          attempts.push(Date.now());
          const recent = attempts.filter(t => Date.now() - t < ACCESS_BLOCK_DURATION_MS);

            return true;

          return false;

              <div style="font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;margin-bottom:12px;color:var(--red-2);">ДОСТЪПЪТ Е БЛОКИРАН</div>
              <div style="color:var(--muted);font-size:var(--fs-body);line-height:1.6;">Твърде много неуспешни опити за достъп.<br>Опитайте отново след <strong style="color:var(--text);">${ACCESS_BLOCK_DISPLAY_MIN} минути</strong>.</div>
            </div>
          </div>`;
      }

      /* ── Location Inspection Locks ── */
      const LOCK_SESSION_KEY = "cg_lock_session";
      const LOCK_WHITELISTED_KEY = "cg_ip_whitelisted";
      const LOCK_TIMEOUT_MIN = 10;

      function getQRCooldownRemaining(type, loc) {
        try {
          const data = JSON.parse(localStorage.getItem(QR_COOLDOWN_KEY) || "{}");
          const remaining = QR_COOLDOWN_MS - (Date.now() - (data[type + "_" + loc] || 0));
          return remaining > 0 ? remaining : 0;
        } catch (_) { return 0; }
      }

      function setQRCooldown(type, loc) {
        try {
          const data = JSON.parse(localStorage.getItem(QR_COOLDOWN_KEY) || "{}");
          data[type + "_" + loc] = Date.now();
          localStorage.setItem(QR_COOLDOWN_KEY, JSON.stringify(data));
        } catch (_) {}
      }

      /* ── Location Lock helpers ── */
      let _lockBusy = false;
      let _lockAcquiredAt = 0;
      const LOCK_TIMEOUT_MS = LOCK_TIMEOUT_MIN * 60 * 1000;

      function generateSessionId() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
        return Date.now().toString(36) + "-" + Math.random().toString(36).substr(2, 9);
      }

      function isLockExpired() {
        return _lockAcquiredAt > 0 && (Date.now() - _lockAcquiredAt >= LOCK_TIMEOUT_MS);
      }

      /* fetch с твърд timeout — пази UI-а от увисване при бавен/мъртъв backend.
         Хвърля грешка с name "AbortError" при изтичане. */
      async function fetchWithTimeout(url, options, timeoutMs) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs || 12000);
        try {
          return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
        } finally {
          clearTimeout(id);
        }
      }

      /* JSON заявка към Apps Script с повторни опити.
         Apps Script backend-ът се проваля временно доста често: cold start
         (>15 сек), 429/5xx при паралелни извиквания, или връща HTML страница
         за грешка вместо JSON. Един-единствен опит затова понякога гърми без
         реален проблем. Тук: нарастващ timeout + backoff между опитите.
         Хвърля грешка с .reason (кратък текст на български) при провал. */
      async function fetchJsonRetry(url, options, opts) {
        const cfg      = opts || {};
        const timeouts = cfg.timeouts || [12000, 20000, 28000];
        const backoffs = cfg.backoffs || [700, 1800];
        const attempts = cfg.attempts || timeouts.length;
        let lastErr = null;

        for (let i = 0; i < attempts; i++) {
          try {
            const res = await fetchWithTimeout(url, options, timeouts[Math.min(i, timeouts.length - 1)]);
            if (!res.ok) {
              const e = new Error("HTTP " + res.status);
              e.retriable = (res.status === 429 || res.status >= 500);
              e.reason    = "сървърът върна грешка " + res.status;
              throw e;
            }
            const text = await res.text();
            try {
              return JSON.parse(text);
            } catch (_) {
              /* Apps Script връща HTML (login/quota/error страница) вместо JSON */
              const e = new Error("Non-JSON response");
              e.retriable = true;
              e.reason    = "невалиден отговор от сървъра";
              throw e;
            }
          } catch (err) {
            if (err && (err.name === "AbortError" || err.name === "TimeoutError")) {
              err.retriable = true;
              err.reason    = "времето за връзка изтече";
            } else if (err && err.retriable === undefined) {
              /* мрежова грешка (offline, DNS, прекъсната връзка) */
              err.retriable = true;
              err.reason    = "няма връзка с интернет";
            }
            lastErr = err;
            if (!err.retriable || i === attempts - 1) break;
            await new Promise((r) => setTimeout(r, backoffs[Math.min(i, backoffs.length - 1)]));
          }
        }
        throw lastErr || new Error("Request failed");
      }

      /* Събужда Apps Script backend-а с лек GET, за да не е cold при следваща
         операция. Fire-and-forget, throttle-нато веднъж на 60 сек. */
      let _lastWarmup = 0;
      function warmUpBackend() {
        if (!isSheetsConfigured()) return;
        const now = Date.now();
        if (now - _lastWarmup < 60000) return;
        _lastWarmup = now;
        /* action=ping е най-лекият възможен warmup. Ако разгърнатата версия
           на Apps Script още не го поддържа, връща "Unknown action" — което
           също е достатъчно, за да е топъл backend-ът. */
        const url = SHEETS_WEB_APP_URL + "?action=ping&_token=" + encodeURIComponent(SHEETS_SECRET_TOKEN) + "&_warm=1&_cb=" + now;
        fetchWithTimeout(url, { cache: "no-store" }, 20000).catch(() => {});
      }

      /* ══════════════════════════════════════════════════════════════
         ЗАКЛЮЧВАНЕ ПРЕЗ ntfy.sh — надеждно, без Apps Script backend.
         ntfy topic-ът служи като споделен журнал от lock/unlock събития.
         Всяко устройство чете последните ~15 мин събития, за да определи
         дали дадена зала е заключена от друг. Работи, защото ntfy е бърз и
         надежден (използва се и за снимките).
         ══════════════════════════════════════════════════════════════ */
      const LOCK_NTFY_TOPIC = "cg-locks-cinegrand-v1";
      const LOCK_TTL_MS = 12 * 60 * 1000;      // колко дълго важи lock без heartbeat
      const LOCK_HEARTBEAT_MS = 4 * 60 * 1000; // презаписване докато залата е отворена
      let _lockHeartbeatTimer = null;
      let _heldLockKey = null;                 // "type|location" на текущо държания lock

      function _lockKey(type, location) { return type + "|" + location; }

      async function _fetchLockEvents() {
        const url = NTFY_BASE + "/" + encodeURIComponent(LOCK_NTFY_TOPIC) + "/json?poll=1&since=15m";
        const res = await fetchWithTimeout(url, { method: "GET", cache: "no-store" }, 10000);
        if (!res.ok) throw new Error("ntfy HTTP " + res.status);
        const text = await res.text();
        const events = [];
        for (const line of text.split("\n")) {
          if (!line.trim()) continue;
          try {
            const d = JSON.parse(line);
            if (!d || d.event !== "message" || !d.message) continue;
            const ev = JSON.parse(d.message);
            if (ev && ev.t && ev.l && ev.s && ev.a && ev.ts) events.push(ev);
          } catch (_) {}
        }
        return events;
      }

      /* Определя текущия държател на lock за зала (или null).
         При едновременно заключване печели най-малкият sessionId — детерминистично,
         независимо от реда, така че всички устройства избират един и същ победител. */
      function _computeLockHolder(events, type, location, nowTs) {
        const key = _lockKey(type, location);
        const active = new Map(); // sessionId -> ts на последния lock
        const sorted = events.slice().sort((a, b) => a.ts - b.ts);
        for (const ev of sorted) {
          if (_lockKey(ev.t, ev.l) !== key) continue;
          if (ev.a === "lock") {
            if (nowTs - ev.ts <= LOCK_TTL_MS) active.set(ev.s, ev.ts);
          } else if (ev.a === "unlock") {
            active.delete(ev.s);
          }
        }
        if (active.size === 0) return null;
        let winner = null;
        for (const s of active.keys()) { if (winner === null || s < winner) winner = s; }
        return { s: winner, ts: active.get(winner) };
      }

      async function _publishLockEvent(type, location, sessionId, action) {
        const msg = JSON.stringify({ t: type, l: location, s: sessionId, a: action, ts: Date.now() });
        try {
          await fetchWithTimeout(NTFY_BASE + "/" + encodeURIComponent(LOCK_NTFY_TOPIC), { method: "POST", body: msg }, 8000);
          return true;
        } catch (_) { return false; }
      }

      function _startLockHeartbeat(type, location, sessionId) {
        _stopLockHeartbeat();
        _lockHeartbeatTimer = setInterval(() => { _publishLockEvent(type, location, sessionId, "lock"); }, LOCK_HEARTBEAT_MS);
      }
      function _stopLockHeartbeat() {
        if (_lockHeartbeatTimer) { clearInterval(_lockHeartbeatTimer); _lockHeartbeatTimer = null; }
      }

      async function acquireLock(type, location, sessionId) {
        try {
          const now = Date.now();
          const events = await _fetchLockEvents();
          const holder = _computeLockHolder(events, type, location, now);
          if (holder && holder.s !== sessionId) {
            const minsLeft = Math.max(1, Math.ceil((LOCK_TTL_MS - (now - holder.ts)) / 60000));
            return { success: false, locked: true, minutesLeft: minsLeft, error: location + " вече се проверява. Опитайте след ~" + minsLeft + " мин." };
          }
          // Свободна — заяви lock
          await _publishLockEvent(type, location, sessionId, "lock");
          // Кратка проверка за едновременно заключване (race)
          await new Promise(r => setTimeout(r, 1300));
          const holder2 = _computeLockHolder(await _fetchLockEvents(), type, location, Date.now());
          if (holder2 && holder2.s !== sessionId) {
            return { success: false, locked: true, error: location + " беше заета от друг колега." };
          }
          // Държим lock-а — стартирай heartbeat докато залата е отворена
          _heldLockKey = _lockKey(type, location);
          _startLockHeartbeat(type, location, sessionId);
          return { success: true };
        } catch (err) {
          // ntfy недостъпен — best-effort (не блокирай работата)
          console.warn("[ntfyLock] acquire failed:", err.message);
          return { success: true, offline: true };
        }
      }

      async function releaseLock(sessionId) {
        _stopLockHeartbeat();
        if (!sessionId || !_heldLockKey) { _heldLockKey = null; return; }
        const parts = _heldLockKey.split("|");
        _heldLockKey = null;
        await _publishLockEvent(parts[0], parts[1], sessionId, "unlock");
      }

      function releaseLockBeacon(sessionId) {
        _stopLockHeartbeat();
        if (!sessionId || !_heldLockKey) { _heldLockKey = null; return; }
        const parts = _heldLockKey.split("|");
        const msg = JSON.stringify({ t: parts[0], l: parts[1], s: sessionId, a: "unlock", ts: Date.now() });
        _heldLockKey = null;
        try {
          const blob = new Blob([msg], { type: "text/plain;charset=UTF-8" });
          navigator.sendBeacon(NTFY_BASE + "/" + encodeURIComponent(LOCK_NTFY_TOPIC), blob);
        } catch (_) {
          try { fetch(NTFY_BASE + "/" + encodeURIComponent(LOCK_NTFY_TOPIC), { method: "POST", body: msg, keepalive: true }).catch(() => {}); } catch (_2) {}
        }
      }

      function cleanupSessionLock() {
        if (state.currentSessionId) {
          releaseLock(state.currentSessionId);
          state.currentSessionId = null;
          _lockAcquiredAt = 0;
        }
        sessionStorage.removeItem(LOCK_SESSION_KEY);
      }

      /* Интерпретира резултата от acquireLock:
         - locked === true → истинско заключване от друг потребител
         - иначе (success:false без locked) → временна сървърна грешка
           (Google Apps Script cold-start / претоварване / infra грешка) */
      function interpretLockResult(lockResult, location) {
        const realLock = !!(lockResult && lockResult.locked);
        if (realLock) {
          return {
            transient: false,
            message: lockResult.error
              ? lockResult.error
              : (location + " вече се проверява от друг потребител. Опитайте след ~" + LOCK_TIMEOUT_MIN + " мин."),
            detail: "",
          };
        }
        // Временна грешка — покажи разбираемо съобщение, а техническата
        // (често английска Google грешка) само като дребен детайл.
        return {
          transient: true,
          message: "Сървърът е временно натоварен и не успя да отговори навреме. Това не е реално заключване — просто натисни бутона за повторен опит.",
          detail: lockResult && lockResult.error ? String(lockResult.error) : "",
        };
      }

      function showLocationLocked(location, lockResult, opts) {
        const type = opts && opts.type;
        const info = interpretLockResult(lockResult && typeof lockResult === "object" ? lockResult : { error: lockResult }, location);
        const transient = info.transient;
        const title = transient ? "СЪРВЪРЪТ Е БАВЕН" : "ЛОКАЦИЯТА Е ЗАЕТА";
        const icon = transient ? "⏱" : "🔒";
        const ringColor = transient ? "245,158,11" : "239,91,91";
        const retryBtn = transient && type && location
          ? `<button id="cg-lock-retry" class="btn btn-gold" style="margin-top:20px;padding:12px 32px;font-size:var(--fs-card);">↻ Опитай отново</button>
             <button id="cg-lock-home" class="btn btn-outline" style="margin-top:10px;padding:10px 28px;font-size:var(--fs-body);display:block;margin-left:auto;margin-right:auto;">Към началото</button>`
          : `<button id="cg-lock-home" class="btn btn-outline" style="margin-top:20px;padding:10px 28px;font-size:var(--fs-body);">Към началото</button>`;
        document.getElementById("app").innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="text-align:center;max-width:460px;">
              <div style="width:76px;height:76px;border-radius:50%;background:rgba(${ringColor},.15);border:1px solid rgba(${ringColor},.35);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:28px;box-shadow:none;">${icon}</div>
              <div style="font-family:'Oswald',sans-serif;font-size:23px;font-weight:700;letter-spacing:.06em;margin-bottom:12px;">${title}</div>
              <div style="color:var(--muted);font-size:var(--fs-body);line-height:1.65;">${escapeHtml(info.message)}</div>
              ${info.detail ? `<div style="color:var(--muted-2);font-size:var(--fs-micro);line-height:1.5;margin-top:10px;opacity:.7;">Техн. детайл: ${escapeHtml(info.detail).substring(0, 160)}</div>` : ""}
              ${retryBtn}
            </div>
          </div>`;
        const retryEl = document.getElementById("cg-lock-retry");
        if (retryEl) retryEl.addEventListener("click", () => lockAndStart(type, location));
        const homeEl = document.getElementById("cg-lock-home");
        if (homeEl) homeEl.addEventListener("click", () => { state.screen = "home"; render(); });
      }

      /* ── Geolocation Access Control ── */
      const CINEMA_LAT = 42.678351;
      const CINEMA_LNG = 23.320035;
      const CINEMA_RADIUS_M = 200;
      const GEO_RECHECK_MS = 5 * 60 * 1000; /* Проверка на локация всеки 5 минути */

      function distanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function getGeolocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) { resolve(null); return; }
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });
      }

      function isNearCinema(lat, lng) {
        return distanceMeters(lat, lng, CINEMA_LAT, CINEMA_LNG) <= CINEMA_RADIUS_M;
      }

      function showAccessDenied() {
        document.getElementById("app").innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="text-align:center;max-width:400px;">
              <div style="width:72px;height:72px;border-radius:50%;background:var(--red-soft);border:1px solid rgba(var(--red-rgb),.42);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:28px;">🔒</div>
              <div style="font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;margin-bottom:12px;">ДОСТЪПЪТ Е ОТКАЗАН</div>
              <div style="color:var(--muted);font-size:var(--fs-body);line-height:1.6;">Сканирайте QR кода на Вашата локация, за да влезете в системата.</div>
            </div>
          </div>`;
      }

      function showAccessLoading() {
        document.getElementById("app").innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
            <div style="text-align:center;">
              ${spokes("lg", "margin:0 auto 20px;display:block;color:var(--gold-2);")}
              <div id="loading-text" style="color:var(--muted);font-size:var(--fs-body);">Проверка на достъп…</div>
            </div>
          </div>`;
      }

      function updateLoadingText(text) {
        const el = document.getElementById("loading-text");
        if (el) el.textContent = text;
      }

      function showOutsideCinema() {
        document.getElementById("app").innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="text-align:center;max-width:400px;">
              <div style="width:72px;height:72px;border-radius:50%;background:var(--red-soft);border:1px solid rgba(var(--red-rgb),.42);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:28px;">📍</div>
              <div style="font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;margin-bottom:12px;">ИЗВЪН ЛОКАЦИЯТА</div>
              <div style="color:var(--muted);font-size:var(--fs-body);line-height:1.6;">Трябва да се намирате в <strong style="color:var(--text);">Cine Grand Park Center</strong>, за да използвате системата.</div>
            </div>
          </div>`;
      }

      async function checkAccess() {
        /* IP проверка — whitelisted IP-та имат достъп отвсякъде */
        let isWhitelistedIP = false;
        try {
          const res = await fetchWithTimeout("https://api.ipify.org?format=json", {}, 6000);
          const { ip } = await res.json();
          isWhitelistedIP = ACCESS_ALLOWED_IPS.includes(ip);
        } catch (_) {
          /* Fallback: опитай втори IP сервис ако първият не отговори */
          try {
            const res2 = await fetchWithTimeout("https://api.my-ip.io/v2/ip.json", {}, 6000);
            const data2 = await res2.json();
            if (data2 && data2.ip) isWhitelistedIP = ACCESS_ALLOWED_IPS.includes(data2.ip);
          } catch (_2) {}
        }
        sessionStorage.setItem(LOCK_WHITELISTED_KEY, isWhitelistedIP ? "1" : "0");

        const params = new URLSearchParams(window.location.search || (window.location.hash.startsWith("#") ? window.location.hash.slice(1) : ""));
        /* Phone-photo flow — отделна страница за качване на снимки от телефон чрез QR.
           Без IP/cooldown/lock проверки; гео-проверката важи за не-whitelisted IP. */
        if (params.get("phonephoto") === "1") {
          if (!isWhitelistedIP) {
            updateLoadingText("Проверка на локация…");
            const pos = await getGeolocation();
            if (!pos || !isNearCinema(pos.lat, pos.lng)) return "outside";
          }
          return true;
        }
        /* QR достъп — URL съдържа QR параметри */
        if (params.get("open") === "inspection") {
          const type = params.get("type") || "";
          const loc = params.get("location") || "";
          /* Whitelisted IP-та пропускат cooldown — могат да сканират без ограничение */
          if (!isWhitelistedIP && getQRCooldownRemaining(type, loc) > 0) return false;
          if (!isWhitelistedIP) {
            /* Геолокация — трябва да е в киното (само за не-whitelisted IP) */
            updateLoadingText("Проверка на локация…");
            const pos = await getGeolocation();
            if (!pos || !isNearCinema(pos.lat, pos.lng)) return "outside";
          }
          sessionStorage.setItem(QR_SESSION_KEY, String(Date.now()));
          sessionStorage.setItem(QR_MODE_KEY, "1");
          sessionStorage.setItem(QR_TYPE_KEY, type);
          sessionStorage.setItem(QR_LOC_KEY, loc);
          return true;
        }
        /* Сесия — вече е влязъл чрез QR в тази сесия, проверка за изтичане */
        const sessionTs = parseInt(sessionStorage.getItem(QR_SESSION_KEY) || "0", 10);
        if (sessionTs) {
          if (Date.now() - sessionTs < QR_SESSION_TTL_MS) {
            if (!isWhitelistedIP) {
              /* Геолокация при reload на QR сесия (само за не-whitelisted IP) */
              updateLoadingText("Проверка на локация…");
              const pos = await getGeolocation();
              if (!pos || !isNearCinema(pos.lat, pos.lng)) return "outside";
            }
            return true;
          }
          sessionStorage.removeItem(QR_SESSION_KEY);
          sessionStorage.removeItem(QR_MODE_KEY);
          sessionStorage.removeItem(QR_TYPE_KEY);
          sessionStorage.removeItem(QR_LOC_KEY);
        }
        /* Whitelisted IP без QR — пълен достъп */
        if (isWhitelistedIP) return true;
        return false;
      }

      /* Само тези локации се показват в QR модала */
      const QR_LOCATIONS = [
        ...HALLS.map((loc) => ({ type: "hall", location: loc, icon: "hall" })),
        { type: "bathroom", location: "Дамска тоалетна", icon: "restroom-women" },
        { type: "bathroom", location: "Мъжка тоалетна", icon: "restroom-men" },
      ];

      const CONFIGS = {
        hall: {
          title: "Проверка на Кинозала",
          shortTitle: "Кинозала",
          sectionTitle: "Елементи на Кинозалата",
          accent: "var(--gold)",
          locations: HALLS,
          items: HALL_ITEMS,
          tags: ["Cup Holders", "Седалки", "Мокет", "Под", "Екран", "Подлакътници"],
        },
        bathroom: {

      function getConfig(type) { return CONFIGS[type] || CONFIGS.hall; }

      function fmt(iso) {
        return new Date(iso).toLocaleString("bg-BG", {
          day: "2-digit", month: "2-digit", year: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      }

      function pct(issues, total) { return total > 0 ? Math.round((issues / total) * 100) : 0; }
      function isFilled(v) { return v === STATUS.CLEAN || v === STATUS.DIRTY; }
      function dirtyItems(record) { return (record && record.items || []).filter((i) => i && i.status === STATUS.DIRTY); }

      function escapeHtml(v) {
        return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      const RANGE_OPTIONS = [["today", "\u0414\u043d\u0435\u0441"], ["week", "\u0421\u0435\u0434\u043c\u0438\u0446\u0430"]];

      function rangeLabel(range) {
        const found = RANGE_OPTIONS.find(([v]) => v === range);
        return found ? found[1] : "\u0421\u0435\u0434\u043c\u0438\u0446\u0430";
      }

      function recordsForRange(range) {
        const now = new Date();
        return state.records.filter((r) => {
          try {
            const d = new Date(r && r.timestamp);
            if (isNaN(d.getTime())) return false;
            if (range === "today") return d.toDateString() === now.toDateString();
            return now - d < 7 * 86400000;
          } catch (_) { return false; }
        });
      }

      function historyRecords() {
        return recordsForRange(state.exportRange).filter((r) => {
          if (state.historyTypeFilter !== "all" && r.type !== state.historyTypeFilter) return false;
          if (state.historyLocationFilter !== "all" && r.location !== state.historyLocationFilter) return false;
          return true;
        });
      }

      /* ── Persistence ── */
      function persist() {
        localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(state.records));
        localStorage.setItem(STORAGE_KEYS.sync, JSON.stringify(state.syncHistory));
      }

      /* ── Auto-cleanup: изтрива локални записи по-стари от 7 дни ── */
      function cleanupOldRecords() {
        const cutoff = Date.now() - LOCAL_RETENTION_DAYS * 86400000;
        const before = state.records.length;
        state.records = state.records.filter((r) => new Date(r.timestamp).getTime() > cutoff);
        if (state.records.length < before) {
          persist();
          console.log(`[Cleanup] Изтрити ${before - state.records.length} стари записа (>7 дни)`);
        }
      }

      function showToast(msg, type = "success") {
        state.toast = { msg, type };
        render();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { state.toast = null; render(); }, 4000);
      }

      /* ── Google Sheets Sync ── */
      function isSheetsConfigured() {
        return SHEETS_WEB_APP_URL && SHEETS_WEB_APP_URL !== "???????_????_WEB_APP_URL_???" && SHEETS_WEB_APP_URL.startsWith("https://");
      }

      function buildSheetsPayload(record) {
        const issues = dirtyItems(record);
        const config = getConfig(record.type);
        const status = issues.length ? "\u041c\u0420\u042a\u0421\u041d\u0410" : "\u0427\u0418\u0421\u0422\u0410";
        const typeLabel = config.shortTitle + " - " + record.location;
        const issueLabel = issues.length ? issues.map((item) => item.label).join(", ") : "";
        const notes = record.notes || "";

        return {
          entry_id: String(record.id),
          inspected_at: fmt(record.timestamp),
          inspection_type: typeLabel,
          inspector: record.inspector,
          status,
          issues: issueLabel,
          notes,
          row_values: JSON.stringify([
            record.id,
            fmt(record.timestamp),
            typeLabel,
            record.inspector,
            status,
            issueLabel,
            notes,
          ]),
          record_json: JSON.stringify(record),
        };
      }

      async function sendToSheets(record) {
        if (!isSheetsConfigured()) return { success: false, error: "Sheets URL \u043d\u0435 \u0435 \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0438\u0440\u0430\u043d" };
        const payload = JSON.stringify({ record, _token: SHEETS_SECRET_TOKEN });

        try {
          const response = await fetch(SHEETS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: payload,
          });
          if (!response.ok) return { success: false, error: "HTTP " + response.status };
          return { success: true, verified: true };
        } catch (err) {
          try {
            await fetch(SHEETS_WEB_APP_URL, {
              method: "POST",
              mode: "no-cors",
              body: payload,
            });
            return { success: true, verified: false };
          } catch (fallbackErr) {
            return { success: false, error: fallbackErr.message || err.message };
          }
        }
      }

      async function syncRecord(record) {
        if (!isSheetsConfigured()) return { success: false, error: "Sheets URL \u043d\u0435 \u0435 \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0438\u0440\u0430\u043d" };
        state.syncHistory[record.id] = "syncing";
        persist(); render();
        const result = await sendToSheets(record);
        state.syncHistory[record.id] = result.success ? (result.verified ? "synced" : "sent") : "error";
        persist(); render();
        return result;
      }

      function getQRBaseUrl() {
        const saved = (localStorage.getItem(STORAGE_KEYS.qrBaseUrl) || "").trim();
        if (saved && saved.startsWith("http") && saved.length > 40) return saved.replace(/\/$/, "");
        if (typeof window !== "undefined" && window.location && window.location.href) {
          const href = window.location.href;
          if (href.startsWith("http") && (href.includes("github.io") || href.includes("vercel.app") || href.includes("netlify.app"))) {
            return href.split("?")[0].split("#")[0].replace(/\/$/, "");
          }
        }
        return QR_DEFAULT_URL;
      }

      function lockAndStart(type, location) {
        // Показваме кратък „Заключване…" екран, докато ПОТВЪРДИМ заключването
        // със сървъра ПРЕДИ да отворим формата. Така, ако друг вече проверява
        // тази зала (напр. от PC), телефонът реално се блокира и обратно.
        state.screen = "locking";
        state.location = location;
        state.inspectionType = type;
        render();
        setTimeout(() => { startInspectionWithLock(type, location); }, 150);
      }

      async function acquireLockFirstFree(type, locations, sessionId) {
        if (!isSheetsConfigured()) return { success: true, location: locations[0] };
        try {
          const res = await fetchWithTimeout(SHEETS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: JSON.stringify({ action: "acquireLockFirstFree", type, locations, sessionId, _token: SHEETS_SECRET_TOKEN }),
          }, 12000);
          if (!res.ok) return { success: true, location: locations[0], offline: true };
          try { return await res.json(); } catch (_) { return { success: true, location: locations[0], offline: true }; }
        } catch (err) {
          if (err && err.name === "AbortError") {
            // Server too slow — don't hang the locking screen; proceed without
            // a lock so the inspector can still work.
            console.warn("[Lock] acquireLockFirstFree timed out — proceeding offline");
            return { success: true, location: locations[0], offline: true };
          }
          console.warn("[Lock] acquireLockFirstFree failed:", err.message);
          return { success: true, location: locations[0], offline: true };
        }
      }

      async function startInspectionWithLock(type, locationOverride) {
        if (_lockBusy) return false;
        _lockBusy = true;
        try {
          /* Ако вече има активен lock, освободи го */
          if (state.currentSessionId) {
            await releaseLock(state.currentSessionId);
            state.currentSessionId = null;
            _lockAcquiredAt = 0;
            sessionStorage.removeItem(LOCK_SESSION_KEY);
          }
          const config = getConfig(type);
          if (locationOverride) {
            const sessionId = generateSessionId();
            const lockResult = await acquireLock(type, locationOverride, sessionId);
            if (!lockResult.success) {
              // САМО реално заключване от друг потребител спира инспектора.
              if (lockResult.locked) {
                showLocationLocked(locationOverride, lockResult, { type });
                return false;
              }
              // Сървърна грешка / бавен backend → best-effort: продължаваме
              // тихо, за да НЕ блокираме работата при рядка грешка.
              console.warn("[Lock] server slow/error — proceeding без заключване:", lockResult.error);
            }
            state.lockConfirmed = (lockResult.success === true && !lockResult.offline);
            state.currentSessionId = sessionId;
            _lockAcquiredAt = Date.now();
            sessionStorage.setItem(LOCK_SESSION_KEY, sessionId);
            startInspection(type, locationOverride);
            return true;
          }
          /* Non-QR: 1 заявка — сървърът намира първата свободна локация */
          const sessionId = generateSessionId();
          const result = await acquireLockFirstFree(type, config.locations, sessionId);
          if (!result.success) {
            if (result.allLocked) {
              showToast("Всички " + config.shortTitle.toLowerCase() + " се проверяват в момента. Опитайте след няколко минути.", "error");
              return false;
            }
            /* Сървърна грешка — пропусни lock, отвори формата */
            console.warn("[Lock] acquireLockFirstFree error:", result.error);
            state.lockConfirmed = false;
            startInspection(type);
            return true;
          }
          state.lockConfirmed = (result.success === true && !result.offline);
          state.currentSessionId = sessionId;
          _lockAcquiredAt = Date.now();
          sessionStorage.setItem(LOCK_SESSION_KEY, sessionId);
          startInspection(type, result.location);
          return true;
        } finally {
          _lockBusy = false;
        }
      }
