<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Grand Hygiene Control</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.svg" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap");

      /* ══════════════════════════════════════════════════════════════
         DESIGN TOKENS — професионална тъмна оперативна тема.
         Неутрален графит за повърхностите, ограничен златен акцент,
         приглушени semantic цветове. Всички стари имена са запазени,
         за да продължат да работят съществуващите стилове.
         ══════════════════════════════════════════════════════════════ */
      :root {
        /* ── Повърхности: единна графитна стълбица (тъмно → светло) ── */
        --bg: #07080b;            /* работна повърхност на приложението */
        --bg-2: #050609;          /* най-ниското ниво / зад модали      */
        /* Фонът не е плосък: два едва доловими светлинни центъра дават
           дълбочина, без да пипат разположението. */
        --bg-depth:
          radial-gradient(1100px 720px at 18% -8%, rgba(96,132,190,.10), transparent 62%),
          radial-gradient(900px 620px at 102% 2%, rgba(var(--gold-rgb),.06), transparent 58%);
        --panel: #101319;         /* карти, панели, таблици             */
        --panel-2: #171b23;       /* повдигнато: hover, полета, чипове  */
        --panel-3: #0c0f14;       /* вдлъбнато: table header, tracks    */
        --panel-2-hover: #1e242e; /* hover върху повдигната повърхност  */
        --row-alt: rgba(255,255,255,.018); /* зебра в таблиците         */
        --selection-bg: rgba(var(--gold-rgb),.34);
        --selection-fg: #ffffff;
        --surface: var(--panel);
        --surface-raised: var(--panel-2);
        --surface-sunken: var(--panel-3);

        /* ── Граници ── */
        --border: #2f3846;        /* стандартна разделителна линия      */
        --border-strong: #455163; /* hover / подчертано                 */
        --border-subtle: #232a35; /* вътрешни разделители в таблици     */
        --border-control: #6b7a8d;/* контур на поле/контрола   4.3:1    */

        /* ── Текст (проверен контраст спрямо --panel) ── */
        --text: #ffffff;          /* основен      ~18.6:1               */
        --muted: #b9c3d0;         /* вторичен     ~10.4:1               */
        --muted-2: #98a5b5;       /* метаданни     ~7.4:1               */

        /* ── Бранд ── */
        --gold: #e0891c;          /* марков акцент за плътни площи      */
        --gold-2: #f0b455;        /* акцент за текст/hover  ~8.7:1      */
        --gold-ink: #17110a;      /* текст върху златна повърхност      */
        --logo-ink: #C49A3A;      /* марков цвят на логото (тъмна тема) */
        --on-fill: #08090c;       /* текст върху плътен semantic цвят    */
        --on-heat: #ffffff;       /* текст върху клетка на топлинна карта*/
        --gold-soft: rgba(224,137,28,.14);
        --gold-line: rgba(224,137,28,.34);

        /* ── Semantic (наситени, но не неонови) ──
           Всеки тон държи ≥4.5:1 върху --panel-2, защото служи и за текст. */
        --green: #2fd67f;         --green-2: #5ee89f;   /* текст ~9.1:1 */
        --green-dark: #0d6b41;    --green-soft: rgba(47,214,127,.14);
        --red: #ff5a5a;           --red-2: #ff8080;     /* текст ~5.6:1 */
        --red-dark: #8f1f1f;      --red-soft: rgba(255,90,90,.14);
        --amber: #ffb02e;         --amber-2: #ffc45c;
        --amber-soft: rgba(255,176,46,.14);
        --blue: #4d9cff;          --blue-2: #82bcff;    /* текст ~6.2:1 */
        --blue-soft: rgba(77,156,255,.14);
        --purple: #a98bff;        --purple-2: #c0a8ff;
        --purple-soft: rgba(169,139,255,.14);

        /* ── Цветове за графики ──
           Отделени са от текстовите: диаграмите са графика, за която важи
           праг 3:1, а не 4.5:1. Затова тук тоновете са наситени и живи,
           докато етикетите остават с текстовите цветове. */
        --c-brand:  #ffab35;
        --c-green:  #10e07a;
        --c-red:    #ff2d2d;
        --c-blue:   #2f8bff;
        --c-purple: #9d7bff;
        --c-teal:   #1fdcc4;
        --c-amber:  #ffb020;
        --c-pink:   #ff5fb0;
        --c-lime:   #a9f03a;

        /* ── Идентичност на залите ──
           --hall-N е наситеният тон за графика (икони, рамки, ленти) — праг 3:1.
           --hall-N-rgb го дава като тройка за прозрачните подложки.
           --hall-N-t е текстовият вариант; той служи и за плътен фон
           под --on-fill, затова държи 4.5:1 и в двете посоки. */
        --hall-1: #ff7a5c;  --hall-1-rgb: 255,122,92;  --hall-1-t: #ff8f74;   /* тухла */
        --hall-2: #f5b23c;  --hall-2-rgb: 245,178,60;  --hall-2-t: #f7c05c;   /* охра */
        --hall-3: #a98bfa;  --hall-3-rgb: 169,139,250;  --hall-3-t: #b9a0ff;   /* виолетово */
        --hall-4: #2fc9d8;  --hall-4-rgb: 47,201,216;  --hall-4-t: #4bd6e2;   /* тюркоаз */
        --hall-5: #f472b6;  --hall-5-rgb: 244,114,182;  --hall-5-t: #f98fc6;   /* слива */
        --hall-6: #a3e635;  --hall-6-rgb: 163,230,53;  --hall-6-t: #b2ec55;   /* маслина */
        --hall-0: #8fa0b3;  --hall-0-rgb: 143,160,179;  --hall-0-t: #a3b4c6;   /* без номер */
        /* Линията на иконите: златна в тъмната тема, както е зададена в
           иконния пакет; в светлите остава неутрална. */
        --icon-nav: #e1a53f;

        /* RGB тройки за прозрачните варианти на semantic цветовете.
           Досега тези rgba() бяха изписани с фиксирани числа от старата
           палитра и не следваха темата. */
        --gold-rgb: 224,137,28;
        --green-rgb: 47,214,127;
        --red-rgb: 255,90,90;
        --amber-rgb: 255,176,46;
        --blue-rgb: 77,156,255;
        --purple-rgb: 169,139,255;

        /* ── Височина: меки, не тежки сенки ── */
        --shadow-1: 0 1px 2px rgba(0,0,0,.5);
        --shadow-2: 0 6px 18px rgba(0,0,0,.45);
        --shadow-3: 0 22px 52px rgba(0,0,0,.62);
        --shadow: var(--shadow-2);

        /* ── Радиуси: три стъпки + pill ── */
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --r-pill: 999px;

        /* ── Отстояния: 4px решетка ── */
        --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
        --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px;

        /* ── Типография ── */
        --font-ui: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-display: "Oswald", "DM Sans", "Segoe UI", sans-serif;
        --fs-page: 26px;   /* заглавие на страница  */
        --fs-section: 19px;/* заглавие на секция    */
        --fs-card: 15px;   /* заглавие на карта     */
        --fs-body: 14px;   /* основен текст         */
        --fs-meta: 12.5px; /* метаданни             */
        --fs-micro: 11px;  /* етикети над стойности */

        /* ── Фокус: два пръстена, четим върху всяка повърхност ── */
        --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold-2);

        /* ── Контроли ── */
        --control-h: 40px;      /* стандартна височина на бутон/поле   */
        --control-h-sm: 32px;   /* компактни контроли в плътни ленти   */

        /* Странично отстояние на работната рамка. Елементи, които трябва да
           „изтекат" до ръба (напр. лентата за прогрес), се изтеглят точно с
           тази стойност, за да не създават хоризонтално преливане. */
        --shell-pad: 24px;

        /* Ширина на страничната навигация */
        --sidebar-w: 236px;

        color-scheme: dark;
      }
      /* Системните падащи менюта се рисуват от браузъра — задаваме им явно
         цветовете, за да следват темата, а не UA подразбирането. */
      select option { color: var(--text); background: var(--panel); }

      /* ══════════════════════════════════════════════════════════════
         СВЕТЛА ТЕМА — същата система, обърнати повърхности.
         Всеки текстов цвят е проверен за ≥4.5:1 спрямо най-светлата
         повърхност, върху която се използва; плътните бутони носят бяло
         мастило с ≥4.5:1. Превключва се от Настройки.
         ══════════════════════════════════════════════════════════════ */
      :root[data-theme="light"] {
        --bg: #f4f6f8;
        --bg-2: #e9edf2;
        --panel: #ffffff;
        --panel-2: #eef1f5;
        --panel-3: #f7f9fb;
        --panel-2-hover: #e4e9ef;
        --row-alt: rgba(16,24,40,.025);
        --surface: var(--panel);
        --surface-raised: var(--panel-2);
        --surface-sunken: var(--panel-3);

        --border: #dfe4ea;
        --border-strong: #c8d0da;
        --border-subtle: #ecf0f4;
        --border-control: #727d8b;

        --text: #1d2430;
        --muted: #56606e;
        --muted-2: #5f6a78;

        --gold: #a84f07;
        --gold-2: #8c4106;
        --gold-ink: #ffffff;
        --logo-ink: #172A3A;      /* марков цвят на логото (светла тема) */
        --gold-soft: rgba(168,79,7,.10);
        --gold-line: rgba(168,79,7,.32);
        --on-fill: #ffffff;
        --on-heat: #ffffff;

        --green: #0f7a45;   --green-2: #0b6238;
        --green-dark: #0b6238; --green-soft: rgba(15,122,69,.10);
        --red: #c62a26;     --red-2: #a51f1c;
        --red-dark: #a51f1c;   --red-soft: rgba(198,42,38,.10);
        --amber: #965404;   --amber-2: #7c4503;
        --amber-soft: rgba(150,84,4,.10);
        --blue: #1668c4;    --blue-2: #1153a0;
        --blue-soft: rgba(22,104,196,.10);
        --purple: #6b41d8;  --purple-2: #5834b5;
        --purple-soft: rgba(107,65,216,.10);

        --c-brand:  #c2660a;
        --c-green:  #16a34a;
        --c-red:    #dc2626;
        --c-blue:   #2563eb;
        --c-purple: #7c3aed;
        --c-teal:   #0d9488;
        --c-amber:  #b8860b;
        --c-pink:   #db2777;
        --c-lime:   #5c920c;

        /* Идентичност на залите — виж коментара в основната палитра. */
        --hall-1: #d9451f;  --hall-1-rgb: 217,69,31;  --hall-1-t: #ad2e11;   /* тухла */
        --hall-2: #bd7c00;  --hall-2-rgb: 189,124,0;  --hall-2-t: #815800;   /* охра */
        --hall-3: #6d4ceb;  --hall-3-rgb: 109,76,235;  --hall-3-t: #5133c9;   /* виолетово */
        --hall-4: #0b8f9c;  --hall-4-rgb: 11,143,156;  --hall-4-t: #08656d;   /* тюркоаз */
        --hall-5: #cc3f92;  --hall-5-rgb: 204,63,146;  --hall-5-t: #9e246a;   /* слива */
        --hall-6: #55911c;  --hall-6-rgb: 85,145,28;  --hall-6-t: #3c6a10;   /* маслина */
        --hall-0: #5c6b7f;  --hall-0-rgb: 92,107,127;   --hall-0-t: #48566a;   /* без номер */
        --icon-nav: #536071;

        --gold-rgb: 168,79,7;
        --green-rgb: 15,122,69;
        --red-rgb: 198,42,38;
        --amber-rgb: 150,84,4;
        --blue-rgb: 22,104,196;
        --purple-rgb: 107,65,216;

        --shadow-1: 0 1px 2px rgba(16,24,40,.06);
        --shadow-2: 0 2px 8px rgba(16,24,40,.08);
        --shadow-3: 0 16px 40px rgba(16,24,40,.16);
        --shadow: var(--shadow-2);

        --selection-bg: rgba(149,89,11,.20);
        --selection-fg: #1d2430;

        --focus-ring: 0 0 0 2px var(--panel), 0 0 0 4px var(--gold);

        color-scheme: light;
      }
      /* ══════════════════════════════════════════════════════════════
         ОРАНЖЕВА ТЕМА — светла работна повърхност с оранжев акцент и
         петролено син контрапункт. Същата система, трети набор стойности.
         Контрастите са проверени по същия критерий като другите две.
         ══════════════════════════════════════════════════════════════ */
      :root[data-theme="orange"] {
        --bg: #f5f6f8;
        --bg-2: #ebedf0;
        --panel: #ffffff;
        --panel-2: #f1f3f6;
        --panel-3: #f9fafb;
        --panel-2-hover: #e7eaee;
        --row-alt: rgba(31,42,55,.022);
        --surface: var(--panel);
        --surface-raised: var(--panel-2);
        --surface-sunken: var(--panel-3);

        --border: #e5e8ec;
        --border-strong: #cdd3da;
        --border-subtle: #eff1f4;
        --border-control: #727d8b;

        --text: #1f2a37;
        --muted: #525c68;
        --muted-2: #5a6470;

        /* Марковият акцент тук е оранжев */
        --gold: #bb400a;
        --gold-2: #9c3507;
        --gold-ink: #ffffff;
        --gold-soft: rgba(187,64,10,.10);
        --gold-line: rgba(187,64,10,.32);
        --logo-ink: #134b5f;      /* логото застава в петролено синьо */
        --on-fill: #ffffff;
        --on-heat: #ffffff;

        --green: #0f7a45;   --green-2: #0b6238;
        --green-dark: #0b6238; --green-soft: rgba(15,122,69,.10);
        --red: #c62a26;     --red-2: #a51f1c;
        --red-dark: #a51f1c;   --red-soft: rgba(198,42,38,.10);
        --amber: #965404;   --amber-2: #7c4503;
        --amber-soft: rgba(150,84,4,.10);
        --blue: #0d6f8c;    --blue-2: #0a5a73;   /* петрол */
        --blue-soft: rgba(13,111,140,.10);
        --purple: #6b41d8;  --purple-2: #5834b5;
        --purple-soft: rgba(107,65,216,.10);

        --c-brand:  #ea580c;
        --c-green:  #16a34a;
        --c-red:    #dc2626;
        --c-blue:   #0e7490;
        --c-purple: #7c3aed;
        --c-teal:   #0d9488;
        --c-amber:  #b8860b;
        --c-pink:   #db2777;
        --c-lime:   #5c920c;

        /* Идентичност на залите — виж коментара в основната палитра. */
        --hall-1: #d9451f;  --hall-1-rgb: 217,69,31;  --hall-1-t: #ad2e11;   /* тухла */
        --hall-2: #bd7c00;  --hall-2-rgb: 189,124,0;  --hall-2-t: #815800;   /* охра */
        --hall-3: #6d4ceb;  --hall-3-rgb: 109,76,235;  --hall-3-t: #5133c9;   /* виолетово */
        --hall-4: #0b8f9c;  --hall-4-rgb: 11,143,156;  --hall-4-t: #08656d;   /* тюркоаз */
        --hall-5: #cc3f92;  --hall-5-rgb: 204,63,146;  --hall-5-t: #9e246a;   /* слива */
        --hall-6: #55911c;  --hall-6-rgb: 85,145,28;  --hall-6-t: #3c6a10;   /* маслина */
        --hall-0: #5c6b7f;  --hall-0-rgb: 92,107,127;   --hall-0-t: #48566a;   /* без номер */
        --icon-nav: #536071;

        --gold-rgb: 187,64,10;
        --green-rgb: 15,122,69;
        --red-rgb: 198,42,38;
        --amber-rgb: 150,84,4;
        --blue-rgb: 13,111,140;
        --purple-rgb: 107,65,216;

        --shadow-1: 0 1px 2px rgba(31,42,55,.06);
        --shadow-2: 0 2px 8px rgba(31,42,55,.08);
        --shadow-3: 0 16px 40px rgba(31,42,55,.16);
        --shadow: var(--shadow-2);

        --selection-bg: rgba(194,65,12,.18);
        --selection-fg: #1f2a37;

        --focus-ring: 0 0 0 2px var(--panel), 0 0 0 4px var(--gold);

        color-scheme: light;
      }

      /* Атмосферният слой е ефект за тъмната тема — на светъл фон
         петната изглеждат като зацапване, затова се неутрализират. */
      :root[data-theme="light"] .bloom-layer,
      :root[data-theme="orange"] .bloom-layer { display: none; }
      /* Полетата за дата ползват системна палитра */
      :root[data-theme="light"] .day-date-input,
      :root[data-theme="orange"] .day-date-input { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        background-color: var(--bg);
        background-image: var(--bg-depth, none);
        background-attachment: fixed;
        color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--fs-body);
        line-height: 1.55;
      }

      button, input, select, textarea { font: inherit; }
      input, textarea { -webkit-user-select: text; user-select: text; }

      #app { position: relative; z-index: 1; }
      #modals { position: relative; z-index: 100; }
      .app-shell { min-height: 100vh; padding: var(--shell-pad) var(--shell-pad) var(--s7); }

      /* ── Оформление: странична навигация + работна зона ── */
      .app-layout {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        gap: var(--s5);
        align-items: start;
        width: min(1680px, 100%);
        margin: 0 auto;
      }
      .workspace { min-width: 0; }

      .sidebar {
        /* sticky прави собствен слой; без явен z-index картите от
           работната зона се рисуват върху разгънатото търсене. */
        position: sticky; top: var(--shell-pad); z-index: 30;
        display: flex; flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: var(--s4) var(--s3);
        height: calc(100vh - 2 * var(--shell-pad));
        overflow-y: auto; overscroll-behavior: contain;
      }

      /* Без навигация (QR достъп / качване от телефон) лентата не заема
         колона — подрежда се хоризонтално над съдържанието. */
      .app-layout.no-nav { grid-template-columns: minmax(0, 1fr); }
      .app-layout.no-nav .sidebar {
        position: static; height: auto; margin-bottom: var(--s4);
      }
      .app-layout.no-nav .topbar { flex-direction: row; align-items: center; }
      .app-layout.no-nav .topbar-meta { flex-direction: row; flex-wrap: wrap; margin-top: 0; }
      .app-layout.no-nav .product-strip { margin-bottom: 0; }

      @media (max-width: 768px) { :root { --shell-pad: 16px; } .app-shell { padding-bottom: var(--s6); } }
      @media (max-width: 430px) { :root { --shell-pad: 12px; } .app-shell { padding-bottom: var(--s5); } }



      .product-strip {
        position: relative;
        display: flex; align-items: center;
        gap: var(--s3); margin-bottom: var(--s4); color: var(--muted);
        min-height: 44px; padding: 0 var(--s2);
      }
      .product-strip-left {
        display: flex; align-items: center; gap: var(--s3);
        margin: 0;
      }
      .product-strip-status {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }

      /* Логото носи собствения си двоен пръстен — стои на прозрачен фон,
         без плочка отдолу (изрично изискване на марковия пакет). */
      .brand-badge {
        width: 40px; height: 40px;
        display: block; flex-shrink: 0;
        color: var(--logo-ink);
      }

      .brand-meta strong {
        display: block; color: var(--text); font-family: var(--font-display);
        font-size: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
        line-height: 1.2;
      }
      .brand-meta span {
        font-size: var(--fs-micro); letter-spacing: .12em; text-transform: uppercase;
        color: var(--muted-2);
      }

      .topbar-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .topbar {
        display: flex; flex-direction: column; flex: 1;
        gap: var(--s4); padding: 0;
        border: none; border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      /* Навигацията се чете като списък — един елемент на ред */
      .topbar-nav {
        display: flex; flex-direction: column; gap: 2px;
        align-items: stretch;
      }
      /* Контекстът (локация, търсене, ефекти) сяда в дъното на лентата */
      .topbar-meta {
        display: flex; flex-wrap: wrap; gap: var(--s2);
        align-items: center; margin-top: auto; padding-top: var(--s4);
        border-top: 1px solid var(--border-subtle);
        color: var(--muted); white-space: nowrap;
      }
      .topbar-meta > .meta-chip { flex: 1 1 100%; justify-content: center; }

      /* === SEARCH BAR === */
      .search-wrap { position: relative; display: block; margin-bottom: var(--s4); }
      .search-btn-icon {
        display: flex; align-items: center; gap: var(--s2);
        width: 100%; min-height: var(--control-h);
        padding: 0 var(--s3); border-radius: var(--r-md);
        border: 1px solid var(--border); background: var(--panel-2);
        color: var(--muted-2); cursor: pointer; text-align: left;
        font-family: var(--font-ui); font-size: var(--fs-meta);
        transition: background .15s, color .15s, border-color .15s;
      }
      .search-btn-icon:hover { background: var(--panel-2-hover); color: var(--text); border-color: var(--border-strong); }
      .search-btn-icon:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .search-btn-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .search-btn-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      /* Разгънатото търсене застава върху самото поле в лентата.
         Позицията се изчислява при отваряне — панелът е fixed, за да не
         го отрязва скролът на страничната лента. */
      .search-field-wrap {
        position: fixed;
        top: 0; left: 0;
        width: min(420px, calc(100vw - 24px));
        z-index: 300;
        display: none;
      }
      .search-field-wrap.open { display: block; }
      .search-field-inner {
        display: flex; align-items: center; gap: 8px;
        border: 1px solid var(--gold-line); border-radius: 999px;
        background: var(--panel-2);
        box-shadow: var(--shadow-3);
      }
      .search-icon-inner { margin-left: 14px; color: var(--muted); flex-shrink: 0; }
      .search-icon-inner svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .search-input {
        flex: 1; background: transparent; border: none; outline: none;
        color: var(--text); font-size: 14px; height: 44px;
        caret-color: var(--gold);
      }
      .search-input::placeholder { color: var(--muted); }
      .search-clear {
        display: flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border-radius: 50%; margin-right: 6px;
        border: none; background: transparent; cursor: pointer; color: var(--muted);
        transition: background .15s, color .15s, transform .15s;
        flex-shrink: 0;
      }
      .search-clear:hover { background: var(--panel-2-hover); color: var(--text); transform: scale(1.1); }
      .search-clear svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .search-dropdown {
        position: absolute; top: calc(100% + 8px); left: 0; right: 0;
        background: var(--panel);
        border: 1px solid var(--border); border-radius: 16px;
        box-shadow: var(--shadow-3);
        /* Дългият списък се скролва, вместо да бъде отрязан. */
        max-height: min(60vh, 420px); overflow-y: auto; overscroll-behavior: contain;
        z-index: 301;
      }
      .search-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px; cursor: pointer;
        transition: background .15s; border-bottom: 1px solid var(--border-subtle);
      }
      .search-item:last-child { border-bottom: none; }
      .search-item:hover, .search-item.focused { background: rgba(var(--gold-rgb),.1); }
      .search-item-icon { flex-shrink: 0; width: 32px; display: inline-flex; align-items: center; justify-content: center; color: var(--gold-2); }
      /* Дългите имена се съкращават с многоточие, вместо да излизат вън. */
      .search-item-body { min-width: 0; flex: 1; }
      .search-item-label { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .search-item-sub { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .search-item-arrow { margin-left: auto; color: var(--muted); font-size: 16px; flex-shrink: 0; }
      .search-no-results { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }

      .meta-chip {
        display: inline-flex; align-items: center;
        min-height: var(--control-h-sm);
        padding: 0 var(--s3); border-radius: var(--r-pill);
        background: var(--panel-2); border: 1px solid var(--border);
        font-size: var(--fs-meta); color: var(--muted);
      }

      /* ══════════════════════════════════════════════════════════════
         BUTTONS — един силует, пет семантични варианта.
         Плътни повърхности, без градиенти и без "подскачане" при hover;
         състоянието се чете по фон и контур, не по движение.
         ══════════════════════════════════════════════════════════════ */
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        gap: var(--s2);
        min-height: var(--control-h);
        border: 1px solid transparent; border-radius: var(--r-md);
        padding: 0 var(--s4); cursor: pointer;
        position: relative; isolation: isolate;
        font-family: var(--font-ui);
        font-weight: 600; font-size: var(--fs-body); letter-spacing: .01em;
        line-height: 1.2; text-align: center;
        transition: background .15s ease, border-color .15s ease, color .15s ease;
      }
      .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .btn:disabled, .btn[disabled], .btn[aria-disabled="true"] {
        opacity: .5; cursor: not-allowed;
      }
      /* .btn стои и върху <div> (CTA в картите за избор) — там остава
         блоков елемент на цял ред, както беше досега. */
      div.btn { display: flex; width: 100%; }

      /* Primary — марковото действие. Единственото плътно златно на екрана. */
      .btn-gold {
        background: var(--gold); color: var(--gold-ink); font-weight: 700;
        border-color: var(--gold);
      }
      .btn-gold:hover { background: var(--gold-2); border-color: var(--gold-2); }
      .btn-gold:active { background: #b56a13; border-color: #b56a13; }

      /* Neutral — вторични действия */
      .btn-outline {
        background: var(--panel-2); color: var(--text);
        border-color: var(--border-strong);
      }
      .btn-outline:hover { background: var(--panel-2-hover); border-color: var(--border-control); }
      .btn-outline:active { background: var(--panel-3); }

      /* Positive */
      .btn-green {
        background: var(--green-soft); color: var(--green-2);
        border-color: rgba(var(--green-rgb),.42);
      }
      .btn-green:hover { background: rgba(var(--green-rgb),.22); border-color: var(--green); }

      /* Destructive / negative */
      .btn-red {
        background: var(--red-soft); color: var(--red-2);
        border-color: rgba(var(--red-rgb),.42);
      }
      .btn-red:hover { background: rgba(var(--red-rgb),.22); border-color: var(--red); }

      /* Informational */
      .btn-secondary {
        background: var(--blue-soft); color: var(--blue-2);
        border-color: rgba(var(--blue-rgb),.38);
      }
      .btn-secondary:hover { background: rgba(var(--blue-rgb),.22); border-color: var(--blue); }
      /* ── Навигация: активният елемент се чете по фон + долен маркер ── */
      .nav-btn {
        display: flex; align-items: center; gap: var(--s2);
        width: 100%; min-height: var(--control-h);
        background: transparent; border: 1px solid transparent;
        color: var(--muted); border-radius: var(--r-md);
        padding: 0 var(--s3) 0 calc(var(--s3) + 3px);
        font-family: var(--font-ui); font-size: var(--fs-body); font-weight: 600;
        letter-spacing: .01em; cursor: pointer; text-decoration: none;
        text-align: left; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
        position: relative;
        transition: color .15s ease, background .15s ease, border-color .15s ease;
      }
      /* Активният елемент се маркира с кант отляво — както се чете списък */
      .nav-btn::after {
        content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
        width: 3px; border-radius: 0 2px 2px 0; background: var(--gold-2);
        opacity: 0; transition: opacity .15s ease;
        pointer-events: none;
      }
      .nav-btn:hover { color: var(--text); background: var(--panel-2); }
      .nav-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .nav-btn.state {
        color: var(--gold-2);
        background: var(--gold-soft);
        border-color: var(--gold-line);
      }
      .nav-btn.state::after { opacity: 1; }
      .nav-btn.cooldown { opacity: .5; cursor: not-allowed; pointer-events: none; }
      /* Иконите носят цвета от иконния пакет — златна линия в тъмната тема.
         Активният и посоченият ред минават към акцентното злато. */
      .nav-btn .cg-icon { color: var(--icon-nav); }
      .nav-btn:hover .cg-icon,
      .nav-btn.state .cg-icon { color: var(--gold-2); }

      .page { padding: 0 0 var(--s6); }
      .grid { display: grid; gap: var(--s3); }
      .cards-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      /* ── Панел: една плътна повърхност, хоризонтален контур, без градиент ── */
      .panel {
        background: var(--panel);
        border: 1px solid var(--border); border-radius: var(--r-lg);
        padding: var(--s5); box-shadow: var(--shadow-1);
      }
      .panel-soft {
        background: var(--panel);
        border-color: var(--gold-line);
      }

      /* ── Заглавия: sentence case, без разредка, ясна стълбица ── */
      .hero-title, .section-title {
        margin: 0 0 var(--s2); font-family: var(--font-display);
        font-weight: 600; letter-spacing: 0; text-transform: none;
        color: var(--text); line-height: 1.25;
      }
      .hero-title { font-size: var(--fs-page); }
      .section-title { font-size: var(--fs-section); }
      .muted { color: var(--muted); }
      .muted-2 { color: var(--muted-2); }

      /* ── Hero: компактна лента, а не декоративен банер на половин екран ── */
      .hero-grid {
        display: grid; grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--s5); align-items: center;
      }
      .hero-copy {
        display: flex; flex-direction: column;
        justify-content: center; min-height: 0;
      }
      .hero-kicker {
        color: var(--gold-2); font-family: var(--font-ui);
        font-size: var(--fs-micro); font-weight: 700; letter-spacing: .14em;
        text-transform: uppercase; margin-bottom: var(--s2);
      }
      .hero-orbit {
        min-height: 0;
        width: 76px; height: 76px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .hero-orbit::before, .hero-orbit::after { content: none; }

      .hero-core {
        width: 60px; height: 60px;
        display: block;
        color: var(--logo-ink);
      }
      .hero-metrics {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--s2); margin-top: var(--s4);
      }
      .metric {
        padding: var(--s3); border-radius: var(--r-md);
        background: var(--panel-2); border: 1px solid var(--border);
      }
      .metric-label {
        color: var(--muted); font-size: 11px;
        letter-spacing: .12em; text-transform: uppercase;
      }
      .metric-value { font-family: "Oswald", sans-serif; font-size: 26px; margin-top: 6px; }

      .stat {
        text-align: center;
        background: var(--panel-2);
      }
      .stat strong {
        display: block; font-family: var(--font-display);
        font-size: 30px; font-weight: 600; margin-top: var(--s2);
      }

      /* ── Карти за избор: реален размер на съдържанието, без празен банер ── */
      .card-pick {
        cursor: pointer; overflow: hidden; padding: 0;
        transition: border-color .15s ease, background .15s ease;
      }
      .card-pick:hover { border-color: var(--border-strong); }
      .card-pick:focus-visible { outline: none; box-shadow: var(--focus-ring); }

      /* Заглавие и категориен етикет са в отделни колони — така никога не се
         застъпват, независимо от дължината на текста. */
      .card-head {
        padding: var(--s4) var(--s4) var(--s3); min-height: 0;
        display: grid; column-gap: var(--s3);
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "title label" "sub label";
        align-items: center;
        border-bottom: 1px solid var(--border-subtle);
      }
      .card-head > div:nth-of-type(1) { grid-area: title; min-width: 0; }
      .card-head > div:nth-of-type(2) { grid-area: sub;   min-width: 0; }
      .card-text-icon {
        grid-area: label; align-self: center;
        font-family: var(--font-display); font-weight: 600;
        font-size: var(--fs-card); letter-spacing: .12em; text-transform: uppercase;
        color: var(--muted-2); pointer-events: none;
        line-height: 1.2; text-align: right; max-width: 130px;
      }
      /* На тесни екрани етикетът минава над заглавието — без притискане */
      @media (max-width: 560px) {
        .card-head {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: "label" "title" "sub";
          row-gap: var(--s1);
        }
        .card-text-icon { text-align: left; max-width: 100%; }
      }

      /* ── Бутон "Назад": неутрален, не марков акцент ── */
      .btn-back {
        display: inline-flex; align-items: center; gap: var(--s1);
        min-height: var(--control-h-sm);
        background: var(--panel-2); border: 1px solid var(--border-strong);
        border-radius: var(--r-md); color: var(--text); padding: 0 var(--s3);
        font-size: var(--fs-meta); font-weight: 600; cursor: pointer; white-space: nowrap;
        transition: background .15s ease, border-color .15s ease;
        line-height: 1;
      }
      .btn-back::before { content: none; }
      .btn-back:hover { background: var(--panel-2-hover); border-color: var(--border-control); }
      .btn-back:focus-visible { outline: none; box-shadow: var(--focus-ring); }

      .card-body {
        padding: var(--s4);
        background: transparent;
      }

      .tag-list { display: flex; flex-wrap: wrap; gap: var(--s1); margin-bottom: var(--s3); }
      .tag {
        font-size: var(--fs-micro); padding: 3px var(--s2); border-radius: var(--r-sm);
        border: 1px solid var(--border);
        color: var(--muted); background: var(--panel-2);
      }

      /* ── Полета: единна височина, четим контур, ясен фокус ── */
      .field { display: grid; gap: var(--s2); margin-bottom: var(--s4); }
      .field label {
        font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase;
        letter-spacing: .12em; font-family: var(--font-ui); font-weight: 700;
      }
      .field input, .field select, .field textarea {
        width: 100%; min-height: var(--control-h);
        background: var(--panel-3); color: var(--text);
        border: 1px solid var(--border-control); border-radius: var(--r-md);
        padding: var(--s2) var(--s3); direction: ltr; unicode-bidi: plaintext;
        font-size: var(--fs-body);
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        outline: none; border-color: var(--gold-2);
        box-shadow: 0 0 0 3px rgba(233,168,68,.22);
      }
      .field input::placeholder, .field textarea::placeholder { color: var(--muted-2); }

      /* ── Редове за проверка: статусът се чете по ляв кант + фон + етикет ── */
      .items { display: grid; gap: var(--s2); }
      .item-row {
        display: grid; grid-template-columns: 1fr 240px;
        gap: var(--s4); align-items: center;
        background: var(--panel-2); border: 1px solid var(--border);
        border-left: 3px solid var(--border-strong); border-radius: var(--r-md);
        padding: var(--s3) var(--s4); transition: background .15s ease, border-color .15s ease;
      }
      .item-row.clean { border-left-color: var(--green); background: var(--green-soft); }
      .item-row.dirty { border-left-color: var(--red);   background: var(--red-soft); }
      .item-row.missing { border-left-color: var(--amber); }
      .item-title { font-weight: 700; margin-bottom: 2px; }
      /* Иконата на точката стои на реда на текста и носи цвета на темата. */
      .item-sym { display: inline-flex; vertical-align: -4px; color: var(--icon-nav); }

      .status-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
      .status-btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: var(--control-h);
        border: 1px solid var(--border-strong); border-radius: var(--r-md);
        padding: 0 var(--s2); cursor: pointer;
        background: var(--panel-2); color: var(--text);
        font-family: var(--font-ui); font-weight: 600; font-size: var(--fs-body);
        letter-spacing: .01em;
        transition: background .15s ease, border-color .15s ease, color .15s ease;
      }
      .status-btn::before { content: none; }
      .status-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .status-btn[data-value="clean"]:hover { border-color: var(--green); color: var(--green-2); }
      .status-btn[data-value="dirty"]:hover { border-color: var(--red);   color: var(--red-2); }
      .status-btn.active.clean {
        background: var(--green); border-color: var(--green); color: var(--on-fill); font-weight: 700;
      }
      .status-btn.active.dirty {
        background: var(--red); border-color: var(--red); color: var(--on-fill); font-weight: 700;
      }

      .toolbar {
        display: flex; flex-wrap: wrap; justify-content: space-between;
        align-items: center; gap: var(--s3); margin-bottom: var(--s4);
      }

      /* ── Таблици: работен инструмент — плътни, четими, ясен header ── */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border); border-radius: var(--r-md);
        background: var(--panel-3);
      }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left; padding: var(--s3);
        border-bottom: 1px solid var(--border-subtle);
        font-size: var(--fs-body); vertical-align: middle;
      }
      th {
        color: var(--muted); font-size: var(--fs-micro); text-transform: uppercase;
        letter-spacing: .1em; font-family: var(--font-ui); font-weight: 700;
        background: var(--panel-3); white-space: nowrap;
        border-bottom: 1px solid var(--border);
      }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:nth-child(even) td { background: var(--row-alt); }
      tbody tr:hover td { background: var(--panel-2); }

      /* ── Status pill: фон + контур + текст, не само цвят ── */
      .pill {
        display: inline-block; padding: 3px var(--s2);
        border-radius: var(--r-sm); font-size: var(--fs-meta); font-weight: 700;
        white-space: nowrap;
      }
      .pill.ok  { color: var(--green-2); background: var(--green-soft); }
      .pill.bad { color: var(--red-2);   background: var(--red-soft); }

      .progress { height: 6px; background: var(--panel-3); border-radius: var(--r-pill); overflow: hidden; }
      .progress > div { height: 100%; background: var(--c-brand); transition: width .3s ease; }

      .tabs { display: flex; gap: var(--s2); flex-wrap: wrap; }
      .tab {
        display: inline-flex; align-items: center; min-height: var(--control-h-sm);
        background: var(--panel-2); color: var(--muted);
        border: 1px solid var(--border); border-radius: var(--r-md);
        padding: 0 var(--s3); cursor: pointer; font-weight: 600;
        transition: background .15s ease, color .15s ease, border-color .15s ease;
      }
      .tab:hover { color: var(--text); border-color: var(--border-strong); }
      .tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .tab.active { color: var(--gold-2); border-color: var(--gold-line); background: var(--gold-soft); }

      .bars { display: grid; gap: var(--s2); }
      .bar-label { display: flex; justify-content: space-between; margin-bottom: var(--s1); gap: var(--s2); }
      .bar-track { height: 8px; background: var(--panel-3); border-radius: var(--r-pill); overflow: hidden; }
      .bar-fill { height: 100%; border-radius: var(--r-pill); transition: width .4s ease; }

      .footer-bar {
        margin-top: var(--s6); display: flex; justify-content: space-between;
        gap: var(--s4); flex-wrap: wrap; align-items: center;
        color: var(--muted-2); padding: var(--s4) 2px 0;
        border-top: 1px solid var(--border-subtle);
      }
      .footer-links, .footer-icons { display: flex; flex-wrap: wrap; gap: var(--s2); font-size: var(--fs-meta); }
      .footer-icons span, .footer-links span {
        padding: var(--s1) var(--s2); border-radius: var(--r-sm);
        background: var(--panel); border: 1px solid var(--border);
      }

      /* ── Модали: ясно отделен слой, четлив header/content/footer ── */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,.72);
        display: flex; align-items: center; justify-content: center;
        padding: var(--s5); z-index: 40;
        animation: fadeIn .2s ease;
      }
      .modal {
        width: min(520px, 100%);
        max-height: calc(100vh - 2 * var(--s5));
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border-strong); border-radius: var(--r-lg);
        padding: var(--s5); box-shadow: var(--shadow-3);
        animation: slideUp .25s ease;
      }
      .toast {
        position: fixed; right: var(--s5); bottom: var(--s5); z-index: 50;
        padding: var(--s3) var(--s4); border-radius: var(--r-md); color: var(--text);
        border: 1px solid var(--border-strong); box-shadow: var(--shadow-3);
        background: var(--panel-2);
        animation: slideIn .3s ease;
      }
      .toast.success { background: var(--panel-2); border-color: var(--green); }
      .toast.error   { background: var(--panel-2); border-color: var(--red); }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes liveBlink { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(var(--green-rgb),.6); } 50% { opacity: .6; box-shadow: 0 0 8px 2px rgba(var(--green-rgb),.8); } }
      .live-dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: var(--green); margin-right: 6px; vertical-align: middle;
        animation: liveBlink 1.5s ease-in-out infinite;
      }

      /* Декоративна метла в background – не пречи на кликове */
      .broom-fun {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 80px; z-index: 0; pointer-events: none;
        overflow: hidden;
      }
      .broom-sweep {
        position: absolute; bottom: 12px; left: -60px;
        font-size: 42px; opacity: .35;
        animation: sweepAcross 18s ease-in-out infinite;
      }
      .broom-dust {
        position: absolute; bottom: 24px; width: 6px; height: 6px;
        border-radius: 50%; background: rgba(255,255,255,.25);
        pointer-events: none;
      }
      .broom-dust:nth-child(1) { left: 8%; animation: dustFade 18s ease-in-out infinite 0s; }
      .broom-dust:nth-child(2) { left: 22%; animation: dustFade 18s ease-in-out infinite 1.5s; }
      .broom-dust:nth-child(3) { left: 38%; animation: dustFade 18s ease-in-out infinite 3s; }
      .broom-dust:nth-child(4) { left: 55%; animation: dustFade 18s ease-in-out infinite 4.5s; }
      .broom-dust:nth-child(5) { left: 72%; animation: dustFade 18s ease-in-out infinite 6s; }
      .broom-dust:nth-child(6) { left: 88%; animation: dustFade 18s ease-in-out infinite 7.5s; }
      @keyframes sweepAcross {
        0%, 100% { transform: translateX(0) rotate(-5deg); }
        25% { transform: translateX(25vw) rotate(2deg); }
        50% { transform: translateX(50vw) rotate(-3deg); }
        75% { transform: translateX(75vw) rotate(2deg); }
        100% { transform: translateX(100vw) translateX(60px) rotate(-5deg); }
      }
      @keyframes dustFade {
        0%, 10%, 90%, 100% { opacity: 0; transform: scale(0.8); }
        25%, 50%, 75% { opacity: .4; transform: scale(1); }
      }

      @media (max-width: 980px) {
        .hero-grid, .cards-2, .cards-4, .cg-chart-grid { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: stretch; }
        .topbar-meta { justify-content: flex-start; flex-wrap: wrap; }
        .product-strip {
          flex-direction: column;
          justify-content: center;
          text-align: center;
          gap: 10px;
        }
        .product-strip-left { justify-content: center; }
        .product-strip-status {
          position: static;
          transform: none;
        }
      }
      @media (max-width: 900px) {
        .item-row { grid-template-columns: 1fr; }
      }

      /* ── Charts Screen ── */
      .charts-loading {
        display: flex; align-items: center; justify-content: center;
        gap: 14px; padding: 80px 20px; color: var(--muted); font-size: 15px;
      }
      .charts-stat-row {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: var(--s3); margin-bottom: var(--s5);
      }
      .charts-stat-pill {
        display: flex; flex-direction: column; align-items: flex-start;
        gap: var(--s1); padding: var(--s4);
        background: var(--panel);
        border: 1px solid var(--border); border-radius: var(--r-md);
        text-align: left;
      }
      .charts-stat-pill strong { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; }
      .charts-stat-pill span  { font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
      .charts-grid {
        display: grid; grid-template-columns: repeat(2, 1fr);
        gap: var(--s4); margin-bottom: var(--s4);
      }
      @media (max-width: 860px) {
        .charts-grid { grid-template-columns: 1fr; }
        .charts-stat-row { grid-template-columns: repeat(2, 1fr); }
      }
      .chart-card.full-width { grid-column: 1 / -1; }
      .charts-table {
        width: 100%; border-collapse: collapse; font-size: 13px;
      }
      .charts-table th {
        text-align: left; padding: var(--s2) var(--s3);
        font-family: var(--font-ui); font-weight: 700;
        font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .1em;
        color: var(--muted); border-bottom: 1px solid var(--border);
        background: var(--panel-3); white-space: nowrap;
      }
      .charts-table td {
        padding: var(--s2) var(--s3);
        border-bottom: 1px solid var(--border-subtle);
        color: var(--muted);
      }
      .charts-table tr:last-child td { border-bottom: none; }
      .charts-table tr:hover td { background: var(--panel-2); }
      .charts-bar-bg {
        background: var(--panel-3); border-radius: var(--r-pill); height: 8px; width: 100%; max-width: 200px;
      }
      .charts-bar-fill {
        background: var(--c-brand); border-radius: var(--r-pill); height: 100%;
      }
      .charts-bar-fill--green { background: var(--c-green); }
      .charts-bar-fill--red { background: var(--c-red); }
      .charts-bar-fill--blue { background: var(--c-blue); }
      .charts-bar-fill--purple { background: var(--c-purple); }
      .charts-html-list { display: flex; flex-direction: column; gap: var(--s2); }
      .charts-html-row { display: flex; align-items: center; gap: var(--s3); font-size: var(--fs-body); padding: var(--s1) 0; border-radius: var(--r-sm); transition: background .15s ease; }
      .charts-html-row:hover { background: var(--panel-2); }
      .charts-html-row span:first-child { min-width: 90px; color: var(--muted); flex-shrink: 0; }
      .charts-html-row span:last-child { min-width: 32px; text-align: right; font-weight: 600; color: var(--text); }
      .charts-html-row .charts-bar-bg { flex: 1; max-width: none; height: 10px; }
      /* KPI cards */
      .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s3); margin-bottom: var(--s4); }
      .kpi-card { padding: var(--s4); border-radius: var(--r-md); border: 1px solid var(--border); background: var(--panel); transition: border-color .15s ease; }
      .kpi-card:hover { border-color: var(--border-strong); }
      .kpi-card .kpi-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.15; }
      .kpi-card .kpi-label { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: var(--s1); }
      .kpi-card .kpi-badge { font-size: var(--fs-micro); padding: 2px var(--s2); border-radius: var(--r-sm); margin-top: var(--s2); display: inline-block; }
      @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 500px) { .kpi-row { grid-template-columns: 1fr; } }
      /* Donut */
      .charts-donut-wrap { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; min-height: 180px; }
      .charts-donut { width: 140px; height: 140px; border-radius: 50%; position: relative; flex-shrink: 0; }
      .charts-donut-center { position: absolute; inset: 50%; transform: translate(-50%, -50%); width: 70%; height: 70%; background: var(--panel-2); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      /* Vertical bars (time-series) */
      .charts-vertical-wrap { display: flex; align-items: flex-end; gap: 12px; height: 200px; padding: 0 8px; }
      .charts-vertical-col { flex: 1; min-width: 36px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .daily-bar-track { width: 100%; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; background: var(--panel-3); border-radius: var(--r-sm) var(--r-sm) 0 0; overflow: hidden; }
      .daily-bar-fill { width: 100%; min-height: 8px; border-radius: 6px 6px 0 0; background: var(--c-brand); transition: height .25s ease; }
      /* Hourly histogram */
      .hourly-histogram { display: flex; align-items: flex-end; gap: 4px; height: 200px; padding: 0 4px; }
      .hourly-col { flex: 1; min-width: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
      .hourly-bar-track { width: 100%; height: 160px; display: flex; flex-direction: column; justify-content: flex-end; background: var(--panel-3); border-radius: var(--r-sm) var(--r-sm) 0 0; overflow: visible; }
      .hourly-bar-fill { width: 100%; min-height: 2px; border-radius: var(--r-sm) var(--r-sm) 0 0; background: var(--c-purple); transition: height .25s ease; }
      .hourly-label { font-size: 9px; color: var(--muted-2); }
      .hourly-value { font-size: 9px; font-weight: 700; color: var(--text); }
      /* Leaderboard */
      .leaderboard-item { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r-sm); margin-bottom: var(--s1); transition: background .15s ease; }
      .leaderboard-item:hover { background: var(--panel-2); }
      .leaderboard-rank { width: 26px; height: 26px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-meta); flex-shrink: 0; }
      .leaderboard-rank.top1 { background: var(--c-brand); color: var(--on-fill); }
      .leaderboard-rank.top2 { background: var(--border-control); color: var(--text); }
      .leaderboard-rank.top3 { background: var(--border-strong); color: var(--text); }
      .leaderboard-rank.other { background: var(--panel-3); color: var(--muted); }
      .leaderboard-avatar { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--gold-soft); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-body); color: var(--gold-2); flex-shrink: 0; }
      .leaderboard-bar { flex: 1; height: 8px; background: var(--panel-3); border-radius: var(--r-pill); overflow: hidden; }
      .leaderboard-bar-fill { height: 100%; border-radius: var(--r-pill); transition: width .25s ease; }
      /* Issue analysis */
      .issue-item { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r-sm); margin-bottom: var(--s1); border-left: 3px solid var(--red); background: var(--red-soft); transition: background .15s ease; }
      .issue-item:hover { background: rgba(var(--red-rgb),.2); }
      .issue-severity { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .issue-severity.high { background: var(--c-red); }
      .issue-severity.med { background: var(--c-amber); }
      .issue-severity.low { background: var(--muted-2); }
      .issue-count { font-weight: 700; color: var(--red-2); min-width: 24px; text-align: right; }
      .issue-pct { font-size: var(--fs-micro); color: var(--muted); }
      /* Grouped distribution */
      .zone-group { margin-bottom: var(--s4); }
      .zone-group-title { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: var(--s2); padding-bottom: var(--s1); border-bottom: 1px solid var(--border-subtle); }
      .zone-item { display: flex; align-items: center; gap: var(--s3); padding: var(--s1) 0; font-size: var(--fs-body); }
      .zone-item .charts-bar-bg { flex: 1; max-width: none; height: 8px; }
      /* Heatmap */
      .heatmap-grid { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; padding: 12px 0; }
      .heatmap-cell { aspect-ratio: 1; min-height: 20px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; transition: outline-color .15s ease; outline: 1px solid transparent; }
      .heatmap-cell:hover { outline-color: var(--border-control); }
      .heatmap-cell.has-data { color: var(--on-heat); }
      .heatmap-cell.empty { background: var(--panel-3); color: transparent; }
      .heatmap-legend { display: flex; justify-content: space-between; font-size: var(--fs-micro); color: var(--muted); margin-top: var(--s2); }
      .chart-card {
        background: var(--panel);
        border: 1px solid var(--border); border-radius: var(--r-lg);
        padding: var(--s5); position: relative; overflow: hidden;
        transition: border-color .15s ease;
      }
      .chart-card:hover { border-color: var(--border-strong); }
      /* Категорията на картата се маркира с тънка лента отгоре, не с фонов градиент */
      .chart-card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: var(--c-brand);
        pointer-events: none;
      }
      .chart-card.card-donut::before  { background: var(--c-green); }
      .chart-card.card-issues::before { background: var(--c-red); }
      .chart-card.card-time::before   { background: var(--c-purple); }
      .chart-title {
        font-weight: 600; font-size: var(--fs-card); color: var(--text); margin-bottom: 2px;
        font-family: var(--font-display); letter-spacing: 0;
      }
      .chart-subtitle {
        font-size: var(--fs-meta); color: var(--muted); margin-bottom: var(--s4);
        text-transform: none; letter-spacing: 0;
      }
      .chart-wrap { position: relative; }
      .chart-empty {
        display: flex; align-items: center; justify-content: center;
        height: 100%; min-height: 120px; color: var(--muted); font-size: var(--fs-body);
      }

      /* ── Bloom Background Effect (PC + мобилни + таблети) ── */
      .bloom-layer {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 0; overflow: hidden;
        min-height: 100vh; min-height: 100dvh;
        -webkit-backface-visibility: hidden; backface-visibility: hidden;
        transform: translateZ(0); -webkit-transform: translateZ(0);
      }
      /* Атмосферен слой — дискретна топла светлина в ъглите, не цветни петна.
         Остава активен, защото FX превключвателят го включва и изключва. */
      .bloom-orb {
        position: absolute; border-radius: 50%;
        filter: blur(90px); -webkit-filter: blur(90px);
        animation: bloomPulse 14s ease-in-out infinite;
        will-change: opacity;
        -webkit-backface-visibility: hidden; backface-visibility: hidden;
        transform: translateZ(0); -webkit-transform: translateZ(0);
      }
      .bloom-orb--gold {
        width: 55vw; height: 55vw; top: -14%; left: -12%;
        background: radial-gradient(circle, rgba(var(--gold-rgb),.10), rgba(var(--gold-rgb),.03) 40%, transparent 70%);
        animation-duration: 15s; animation-delay: 0s;
      }
      .bloom-orb--blue {
        width: 45vw; height: 45vw; top: 10%; right: -12%;
        background: radial-gradient(circle, rgba(120,140,170,.07), rgba(120,140,170,.02) 40%, transparent 70%);
        animation-duration: 17s; animation-delay: -4s;
      }
      .bloom-orb--red {
        width: 42vw; height: 42vw; bottom: 6%; left: 18%;
        background: radial-gradient(circle, rgba(150,120,110,.05), transparent 60%);
        animation-duration: 19s; animation-delay: -7s;
      }
      .bloom-orb--gold2 {
        width: 35vw; height: 35vw; bottom: 14%; right: 0%;
        background: radial-gradient(circle, rgba(var(--gold-rgb),.07), rgba(var(--gold-rgb),.02) 40%, transparent 70%);
        animation-duration: 16s; animation-delay: -2s;
      }
      .bloom-orb--purple {
        width: 38vw; height: 38vw; top: 50%; left: 50%;
        margin-left: -19vw; margin-top: -19vw;
        background: radial-gradient(circle, rgba(130,125,155,.04), transparent 60%);
        animation-duration: 18s; animation-delay: -9s;
      }
      /* По-малък blur на мобилни (рендира се по-евтино), същата дискретност */
      @media (max-width: 1024px) {
        .bloom-orb { filter: blur(60px); -webkit-filter: blur(60px); }
      }
      @media (max-width: 768px) {
        .bloom-orb { filter: blur(50px); -webkit-filter: blur(50px); }
      }
      @keyframes bloomPulse {
        0%, 100% { opacity: .8; }
        50%      { opacity: 1; }
      }

      /* ── Low Performance Mode ── */
      body.low-perf .bloom-layer { display: none; }
      body.low-perf .broom-fun { display: none; }
      body.low-perf .live-dot { animation: none; box-shadow: none; }
      body.low-perf .topbar { backdrop-filter: none; }
      body.low-perf .card-pick { transition: none; }
      body.low-perf .card-pick:hover { transform: none; box-shadow: var(--shadow); }
      body.low-perf .btn, body.low-perf .nav-btn, body.low-perf .status-btn, body.low-perf .tab { transition: none; }
      body.low-perf .btn::before, body.low-perf .nav-btn::before, body.low-perf .status-btn::before, body.low-perf .btn-back::before { transition: none; }
      body.low-perf .btn:hover, body.low-perf .nav-btn:hover, body.low-perf .status-btn:hover, body.low-perf .tab:hover { transform: none; }
      body.low-perf .btn:hover::before, body.low-perf .nav-btn:hover::before, body.low-perf .status-btn:hover::before { transform: none; opacity: 0; }
      body.low-perf .modal { animation: none; }
      body.low-perf .modal-backdrop { animation: none; }
      body.low-perf .toast { animation: none; }
      body.low-perf .item-row { transition: none; }
      body.low-perf { background-image: none; }
      body.low-perf .bar-fill { transition: none; }
      body.low-perf .progress > div { transition: none; }
      body.low-perf .progress > div::after { animation: none; display: none; }
      body.low-perf .item-row:hover { transform: none; box-shadow: none; }
      body.low-perf .toast { backdrop-filter: none; }
      body.low-perf .modal-backdrop { backdrop-filter: none; }
      body.low-perf .card-pick:hover::after { opacity: 0; }
      body.low-perf .hero-orbit { display: none; }
      body.low-perf {
        background: var(--bg) !important;
      }

      @media print {
        .bloom-layer, .app-shell, .broom-fun { display: none !important; }
        #qr-modal-backdrop { position: static !important; background: #fff !important; padding: 20px !important; width: 100% !important; min-height: 100vh !important; }
        .qr-modal { box-shadow: none !important; border: 1px solid #ddd !important; max-width: 100% !important; }
      }

      /* ── Google Reviews ── */
      .cg-reviews-wrap { padding: var(--s6) 0 var(--s2); }
      .cg-reviews-kicker { text-transform: uppercase; letter-spacing: .14em; font-size: var(--fs-micro); color: var(--gold-2); font-weight: 700; margin-bottom: var(--s1); }
      .cg-reviews-heading { font-size: var(--fs-section); font-weight: 600; color: var(--text); margin-bottom: var(--s3); font-family: var(--font-display); }
      .cg-overall { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
      .cg-overall-num { font-size: 30px; font-weight: 600; color: var(--gold-2); line-height: 1; font-family: var(--font-display); }
      .cg-overall-stars { color: var(--gold-2); font-size: 16px; }
      .cg-overall-count { color: var(--muted); font-size: var(--fs-body); }
      .cg-reviews-grid { display: grid; gap: var(--s3); }
      .cg-review-card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--r-md); padding: var(--s4); position: relative; overflow: hidden;
        opacity: 0; transform: translateY(10px);
        transition: background .15s, border-color .15s;
        animation: cgFadeUp .4s forwards;
      }
      .cg-review-card:hover { background: var(--panel-2); border-color: var(--border-strong); }
      .cg-quote-deco { display: none; }
      .cg-review-header { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
      .cg-avatar { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--gold-soft); display: flex; align-items: center; justify-content: center; font-size: var(--fs-meta); font-weight: 700; color: var(--gold-2); flex-shrink: 0; }
      .cg-author { font-weight: 600; font-size: var(--fs-body); color: var(--text); }
      .cg-date { font-size: var(--fs-micro); color: var(--muted-2); }
      .cg-review-stars { color: var(--gold-2); font-size: var(--fs-meta); margin-bottom: var(--s1); }
      .cg-review-text { font-size: var(--fs-body); color: var(--muted); line-height: 1.6; }
      .cg-reviews-link { display: inline-block; margin-top: var(--s3); color: var(--gold-2); font-size: var(--fs-meta); text-decoration: none; border-bottom: 1px solid var(--gold-line); padding-bottom: 1px; }
      .cg-reviews-link:hover { border-color: var(--gold-2); }
      .cg-reviews-loading { display: flex; align-items: center; gap: var(--s3); color: var(--muted); font-size: var(--fs-body); padding: var(--s4) 0; }
      /* ══ Spokes — единственият индикатор за зареждане в приложението ══
         Използва се навсякъде: fetch, запис, преход между екрани, бутон в
         изчакване, зареждане на модал или таблица. Друг spinner, точки или
         skeleton не се добавят.
         Наследява currentColor, за да върви и с трите палитри, и с
         акцентния цвят на мястото, където стои. Скоростта се задава с
         --duration (по подразбиране 1s). */
      @keyframes loading-ui-spokes-spin { to { transform: rotate(360deg); } }
      .cg-spokes {
        width: 24px; height: 24px; flex-shrink: 0;
        display: inline-block; vertical-align: middle; color: currentColor;
        animation: loading-ui-spokes-spin var(--duration, 1s) linear infinite;
      }
      .cg-spokes.sm { width: 16px; height: 16px; }
      .cg-spokes.lg { width: 40px; height: 40px; }
      /* Икономичният режим и намалената анимация само забавят въртенето —
         индикаторът трябва да остане видим, за да се разбира, че се чака. */
      body.low-perf .cg-spokes { --duration: 2s; }
      @media (prefers-reduced-motion: reduce) { .cg-spokes { --duration: 2.4s; } }
      @keyframes cgFadeUp { to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 600px) {
        .cg-reviews-heading { font-size: 17px; }
        .cg-review-card { padding: 12px 14px; }
      }

      /* ── Важно съобщение: сериозен акцент, без пулсиране и сияние ── */
      .cg-ann-banner {
        background: var(--red-soft);
        border: 1px solid rgba(var(--red-rgb),.42);
        border-left: 3px solid var(--red);
        border-radius: var(--r-md); padding: var(--s4);
        display: flex; gap: var(--s3); align-items: flex-start;
        margin-bottom: var(--s4);
        position: relative;
      }
      .cg-ann-banner::before { content: none; }
      .cg-ann-icon  { font-size: 20px; line-height: 1; padding-top: 1px; flex-shrink: 0; }
      .cg-ann-body  { flex: 1; min-width: 0; }
      .cg-ann-label { font-size: var(--fs-micro); font-weight: 700; letter-spacing: .12em;
                      color: var(--red-2); margin-bottom: var(--s1); text-transform: uppercase; }
      .cg-ann-text  { font-size: var(--fs-body); font-weight: 600; color: var(--text);
                      white-space: pre-wrap; line-height: 1.55; word-break: break-word; }
      .cg-ann-date  { font-size: var(--fs-meta); color: var(--muted-2); margin-top: var(--s2); }
      .cg-ann-date strong { color: var(--muted); }
      .cg-ann-btns  { display: flex; gap: var(--s1); flex-shrink: 0; flex-direction: column; }
      .cg-ann-btn   { background: var(--panel-2); border: 1px solid var(--border-strong);
                      color: var(--text); border-radius: var(--r-sm);
                      min-height: var(--control-h-sm); padding: 0 var(--s3);
                      font-size: var(--fs-meta); cursor: pointer; font-family: inherit;
                      transition: background .15s, border-color .15s; white-space: nowrap; }
      .cg-ann-btn:hover { background: var(--panel-2-hover); border-color: var(--border-control); }

      /* ── Индикатор в навигацията ── */
      .cg-ann-dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--red);
        display: inline-block; margin-left: var(--s1); vertical-align: middle;
      }
      body.low-perf .cg-ann-banner { animation: none; }
      body.low-perf .cg-ann-icon { animation: none; }
      body.low-perf .cg-ann-dot  { animation: none; }

      /* Добавяне на съобщение — неутрална, ненатрапчива покана */
      .cg-ann-add-btn {
        width: 100%; min-height: var(--control-h); border-radius: var(--r-md);
        font-size: var(--fs-meta); font-weight: 600;
        border: 1px dashed var(--border-strong);
        color: var(--muted); background: transparent;
        cursor: pointer; font-family: inherit; margin-bottom: var(--s4);
        transition: background .15s, color .15s, border-color .15s;
        display: block; text-align: center;
      }
      .cg-ann-add-btn:hover { background: var(--panel); color: var(--text);
                               border-color: var(--border-control); }
      /* Modal overlay */
      .cg-ann-overlay {
        position: fixed; inset: 0; z-index: 500;
        background: rgba(0,0,0,.72); backdrop-filter: blur(3px);
        display: flex; align-items: center; justify-content: center;
        padding: var(--s5);
      }
      .cg-ann-overlay[hidden] { display: none !important; }
      .cg-ann-modal-box {
        background: var(--panel); border-radius: var(--r-lg);
        border: 1px solid var(--border-strong); padding: var(--s5);
        width: 100%; max-width: 420px;
        box-shadow: var(--shadow-3);
        position: relative;
      }
      .cg-ann-modal-title { font-size: var(--fs-card); font-weight: 700; margin-bottom: var(--s3);
                             display: flex; align-items: center; gap: var(--s2); }
      .cg-ann-modal-input {
        width: 100%; padding: var(--s2) var(--s3); border-radius: var(--r-md);
        background: var(--panel-3); border: 1px solid var(--border-control);
        color: var(--text); font-size: var(--fs-body); font-family: inherit;
        box-sizing: border-box; resize: vertical; min-height: 100px;
      }
      .cg-ann-modal-input[type="password"] { min-height: var(--control-h); resize: none; }
      .cg-ann-modal-input:focus { outline: none; border-color: var(--gold-2);
                                   box-shadow: 0 0 0 3px rgba(233,168,68,.22); }
      .cg-ann-modal-err { color: var(--red-2); font-size: var(--fs-meta); margin-top: var(--s1); min-height: 16px; }
      .cg-ann-modal-hint { color: var(--muted); font-size: var(--fs-meta); margin-bottom: var(--s3); }
      .cg-ann-modal-actions { display: flex; gap: var(--s2); margin-top: var(--s3); justify-content: flex-end; }
      .cg-ann-modal-save {
        min-height: var(--control-h); padding: 0 var(--s5); border-radius: var(--r-md);
        font-size: var(--fs-body); font-weight: 700;
        background: var(--red); color: var(--on-fill); border: 1px solid var(--red);
        cursor: pointer; font-family: inherit; transition: background .15s;
      }
      .cg-ann-modal-save:hover { background: #eb7d7d; }
      .cg-ann-modal-cancel {
        min-height: var(--control-h); padding: 0 var(--s4); border-radius: var(--r-md);
        font-size: var(--fs-body); font-weight: 600;
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border-strong); cursor: pointer; font-family: inherit;
      }
      .cg-ann-modal-cancel:hover { background: var(--panel-2-hover); }

      /* ── Филтър по дата: компактна лента с еднакви по височина контроли ── */
      .day-filter-bar { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-bottom: var(--s3); }
      .day-filter-btn {
        display: inline-flex; align-items: center; min-height: var(--control-h-sm);
        padding: 0 var(--s3); border-radius: var(--r-sm);
        font-size: var(--fs-meta); font-weight: 600;
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border); cursor: pointer;
        transition: background .15s, color .15s, border-color .15s;
        font-family: inherit;
      }
      .day-filter-btn:hover { background: var(--panel-2-hover); border-color: var(--border-strong); }
      .day-filter-btn.active { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
      .day-filter-sep { color: var(--muted-2); font-size: var(--fs-meta); padding: 0 2px; }
      .day-date-input {
        min-height: var(--control-h-sm); padding: 0 var(--s2); border-radius: var(--r-sm);
        font-size: var(--fs-meta);
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border);
        font-family: inherit; cursor: pointer;
        color-scheme: dark;
      }
      .day-date-input:focus { outline: none; border-color: var(--gold-2); box-shadow: 0 0 0 3px rgba(233,168,68,.22); }

      /* Мини календар */
      .day-cal-popup {
        position: absolute; z-index: 300; top: calc(100% + 6px); left: 0;
        background: var(--panel); border: 1px solid var(--border-strong);
        border-radius: var(--r-md); padding: var(--s3); box-shadow: var(--shadow-3);
        display: none; min-width: 280px;
      }
      .day-cal-popup.open { display: block; }
      .day-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); }
      .day-cal-nav {
        background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer;
        font-size: 16px; min-width: 32px; min-height: 32px; border-radius: var(--r-sm);
      }
      .day-cal-nav:hover { background: var(--panel-2); color: var(--text); }
      .day-cal-title { font-size: var(--fs-body); font-weight: 600; color: var(--text); }
      .day-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
      .day-cal-wday { text-align: center; font-size: 10px; color: var(--muted-2); padding: var(--s1) 0; font-weight: 700; }
      .day-cal-cell {
        text-align: center; font-size: var(--fs-meta); padding: 7px 2px; border-radius: var(--r-sm);
        cursor: pointer; color: var(--text); transition: background .15s, color .15s;
        border: 1px solid transparent;
      }
      .day-cal-cell:hover:not(.empty):not(.disabled) { background: var(--panel-2); }
      .day-cal-cell.empty { cursor: default; }
      .day-cal-cell.disabled { color: var(--muted-2); opacity: .45; cursor: default; }
      .day-cal-cell.today { border-color: var(--gold-line); }
      .day-cal-cell.in-range { background: var(--gold-soft); border-radius: 0; }
      .day-cal-cell.range-start, .day-cal-cell.range-end { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
      .day-cal-cell.range-start { border-radius: var(--r-sm) 0 0 var(--r-sm); }
      .day-cal-cell.range-end   { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
      .day-cal-cell.range-start.range-end { border-radius: var(--r-sm); }
      .day-cal-cell.has-data::after {
        content: ''; display: block; width: 4px; height: 4px; border-radius: 50%;
        background: var(--gold-2); margin: 1px auto 0;
      }
      .day-cal-cell.range-start.has-data::after,
      .day-cal-cell.range-end.has-data::after { background: var(--gold-ink); }
      .day-cal-actions { display: flex; gap: var(--s2); margin-top: var(--s3); justify-content: flex-end; }
      .day-cal-apply {
        min-height: var(--control-h-sm); padding: 0 var(--s4); border-radius: var(--r-sm);
        font-size: var(--fs-meta); font-weight: 700;
        background: var(--gold); color: var(--gold-ink); border: 1px solid var(--gold);
        cursor: pointer; font-family: inherit;
      }
      .day-cal-clear {
        min-height: var(--control-h-sm); padding: 0 var(--s3); border-radius: var(--r-sm);
        font-size: var(--fs-meta); font-weight: 600;
        background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
        cursor: pointer; font-family: inherit;
      }
      .day-cal-clear:hover { background: var(--panel-2-hover); }
      .day-cal-wrap { position: relative; display: inline-block; }
      .day-cal-trigger {
        min-height: var(--control-h-sm); padding: 0 var(--s3); border-radius: var(--r-sm);
        font-size: var(--fs-meta); font-weight: 600;
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border); cursor: pointer;
        font-family: inherit; display: flex; align-items: center; gap: var(--s1);
        transition: background .15s, border-color .15s;
      }
      .day-cal-trigger:hover { background: var(--panel-2-hover); border-color: var(--border-strong); }
      .day-cal-trigger.has-range { border-color: var(--gold-line); color: var(--gold-2); }
      .day-cal-max-note { font-size: 10px; color: var(--muted-2); margin-top: var(--s1); text-align: center; }

      /* ════════════════════════════════════════════════════════════
         ФИНИ ДЕТАЙЛИ — рендеринг, скролбари, състояния на компонентите.
         Дълбочината идва от повърхности и контури, не от сияние.
         ════════════════════════════════════════════════════════════ */

      /* По-чист рендеринг на текста */
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

      /* Маркиране на текст в марковите цветове */
      ::selection { background: var(--selection-bg); color: var(--selection-fg); }
      ::-moz-selection { background: var(--selection-bg); color: var(--selection-fg); }

      /* Скролбари — неутрални, в тон с повърхностите */
      * { scrollbar-width: thin; scrollbar-color: var(--border-control) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: var(--r-pill); border: 2px solid transparent; background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-control); background-clip: padding-box; }

      /* Панели — само промяна на контура, без повдигане */
      .panel { transition: border-color .15s ease; }

      /* Карти за избор — фокусът и hover се четат по контура */
      .card-pick::after { content: none; }

      /* Полета — hover подсказва интерактивност */
      .field input, .field select, .field textarea {
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .field input:hover:not(:focus), .field select:hover:not(:focus), .field textarea:hover:not(:focus) {
        border-color: var(--border-control); background: var(--panel-2);
      }
      .field textarea { resize: vertical; min-height: 96px; line-height: 1.55; }

      /* Pills — контур за повече дефиниция */
      .pill.ok  { box-shadow: inset 0 0 0 1px rgba(var(--green-rgb),.34); }
      .pill.bad { box-shadow: inset 0 0 0 1px rgba(var(--red-rgb),.34); }
      .pill { letter-spacing: .01em; }

      .meta-chip { transition: border-color .15s ease, color .15s ease; }
      .meta-chip:hover { border-color: var(--border-strong); }

      /* Toasts — статусът се чете по цветна точка + контур, не по сияние */
      .toast {
        display: flex; align-items: center; gap: var(--s3);
        font-weight: 600; max-width: min(380px, calc(100vw - 40px));
      }
      .toast::before {
        content: ""; width: 8px; height: 8px; border-radius: 50%;
        flex-shrink: 0;
      }
      .toast.success { color: var(--green-2); }
      .toast.success::before { background: var(--green); }
      .toast.error { color: var(--red-2); }
      .toast.error::before { background: var(--red); }

      .modal-backdrop { backdrop-filter: blur(3px); }

      /* Редове за проверка — фонът се променя, редът не се мести */
      .item-row { transition: background .15s ease, border-color .15s ease; }
      .item-row:hover { border-color: var(--border-strong); }

      /* Tag pills — лек hover */
      .tag { transition: border-color .15s ease, color .15s ease, background .15s ease; }
      .tag:hover { border-color: var(--border-strong); color: var(--text); }

      /* Datalist input — стрелка-индикатор за падащ списък */
      input[list] { background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
        background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
        padding-right: 34px;
      }

      /* Единен видим фокус за всяка интерактивна повърхност */
      a:focus-visible, button:focus-visible, input:focus-visible,
      select:focus-visible, textarea:focus-visible,
      [role="switch"]:focus-visible, [tabindex]:focus-visible {
        outline: none; box-shadow: var(--focus-ring);
      }

      /* Достъпност — уважавай "по-малко движение" */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important; animation-iteration-count: 1 !important;
          transition-duration: .001ms !important; scroll-behavior: auto !important;
        }
      }

      /* ── Мигащ alert индикатор за просрочени проверки ── */
      .cg-overdue-alert {
        position: absolute; top: -6px; right: -6px;
        min-width: 20px; height: 20px; padding: 0 5px; border-radius: var(--r-pill);
        background: var(--red);
        color: var(--on-fill); font-weight: 700; font-size: var(--fs-meta);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-ui);
        box-shadow: 0 0 0 2px var(--panel);
        z-index: 2; pointer-events: none;
      }
      .cg-overdue-alert.warn {
